<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a18">
<meta name="description" content="MovieAll — stream movies, series and anime with a fast, clean player.">
<title>MovieAll — Movies, Series & Anime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ffb62e'/%3E%3Cpath d='M26 18v28l22-14z' fill='%231c1300'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a18;--bg2:#12102a;--surf:#1a1737;--surf2:#262149;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#f4f0e8;--mute:#a7a4c0;--dim:#78758f;
  --accent:#ffb62e;--accent-ink:#1c1300;--accent-soft:rgba(255,182,46,.14);
  --hot:#ff4f6d;--ok:#3ddc97;--warn:#ffb62e;
  --nav:68px;--tab:64px;--r:16px;--ease:cubic-bezier(.2,.8,.2,1);
  --pad:clamp(16px,4vw,56px);
  --f-display:'Bricolage Grotesque','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
body[data-mode=anime]{--accent:#b892ff;--accent-ink:#150a2b;--accent-soft:rgba(184,146,255,.16)}
body[data-mode=mb]{--accent:#36e0c0;--accent-ink:#031a15;--accent-soft:rgba(54,224,192,.14)}
body[data-mode=hub]{--accent:#ff8a5c;--accent-ink:#240b02;--accent-soft:rgba(255,138,92,.15)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surf2);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--surf2) transparent}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* progress bar */
#bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--accent);z-index:100;box-shadow:0 0 12px var(--accent);transition:width .3s var(--ease),opacity .4s;opacity:0;pointer-events:none}
#bar.on{opacity:1}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:60;display:flex;align-items:center;gap:clamp(14px,3vw,36px);padding:0 var(--pad);border-bottom:1px solid transparent;background:linear-gradient(rgba(12,10,24,.9),rgba(12,10,24,0));transition:background .3s,border-color .3s,backdrop-filter .3s}
.nav.solid{background:rgba(12,10,24,.8);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-color:var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.03em;flex:none}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .4s var(--ease)}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.logo-mark .ic{width:16px;height:16px;fill:currentColor;stroke:none;margin-left:2px}
.links{position:relative;display:flex;gap:4px;margin-right:auto}
.links a{position:relative;padding:8px 14px;border-radius:999px;color:var(--mute);font-weight:500;font-size:.95rem;transition:color .2s}
.links a:hover,.links a.on{color:var(--text)}
.links .ind{position:absolute;bottom:2px;left:0;height:3px;width:20px;border-radius:3px;background:var(--accent);transform:translateX(0);transition:transform .45s var(--ease),width .45s var(--ease),opacity .3s;opacity:0}
.nav-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.links+.nav-r{margin-left:0}
.search-btn{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--mute);transition:background .2s,border-color .2s,color .2s}
.search-btn:hover{background:rgba(255,255,255,.14);color:var(--text);border-color:var(--line2)}
.search-btn kbd{font:600 .72rem var(--f-body);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--mute)}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);transition:background .2s,transform .2s var(--ease),border-color .2s;flex:none}
.ibtn:hover{background:rgba(255,255,255,.16);border-color:var(--line2)}
.ibtn:active{transform:scale(.92)}
.ibtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* mobile tabbar */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(14,12,30,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:60;justify-content:space-around}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:.68rem;font-weight:600;position:relative;transition:color .2s}
.tabbar .on{color:var(--accent)}
.tabbar .on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}

/* layout */
main{min-height:100vh}
.page{padding:calc(var(--nav) + 26px) var(--pad) 80px;max-width:1720px;margin:0 auto;animation:pgin .5s var(--ease) both}
.page.bleed{padding-left:0;padding-right:0;padding-top:0;max-width:none}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.03em;line-height:1.05}
.h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,2vw,1.5rem);letter-spacing:-.02em}
.sub{color:var(--mute)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.phead p{color:var(--mute);margin-top:6px;max-width:60ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:.98rem;background:var(--accent);color:var(--accent-ink);transition:transform .25s var(--ease),box-shadow .25s,background .2s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px var(--accent)}
.btn:active{transform:scale(.97)}
.btn .ic{width:20px;height:20px}
.btn.play .ic{fill:currentColor;stroke:none}
.btn.glass{background:rgba(255,255,255,.14);color:var(--text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2)}
.btn.glass:hover{background:rgba(255,255,255,.22);box-shadow:none}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.line:hover{background:rgba(255,255,255,.08);box-shadow:none}
.btn.sm{height:38px;padding:0 16px;font-size:.88rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--mute);font-weight:600;font-size:.88rem;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease)}
.pill:hover{color:var(--text);border-color:var(--line2)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill:active{transform:scale(.96)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:.74rem;font-weight:700;background:rgba(10,8,22,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text)}
.chip .ic{width:12px;height:12px;fill:var(--accent);stroke:none}

/* hero */
.hero{position:relative;height:min(88vh,860px);min-height:540px;overflow:hidden;background:var(--bg2)}
.hslide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.1s var(--ease),visibility 0s 1.1s}
.hslide.on{opacity:1;visibility:visible;transition:opacity 1.1s var(--ease),visibility 0s}
.hslide img{width:100%;height:100%;object-fit:cover;object-position:center 20%;transform:scale(1.02)}
.hslide.on img{animation:kb 16s ease-out forwards}
@keyframes kb{to{transform:scale(1.11) translate3d(-1.2%,-1%,0)}}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(12,10,24,.94) 0%,rgba(12,10,24,.6) 36%,rgba(12,10,24,0) 72%),linear-gradient(0deg,var(--bg) 0%,rgba(12,10,24,0) 42%)}
.hcontent{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:clamp(96px,15vh,160px);max-width:700px}
.hcontent>*{animation:hin .8s var(--ease) both}
.hcontent>*:nth-child(2){animation-delay:.08s}.hcontent>*:nth-child(3){animation-delay:.16s}.hcontent>*:nth-child(4){animation-delay:.24s}
@keyframes hin{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;color:var(--mute);font-weight:500;font-size:.95rem}
.hmeta .tag{padding:3px 10px;border-radius:7px;border:1px solid var(--line2);font-size:.78rem;font-weight:700;color:var(--text)}
.hmeta .rate{color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.hmeta .rate .ic{width:15px;height:15px;fill:currentColor;stroke:none}
.htitle{font-family:var(--f-display);font-weight:800;font-size:clamp(2.5rem,7.2vw,5.6rem);line-height:.94;letter-spacing:-.045em;margin-bottom:16px;text-wrap:balance;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.hdesc{color:#d8d5e6;font-size:clamp(.95rem,1.4vw,1.08rem);max-width:56ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:24px}
.hbtns{display:flex;flex-wrap:wrap;gap:12px}
.hstrip{position:absolute;z-index:3;right:var(--pad);bottom:clamp(30px,6vh,56px);display:flex;gap:12px}
.hth{position:relative;width:clamp(74px,7.4vw,112px);aspect-ratio:2/3;border-radius:12px;overflow:hidden;opacity:.55;transform:translateY(0) scale(.94);transition:opacity .35s,transform .45s var(--ease),box-shadow .35s;border:1px solid var(--line2);background:var(--surf)}
.hth img{width:100%;height:100%;object-fit:cover}
.hth:hover{opacity:.9}
.hth.on{opacity:1;transform:translateY(-10px) scale(1);box-shadow:0 18px 40px -10px rgba(0,0,0,.7)}
.hth i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent)}
.hth.on i{animation:hprog var(--dur,8s) linear forwards}
.hero.paused .hth.on i{animation-play-state:paused}
@keyframes hprog{to{width:100%}}
.hdots{display:none}

/* rows */
.sec{margin:34px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 var(--pad);margin-bottom:12px}
.sec-h a{color:var(--mute);font-size:.88rem;font-weight:600;transition:color .2s}
.sec-h a:hover{color:var(--accent)}
.page:not(.bleed) .sec-h{padding:0}
.rowwrap{position:relative}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px var(--pad) 22px;scroll-padding:0 var(--pad);scrollbar-width:none;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{display:none}
.row>.card{flex:0 0 clamp(128px,14vw,190px);scroll-snap-align:start}
.row.wide>.card{flex-basis:clamp(240px,26vw,340px)}
.rar{position:absolute;top:8px;bottom:22px;width:clamp(44px,4vw,64px);z-index:5;display:grid;place-items:center;color:var(--text);opacity:0;transition:opacity .25s;background:linear-gradient(90deg,rgba(12,10,24,.92),rgba(12,10,24,0))}
.rar.r{right:0;background:linear-gradient(270deg,rgba(12,10,24,.92),rgba(12,10,24,0))}
.rar.l{left:0}
.rar .ic{width:30px;height:30px;transition:transform .25s var(--ease)}
.rar:hover .ic{transform:scale(1.25)}
@media(hover:hover) and (pointer:fine){.rowwrap:hover .rar{opacity:1}}
.rar[hidden]{display:none}

/* cards */
.card{display:block;position:relative;min-width:0}
.card .poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--surf);box-shadow:0 8px 24px -8px rgba(0,0,0,.6);transition:box-shadow .35s,transform .4s var(--ease)}
.wide .card .poster,.card.land .poster{aspect-ratio:16/9}
.poster img{width:100%;height:100%;object-fit:cover;animation:fadein .6s ease both;transition:transform .7s var(--ease)}
.poster.noimg::before{content:attr(data-i);position:absolute;inset:0;display:grid;place-items:center;font:800 2.4rem var(--f-display);color:var(--dim)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.poster .chip.tl{position:absolute;left:8px;top:8px}
.poster .chip.tr{position:absolute;right:8px;top:8px;color:var(--accent-ink);background:var(--accent)}
.poster .pov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:12px;background:linear-gradient(0deg,rgba(8,6,20,.92) 0%,rgba(8,6,20,.2) 55%,transparent 100%);opacity:0;transition:opacity .3s}
.pov .pbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transform:translateY(12px) scale(.8);transition:transform .4s var(--ease)}
.pov .pbtn .ic{width:20px;height:20px;fill:currentColor;stroke:none;margin-left:2px}
.poster .pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.poster .pbar i{display:block;height:100%;background:var(--accent)}
.ctitle{margin-top:10px;font-weight:600;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{color:var(--dim);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(hover:hover) and (pointer:fine){
  .card{transition:transform .4s var(--ease);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
  .card:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px)}
  .card:hover .poster{box-shadow:0 24px 44px -12px rgba(0,0,0,.85),0 0 0 2px var(--accent)}
  .card:hover .poster img{transform:scale(1.08)}
  .card:hover .pov{opacity:1}
  .card:hover .pbtn{transform:none}
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(128px,14vw,190px),1fr));gap:26px 16px}
.grid.land{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sentinel{height:60px;display:grid;place-items:center;color:var(--dim);font-size:.9rem;margin-top:16px}

/* skeleton */
.sk{background:linear-gradient(100deg,var(--surf) 30%,var(--surf2) 50%,var(--surf) 70%);background-size:220% 100%;animation:sh 1.4s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-220% 0}}
.skcard{flex:0 0 clamp(128px,14vw,190px)}
.skcard .sk:first-child{aspect-ratio:2/3;border-radius:14px}
.skcard .sk:nth-child(2){height:14px;margin-top:12px;width:80%}
.skcard .sk:nth-child(3){height:10px;margin-top:8px;width:45%}

/* states */
.state{display:grid;place-items:center;text-align:center;gap:14px;padding:60px 20px;color:var(--mute)}
.state .ic{width:44px;height:44px;color:var(--dim)}
.state h3{font-family:var(--f-display);font-size:1.3rem;color:var(--text)}
.state p{max-width:52ch}
.state.err .ic{color:var(--hot)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* explore tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:0 var(--pad)}
.tile{position:relative;overflow:hidden;border-radius:20px;padding:20px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surf);border:1px solid var(--line);transition:transform .4s var(--ease),border-color .3s}
.tile:hover{transform:translateY(-4px);border-color:var(--t)}
.tile .ic{width:28px;height:28px;color:var(--t)}
.tile b{font-family:var(--f-display);font-size:1.2rem;letter-spacing:-.02em}
.tile small{display:block;color:var(--mute);font-size:.82rem;font-weight:400}
.tile::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--t);opacity:.14;transition:transform .5s var(--ease),opacity .3s}
.tile:hover::after{transform:scale(1.8);opacity:.2}

/* title/detail */
.dhero{position:relative;min-height:min(72vh,620px);display:flex;align-items:flex-end;overflow:hidden}
.dbg{position:absolute;inset:0}
.dbg img{width:100%;height:100%;object-fit:cover;object-position:center 22%;animation:fadein 1s both}
.dhero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,rgba(12,10,24,.55) 55%,rgba(12,10,24,.7) 100%),linear-gradient(90deg,rgba(12,10,24,.85),transparent 65%)}
.dwrap{position:relative;z-index:2;width:100%;padding:calc(var(--nav) + 40px) var(--pad) 36px;display:flex;gap:clamp(20px,4vw,48px);align-items:flex-end}
.dposter{flex:none;width:clamp(150px,20vw,280px);aspect-ratio:2/3;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -20px #000;border:1px solid var(--line2);background:var(--surf)}
.dposter img{width:100%;height:100%;object-fit:cover}
.dinfo{min-width:0;max-width:820px}
.dinfo .h1{margin-bottom:12px;text-wrap:balance}
.dmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--mute);margin-bottom:14px}
.dmeta .rate{color:var(--accent);font-weight:700;display:inline-flex;gap:5px;align-items:center}
.dmeta .rate .ic{width:15px;height:15px;fill:currentColor;stroke:none}
.dmeta .tag{padding:3px 10px;border-radius:7px;border:1px solid var(--line2);font-size:.78rem;font-weight:700;color:var(--text)}
.dover{color:#d5d2e4;max-width:70ch;margin-bottom:22px}
.dbtns{display:flex;flex-wrap:wrap;gap:12px}
.dbody{padding:10px var(--pad) 80px;max-width:1720px;margin:0 auto}
.seasons{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.seasons::-webkit-scrollbar{display:none}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.ep{display:flex;gap:12px;padding:10px;border-radius:16px;background:var(--surf);border:1px solid var(--line);transition:transform .3s var(--ease),border-color .2s,background .2s;text-align:left;align-items:center;min-width:0}
.ep:hover{transform:translateY(-3px);border-color:var(--accent)}
.ep.on{border-color:var(--accent);background:var(--accent-soft)}
.ep .th{position:relative;flex:none;width:118px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--surf2);display:grid;place-items:center;color:var(--dim);font:800 1.3rem var(--f-display)}
.ep .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ep b{display:block;font-size:.92rem;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep small{color:var(--dim);font-size:.78rem}
.epnum{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.epnum .pill{justify-content:center;padding:0}

/* watch */

.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px var(--line);max-height:78vh;width:100%}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;color:var(--mute);background:#05040d;z-index:3;transition:opacity .4s}

.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surf);border:1px solid var(--line);margin:14px 0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.panel{animation:pgin .35s var(--ease) both}
.srv{display:flex;flex-wrap:wrap;gap:10px}
.note{padding:14px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line);color:var(--mute);font-size:.9rem;line-height:1.5}

.wside{min-width:0}
.wside .box{position:sticky;top:calc(var(--nav) + 14px);max-height:calc(100vh - var(--nav) - 34px);display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:20px;overflow:hidden}

/* mirrors / list rows */
.lrows{display:grid;gap:10px}

.ov{position:fixed;inset:0;z-index:90;background:rgba(8,6,20,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow-y:auto;animation:fadein .25s both}
.sbox{max-width:860px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 60px}

.sitem{display:flex;gap:14px;align-items:center;padding:8px;border-radius:14px;transition:background .2s}

/* sheet */
.sheet{position:fixed;inset:0;z-index:95;background:rgba(6,4,16,.6);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s both}

/* toasts */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:120;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:12px 20px;border-radius:999px;background:rgba(30,26,60,.96);border:1px solid var(--line2);box-shadow:0 20px 50px -10px #000;font-weight:500;font-size:.92rem;animation:tin .45s var(--ease) both;text-align:center}

/* forms */
.field{display:flex;gap:10px;align-items:center;height:54px;padding:0 8px 0 20px;border-radius:999px;background:var(--surf);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s;max-width:760px}

/* status */
.tst{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dim)}

.tst code{font:500 .82rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere}
.tst small{display:block;color:var(--dim);font-size:.78rem;margin-top:2px;overflow-wrap:anywhere}

/* modal */
.modal{position:fixed;inset:0;z-index:98;background:rgba(6,4,16,.85);backdrop-filter:blur(16px);display:grid;place-items:center;padding:20px;animation:fadein .25s both}
.modal .mb{width:min(960px,100%);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;position:relative}
.modal iframe{width:100%;height:100%;border:0}
.modal .ibtn{position:absolute;right:14px;top:14px;z-index:2}

/* ===== VIDEO PLAYER ===== */
.vp{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;outline:0;touch-action:manipulation;font-family:var(--f-body)}
.vp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

.vp.started .poster-bg{opacity:0;pointer-events:none}
.vp video::cue{background:rgba(0,0,0,.72);color:#fff;font-family:var(--f-body);font-size:1.15em}
.vp .center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.vp .bigplay{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;pointer-events:auto;box-shadow:0 0 0 0 var(--accent);transition:transform .35s var(--ease),opacity .3s;animation:ring 2.4s infinite}
.vp .bigplay .ic{width:34px;height:34px;fill:currentColor;stroke:none;margin-left:4px}
.vp .bigplay:hover{transform:scale(1.1)}
.vp.playing .bigplay,.vp.busy .bigplay,.vp.failed .bigplay{opacity:0;pointer-events:none;animation:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%,100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
.vp .spinner{position:absolute;width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:var(--accent);animation:rot .8s linear infinite;opacity:0;transition:opacity .2s}
.vp.busy .spinner{opacity:1}
.vp .flash{position:absolute;top:50%;transform:translateY(-50%);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;z-index:4;backdrop-filter:blur(6px)}
.vp .flash.l{left:8%}.vp .flash.r{right:8%}
.vp .flash.show{animation:flash .6s ease}
@keyframes flash{0%{opacity:0;transform:translateY(-50%) scale(.6)}30%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-50%) scale(1.1)}}
.vp .ui{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .35s;pointer-events:none}
.vp.idle.playing .ui{opacity:0}
.vp.idle.playing{cursor:none}
.vp .ui>*{pointer-events:auto}
.vp .top{display:flex;align-items:center;gap:12px;padding:14px 16px 40px;background:linear-gradient(rgba(0,0,0,.75),transparent)}
.vp .top .t{font-weight:700;font-size:1rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display)}
.vp .top .t small{display:block;font-weight:400;color:#cfcbe0;font-size:.78rem;font-family:var(--f-body)}
.vp .bottom{padding:44px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.vp .seek{position:relative;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.vp .seek .trk{position:relative;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.22);transition:height .15s}
.vp .seek:hover .trk,.vp .seek.drag .trk{height:7px}
.vp .seek .buf,.vp .seek .prg{position:absolute;left:0;top:0;bottom:0;border-radius:4px;width:0}
.vp .seek .buf{background:rgba(255,255,255,.35)}
.vp .seek .prg{background:var(--accent)}
.vp .seek .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);left:0;transform:scale(0);transition:transform .15s}
.vp .seek:hover .knob,.vp .seek.drag .knob{transform:scale(1)}
.vp .seek .tip{position:absolute;bottom:22px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.85);font-size:.76rem;font-weight:600;transform:translateX(-50%);opacity:0;pointer-events:none}
.vp .seek:hover .tip{opacity:1}
.vp .ctl{display:flex;align-items:center;gap:2px;margin-top:2px}
.vp .cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:background .2s,transform .2s var(--ease)}
.vp .cb:hover{background:rgba(255,255,255,.16)}
.vp .cb:active{transform:scale(.9)}
.vp .cb .ic{width:22px;height:22px}
.vp .cb.pp .ic,.vp .cb.nx .ic,.vp .cb.pv .ic{fill:currentColor;stroke:none}
.vp .time{font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums;margin:0 10px;color:#e6e3f2;white-space:nowrap}
.vp .sp{flex:1}
.vp .vol{display:flex;align-items:center}
.vp .vol input{width:0;opacity:0;transition:width .3s var(--ease),opacity .3s;accent-color:var(--accent);height:4px}
.vp .vol:hover input,.vp .vol:focus-within input{width:82px;opacity:1;margin-right:8px}
.vp .cb.txt{width:auto;min-width:42px;padding:0 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.vp .menu{position:absolute;right:14px;bottom:82px;z-index:8;min-width:210px;max-width:min(320px,88%);max-height:64%;overflow-y:auto;padding:8px;border-radius:16px;background:rgba(18,15,40,.96);backdrop-filter:blur(20px);border:1px solid var(--line2);box-shadow:0 30px 60px -10px #000;animation:pgin .25s var(--ease) both}

.afeat{position:relative;border-radius:28px;overflow:hidden;min-height:clamp(300px,42vw,420px);display:flex;align-items:flex-end;background:var(--surf);border:1px solid var(--line);margin-bottom:8px}

/* ---------- lazy script loader (with CDN fallback) ---------- */
const _sl={};
function loadScript(urls,test){
  const key=urls[0];
  if(test&&test())return Promise.resolve();
  if(_sl[key])return _sl[key];
  _sl[key]=(async()=>{
    for(const u of urls){
      try{
        await new Promise((res,rej)=>{
          const s=document.createElement('script');s.src=u;s.async=true;
          const to=setTimeout(()=>{s.remove();rej(new Error('timeout'))},14000);
          s.onload=()=>{clearTimeout(to);res()};
          s.onerror=()=>{clearTimeout(to);s.remove();rej(new Error('load'))};
          document.head.appendChild(s);
        });
        if(!test||test())return;
      }catch(e){}
    }
    delete _sl[key];
    throw new Error('Could not load the player library. Check your internet connection.');
  })();
  return _sl[key];
}

const DEFAULT_BASE='https://movieallshawon.vercel.app';
function computeBase(){

let BASE=computeBase();
const abs=u=>{
  if(!u)return'';u=String(u).trim();
  if(/^(https?:|blob:|data:)/i.test(u))return u;
  if(u.startsWith('//'))return'https:'+u;
  if(u.startsWith('/'))return BASE+u;

};
const _cache=new Map();
function friendlyErr(e){
  if(!e)return new Error('Something went wrong');
  if(e.name==='AbortError')return Object.assign(new Error('The server took too long to respond'),{kind:'timeout'});
  if(e instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(e.message||''))
    return Object.assign(new Error('Cannot reach the API. Check your internet connection — or the server may be blocking this site (CORS).'),{kind:'network'});
  return e;
}
async function api(path,opt={}){
  const{timeout=25000,retries=1,ttl=0}=opt;
  const url=/^https?:/i.test(path)?path:BASE+path;
  if(ttl){const c=_cache.get(url);if(c&&Date.now()-c.t<ttl)return c.v}
  let last;
  for(let a=0;a<=retries;a++){
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),timeout);
    try{
      const r=await fetch(url,{signal:ctrl.signal});
      clearTimeout(to);
      if(!r.ok){
        let body='';try{body=(await r.text()).replace(/\s+/g,' ').slice(0,140)}catch(e){}
        const er=new Error('Server error '+r.status+(body?': '+body:''));er.status=r.status;
        if(r.status<500&&r.status!==429){er.final=true}
        throw er;
      }
      let data;
      try{data=await r.json()}catch(e){const er=new Error('The server sent an unreadable response');er.final=true;throw er}
      if(ttl)_cache.set(url,{t:Date.now(),v:data});
      return data;
    }catch(e){
      clearTimeout(to);last=e;
      if(e.final)break;
      if(a<retries)await sleep(700*(a+1));
    }
  }
  throw friendlyErr(last);
}

/* ---------- data normalisers (tolerant of unknown shapes) ---------- */
function normTmdb(it){
  if(!it)return null;
  const id=String(it.tmdb_id||it.id||'');
  if(!id)return null;
  const tv=it.type==='tv'||it.media==='tv'||it.media_type==='tv';
  return{src:'tmdb',id,media:tv?'tv':'movie',title:it.name||it.title||'Untitled',year:it.year||String(it.release_date||it.first_air_date||'').slice(0,4),
    rating:Number(it.rating||it.vote_average||0),poster:it.poster||'',backdrop:it.backdrop||'',overview:it.overview||''};
}
const tmdbList=d=>(Array.isArray(d)?d:(d&&(d.items||d.results||d.tmdb||[]))||[]).map(normTmdb).filter(Boolean);

const SUBJ_ID=o=>o&&(o.subject_id||o.subjectId||o.subjectid||null);
function isSubj(o){return!!(o&&typeof o==='object'&&!Array.isArray(o)&&(SUBJ_ID(o)||(o.subject&&typeof o.subject==='object'&&SUBJ_ID(o.subject))))}
function normMb(raw){
  const o=SUBJ_ID(raw)?raw:Object.assign({},raw.subject||{},raw);
  const id=String(SUBJ_ID(o)||'');
  if(!id)return null;
  let cover=o.cover||o.poster||o.image||o.thumbnail||o.cover_url||o.coverUrl||o.stills||'';
  if(cover&&typeof cover==='object')cover=cover.url||cover.src||cover.thumbnail||'';
  const st=o.subject_type!=null?o.subject_type:o.subjectType;
  const tv=st==2||/tv|series|show/i.test(String(o.type||o.subject_type_name||o.media||''))||(o.seasons&&o.seasons.length>0);
  const rating=Number(o.imdb_rating||o.imdbRatingValue||o.rating||o.score||0);
  const year=String(o.year||o.release_date||o.releaseDate||'').slice(0,4);
  return{src:'mb',id,media:tv?'tv':'movie',title:o.title||o.name||'Untitled',year:/^\d{4}$/.test(year)?year:'',rating:isFinite(rating)?rating:0,
    poster:typeof cover==='string'?cover:'',overview:o.description||o.overview||o.summary||'',genre:o.genre||'',raw:o};
}
function mbSections(d){
  const secs=[];
  (function walk(n,ttl,depth){
    if(!n||typeof n!=='object'||depth>8)return;
    if(Array.isArray(n)){
      const subs=n.filter(isSubj);
      if(subs.length)secs.push({title:ttl||'Featured',items:subs});
      n.forEach(ch=>{if(ch&&typeof ch==='object'&&!isSubj(ch)){const t=(typeof ch.title==='string'&&ch.title)||(typeof ch.name==='string'&&ch.name)||(typeof ch.opName==='string'&&ch.opName)||ttl;walk(ch,t,depth+1)}});
      return;
    }
    if(isSubj(n))return;
    const t=(typeof n.title==='string'&&n.title)||(typeof n.name==='string'&&n.name)||(typeof n.opName==='string'&&n.opName)||ttl;
    for(const k of Object.keys(n)){const v=n[k];if(v&&typeof v==='object')walk(v,t||(isNaN(k)?k:''),depth+1)}
  })(d,'',0);
  const out=[],idx={};
  for(const s of secs){
    const items=s.items.map(normMb).filter(Boolean);
    if(!items.length)continue;
    const key=s.title;
    if(idx[key]!=null){const ex=out[idx[key]];const have=new Set(ex.items.map(i=>i.id));items.forEach(i=>{if(!have.has(i.id))ex.items.push(i)})}
    else{idx[key]=out.length;out.push({title:key,items})}
  }
  return out;
}
function mbFlat(d){
  const seen=new Set(),out=[];
  for(const s of mbSections(d))for(const i of s.items){if(!seen.has(i.id)){seen.add(i.id);out.push(i)}}
  return out;
}
const guessFmt=(url,hint)=>{
  const h=String(hint||'').toLowerCase(),u=String(url||'').toLowerCase().split('?')[0];
  if(/dash|mpd/.test(h)||/\.mpd$/.test(u))return'dash';
  if(/hls|m3u8/.test(h)||/\.m3u8$/.test(u))return'hls';
  if(/webm/.test(h)||/\.webm$/.test(u))return'webm';
  if(/mp4/.test(h)||/\.mp4$/.test(u))return'mp4';
  if(/mkv|matroska/.test(h)||/\.mkv$/.test(u))return'mkv';
  return'auto';
};
const looksUrl=v=>typeof v==='string'&&/^(https?:\/\/|\/(proxy|mb|anime|music|dl|api)\b)/i.test(v.trim());
const PROXY_KEYS=['play_url','proxy_url','proxied_url','proxy','playUrl'];
const RAW_KEYS=['url','stream_url','streamUrl','link','src','download_url','downloadUrl'];
/* Parse /mb/stream (or any stream-ish payload) into normalised sources */
function parseStreams(d){
  const out=[],seen=new Set();
  (function walk(n,depth){
    if(!n||depth>7)return;
    if(Array.isArray(n)){n.forEach(x=>walk(x,depth+1));return}
    if(typeof n!=='object')return;
    const urls=[];
    for(const k of PROXY_KEYS)if(looksUrl(n[k]))urls.push({url:abs(n[k]),via:'proxy'});
    for(const k of RAW_KEYS)if(looksUrl(n[k]))urls.push({url:abs(n[k]),via:'direct'});
    if(urls.length){
      const uniq=[];urls.forEach(u=>{if(!uniq.some(x=>x.url===u.url))uniq.push(u)});
      const key=uniq.map(u=>u.url).join('|');
      if(!seen.has(key)){
        seen.add(key);
        const rawUrl=(uniq.find(u=>u.via==='direct')||uniq[0]).url;
        const fmt=guessFmt(uniq[0].url,n.format||n.type||n.ext||n.mime||n.mimeType)!=='auto'?guessFmt(uniq[0].url,n.format||n.type||n.ext||n.mime||n.mimeType):guessFmt(rawUrl,n.format||n.type||n.ext||'');
        let q=n.quality||n.resolution||n.resolutions||n.height||n.label||n.definition||'';
        if(Array.isArray(q))q=q.join('/');
        const qs=String(q||'').trim();
        out.push({id:n.id||n.resource_id||n.resourceId||'',fmt,quality:qs,size:n.size||n.file_size||0,urls:uniq,headers:n.headers||null,proxied:uniq[0].via==='proxy',raw:rawUrl});
      }
      return;
    }
    for(const k of Object.keys(n)){
      if(/caption|subtitle|^subs?$/i.test(k))continue;
      const v=n[k];if(v&&typeof v==='object')walk(v,depth+1);
    }
  })(d,0);
  const rank={dash:0,hls:1,mp4:2,webm:3,auto:4,mkv:5};
  const qn=s=>parseInt(String(s).replace(/\D/g,''),10)||0;
  out.sort((a,b)=>(b.proxied-a.proxied)||((rank[a.fmt]??9)-(rank[b.fmt]??9))||(qn(b.quality)-qn(a.quality)));
  return out;
}
function streamLabel(s,i){
  const q=s.quality?(/^\d+$/.test(s.quality)?s.quality+'p':s.quality):'';
  const f=s.fmt==='auto'?'Stream':s.fmt.toUpperCase();
  return(q?q+' · ':'')+f+(s.proxied?'':' (direct)')+(i>=0&&!q?' '+(i+1):'');
}
function parseCaptions(d){
  const out=[],seen=new Set();
  (function walk(n,depth){
    if(!n||depth>6)return;
    if(Array.isArray(n)){n.forEach(x=>walk(x,depth+1));return}
    if(typeof n!=='object')return;
    let u='';
    for(const k of[...PROXY_KEYS,...RAW_KEYS])if(looksUrl(n[k])){u=abs(n[k]);break}
    const lang=n.lanName||n.language||n.lang||n.lan||n.label||n.name||n.title;
    if(u&&lang&&!seen.has(u)){seen.add(u);out.push({label:String(lang),url:u});return}
    for(const k of Object.keys(n)){const v=n[k];if(v&&typeof v==='object')walk(v,depth+1)}
  })(d,0);
  return out.filter(c=>!/\.(ass|ssa)(\?|$)/i.test(c.url));
}
/* SRT -> WebVTT */
function srtToVtt(txt){
  txt=String(txt||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
  if(/^WEBVTT/.test(txt.trim()))return txt;
  return'WEBVTT\n\n'+txt.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2').replace(/(\d{2}:\d{2}),(\d{3})/g,'$1.$2');
}

function parseHash(){
  const raw=(location.hash||'').replace(/^#/,'')||'/';
  const qi=raw.indexOf('?');
  const path=qi<0?raw:raw.slice(0,qi),qs=qi<0?'':raw.slice(qi+1);
  const segs=path.split('/').filter(Boolean).map(s=>{try{return decodeURIComponent(s)}catch(e){return s}});
  return{segs,q:Object.fromEntries(new URLSearchParams(qs))};
}
async function route(){
  const tok=++RT;
  cleanup();
  closeSearch();closeSheet();
  Bar.start();
  const{segs,q}=parseHash();
  window.scrollTo(0,0);
  try{
    await dispatch(segs,q,tok);
  }catch(e){
    console.error(e);
    if(tok===RT){setNav('');mount(stateHTML('alert','Something went wrong',e&&e.message||String(e),retryBtn+' <a class="btn line" href="#/status">Run diagnostics</a>'))}

async function dispatch(s,q,tok){
  const[a,b,c]=s;
  setMode('movie');
  if(!a)return pageHome(tok);
  if(a==='movies')return pageGrid('movie',tok);
  if(a==='series')return pageGrid('tv',tok);
  if(a==='title'&&b&&c)return pageTitle(b,c,tok);
  if(a==='watch'&&b&&c)return pageWatch(b,c,parseInt(q.se||'1',10)||1,parseInt(q.ep||'1',10)||1,tok);
  if(a==='search')return pageSearch(b||q.q||'',q.tab||'',tok);
  if(a==='anime'){
    setMode('anime');
    if(b==='title'&&c)return pageAnimeTitle(c,tok);
    if(b==='watch'&&c)return pageAnimeWatch(c,parseInt(q.ep||'0',10)||0,tok);
    if(b==='catalog')return pageAnimeCatalog(tok);
    return pageAnimeHome(tok);
  }
  if(a==='mb'){
    setMode('mb');
    if(b==='title'&&c)return pageMbTitle(c,tok);
    if(b==='watch'&&c)return pageMbWatch(c,parseInt(q.se||'0',10)||0,parseInt(q.ep||'0',10)||0,q.t||'',tok);
    return pageMbHome(q.q||'',tok);
  }
  if(a==='hub'){
    setMode('hub');
    if(b==='t')return pageHubTitle(q.id||'',q.n||'',tok);
    return pageHubHome(q.q||'',tok);
  }
  if(a==='dl')return pageDownloader(q.u||'',tok);
  if(a==='list')return pageList(tok);
  if(a==='status')return pageStatus(tok);
  setNav('');
  mount(stateHTML('search','Page not found','That page does not exist.','<a class="btn" href="#/">Go home</a>'));
}

async function liveSearch(q){
  const box=$('#sres');const my=++_sseq;
  if(!q){renderQuick();return}
  box.innerHTML='<div class="state"><div class="spin"></div></div>';
  const [t,a]=await Promise.allSettled([api('/api/search?q='+enc(q),{ttl:120000,retries:0,timeout:15000}),api('/anime/search?q='+enc(q),{ttl:120000,retries:0,timeout:15000})]);
  if(my!==_sseq)return;
  const items=[];
  if(t.status==='fulfilled')tmdbList(t.value).slice(0,7).forEach(n=>items.push({href:`#/title/${n.media}/${n.id}`,title:n.title,sub:[n.year,n.media==='tv'?'Series':'Movie'].filter(Boolean).join(' • '),poster:n.poster,k:n.media==='tv'?'Series':'Movie'}));

  if(!items.length){
    const failed=t.status==='rejected'&&a.status==='rejected';
    box.innerHTML=`<div class="state">${ic(failed?'alert':'search')}<h3>${failed?'Search is unavailable':'No matches'}</h3><p>${failed?esc(t.reason&&t.reason.message||''):'Try another spelling, or search all sources.'}</p><a class="btn line sm" href="#/search/${enc(q)}">Search all sources</a></div>`;
    return;
  }
  box.innerHTML=items.map(i=>`<a class="sitem" href="${esc(i.href)}"><div class="sp${i.poster?'':' noimg'}">${imgTag(i.poster,i.title)}</div><div><b>${esc(i.title)}</b><small>${esc(i.sub)}</small></div><span class="k">${esc(i.k)}</span></a>`).join('')
    +`<a class="btn line sm" style="margin:12px auto 0" href="#/search/${enc(q)}">See all results for “${esc(q)}”</a>`;
}

class VPlayer{
  constructor(host,o){
    this.host=host;
    this.o=Object.assign({sources:[],subtitles:[],title:'',sub:'',poster:'',resume:0,preferAudio:null,autoplay:true,
      onNext:null,onPrev:null,onProgress:null,onEnded:null,onBack:null,onExhausted:null,errorExtra:''},o||{});
    this.si=0;this.ai=0;this.attempts=[];this.seq=0;this.hls=null;this.dash=null;this.wd=null;
    this.started=false;this.dead=false;this.idle=false;this.menuOpen=false;this.menuPage='root';
    this.audioSel=-1;this.qualitySel=-1;this.subSel=-1;this.speed=1;this.subs=[];this.lastSave=0;this.resumed=false;
    this.ptype='mouse';this.lastTap=null;this.netRetry=0;this.mediaRetry=0;
    this.build();this.bind();
    this.setSubtitles(this.o.subtitles);
    if(this.o.sources.length)this.load(0);else this.showError('No playable sources were found for this title.');
  }
  /* ---------- DOM ---------- */
  build(){
    const o=this.o;
    this.host.innerHTML=`<div class="vp busy" tabindex="0" aria-label="Video player">
      <div class="poster-bg" ${o.poster?`style="background-image:url('${esc(abs(o.poster))}')"`:''}></div>
      <video playsinline preload="auto"></video>
      <div class="center"><div class="spinner"></div><button class="bigplay" data-a="play" aria-label="Play">${ic('play')}</button></div>
      <div class="flash l">−10s</div><div class="flash r">+10s</div>
      <div class="msg"></div>
      <div class="ui">
        <div class="top"><button class="cb" data-a="back" aria-label="Back">${ic('back')}</button><div class="t">${esc(o.title)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</div></div>
        <div class="bottom">
          <div class="seek" role="slider" aria-label="Seek"><div class="trk"><div class="buf"></div><div class="prg"></div><div class="knob"></div></div><div class="tip">0:00</div></div>
          <div class="ctl">
            <button class="cb pp" data-a="play" aria-label="Play/Pause">${ic('play')}</button>
            ${o.onPrev?`<button class="cb pv" data-a="prev" aria-label="Previous">${ic('prev')}</button>`:''}
            ${o.onNext?`<button class="cb nx" data-a="next" aria-label="Next">${ic('next')}</button>`:''}
            <div class="vol"><button class="cb" data-a="mute" aria-label="Mute">${ic('vol')}</button><input type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
            <span class="time">0:00 / 0:00</span><span class="sp"></span>
            <button class="cb" data-a="gear" aria-label="Settings">${ic('gear')}</button>
            <button class="cb" data-a="pip" aria-label="Picture in picture">${ic('pip')}</button>
            <button class="cb" data-a="fs" aria-label="Fullscreen">${ic('fs')}</button>
          </div>
        </div>
      </div>
      <div class="menu" hidden></div>
      <div class="err" hidden></div>
    </div>`;
    const q=s=>this.host.querySelector(s);
    this.el=q('.vp');this.v=q('video');this.seekEl=q('.seek');this.prg=q('.prg');this.buf=q('.buf');this.knob=q('.knob');
    this.tip=q('.tip');this.timeEl=q('.time');this.menu=q('.menu');this.errEl=q('.err');this.msgEl=q('.msg');this.volIn=q('.vol input');
    this.ppBtn=q('.cb.pp');this.muteBtn=q('[data-a=mute]');this.fsBtn=q('[data-a=fs]');
  }
  /* ---------- events ---------- */
  bind(){
    const v=this.v,el=this.el;
    this._on=(t,ev,fn,opt)=>{t.addEventListener(ev,fn,opt);(this._offs=this._offs||[]).push(()=>t.removeEventListener(ev,fn,opt))};
    this._on(el,'pointerdown',e=>{this.ptype=e.pointerType||'mouse'});
    this._on(el,'click',e=>{
      const b=e.target.closest('[data-a]');
      if(b){this.action(b.dataset.a,b,e);return}
      const mi=e.target.closest('.menu button[data-v]');
      if(mi){this.menuPick(mi.dataset.k,mi.dataset.v);return}
      const mn=e.target.closest('.menu [data-go]');
      if(mn){this.menuPage=mn.dataset.go;this.renderMenu();return}
      if(e.target.closest('.menu,.err,.bigplay,.upnext,.seek,.ctl,.top .cb'))return;
      if(this.menuOpen){this.closeMenu();return}
      this.onTap(e);
    });
    this._on(el,'pointermove',()=>this.wake(),{passive:true});
    this._on(el,'touchstart',()=>this.wake(),{passive:true});
    this._on(el,'keydown',()=>this.wake());
    /* seek bar */
    const seek=this.seekEl;
    const pos=e=>{const r=seek.getBoundingClientRect();return clamp((e.clientX-r.left)/Math.max(1,r.width),0,1)};
    this._on(seek,'pointerdown',e=>{if(!isFinite(v.duration)||!v.duration)return;try{seek.setPointerCapture(e.pointerId)}catch(x){}this.drag=true;seek.classList.add('drag');this.previewSeek(pos(e))});
    this._on(seek,'pointermove',e=>{const p=pos(e);if(isFinite(v.duration)){this.tip.textContent=fmtTime(p*v.duration);this.tip.style.left=(p*100)+'%'}if(this.drag)this.previewSeek(p)});
    this._on(seek,'pointerup',e=>{if(!this.drag)return;this.drag=false;seek.classList.remove('drag');if(isFinite(v.duration))v.currentTime=pos(e)*v.duration});
    this._on(seek,'pointercancel',()=>{this.drag=false;seek.classList.remove('drag')});
    this._on(this.volIn,'input',()=>{v.volume=+this.volIn.value;v.muted=v.volume===0});
    /* media events */
    this._on(v,'loadedmetadata',()=>{
      if(!this.resumed&&this.o.resume>10&&isFinite(v.duration)&&v.duration>this.o.resume+30){try{v.currentTime=this.o.resume}catch(e){}}
      this.resumed=true;this.updateTime();
    });
    this._on(v,'loadeddata',()=>{clearTimeout(this.wd);this.setBusy(false)});
    this._on(v,'canplay',()=>{clearTimeout(this.wd);this.setBusy(false)});
    this._on(v,'waiting',()=>this.setBusy(true));
    this._on(v,'playing',()=>{this.started=true;clearTimeout(this.wd);this.setBusy(false);this.el.classList.add('started','playing');this.setPP(true);this.wake();this.netRetry=0});
    this._on(v,'pause',()=>{this.el.classList.remove('playing');this.setPP(false);this.wake()});
    this._on(v,'ended',()=>{this.el.classList.remove('playing');this.setPP(false);if(this.o.onProgress)this.o.onProgress(v.duration,v.duration);if(this.o.onEnded)this.o.onEnded();else if(this.o.onNext){toast('Playing next…');this.o.onNext()}});
    this._on(v,'timeupdate',()=>{this.updateTime();this.saveProgress()});
    this._on(v,'progress',()=>this.updateBuf());

    else if(k==='spd'){this.setSpeed(v);this.closeMenu()}
  }
  /* ---------- lifecycle ---------- */
  destroy(){
    if(this.dead)return;
    this.dead=true;
    clearTimeout(this.idleT);clearTimeout(this.tapT);clearTimeout(this.msgT);clearTimeout(this.wd);
    try{if(this.o.onProgress&&this.v.currentTime>5&&isFinite(this.v.duration))this.o.onProgress(this.v.currentTime,this.v.duration)}catch(e){}
    (this._offs||[]).forEach(f=>f());this._offs=[];
    this.teardown();
    this.subs.forEach(s=>{if(s.el&&s.el.src)try{URL.revokeObjectURL(s.el.src)}catch(e){}});
    try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
    try{if(document.pictureInPictureElement)document.exitPictureInPicture()}catch(e){}
    try{if('mediaSession' in navigator){navigator.mediaSession.metadata=null}}catch(e){}
    this.host.innerHTML='';
  }
}

/* ---------- iframe embed (servers) ---------- */
function mountEmbed(host,url,opt={}){
  host.innerHTML='';
  const ld=document.createElement('div');ld.className='ld';ld.innerHTML='<div class="spin"></div><span>Connecting to server…</span>';
  const f=document.createElement('iframe');
  f.setAttribute('allow','autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write');
  f.setAttribute('allowfullscreen','');f.setAttribute('referrerpolicy','origin');f.title=opt.title||'Player';
  let dead=false,hint=null;
  f.onload=()=>{ld.classList.add('gone');setTimeout(()=>ld.remove(),400)};
  host.appendChild(f);host.appendChild(ld);
  f.src=String(url).replace(/^http:\/\//i,'https://');
  const t=setTimeout(()=>{
    if(dead||!opt.onSlow||!ld.isConnected)return;
    hint=document.createElement('div');hint.className='hint';
    hint.innerHTML=`<span>Taking long? Try another server.</span><button class="btn sm" type="button">Next server</button>`;
    hint.querySelector('button').onclick=()=>opt.onSlow();
    host.appendChild(hint);
  },12000);
  return{destroy(){dead=true;clearTimeout(t);try{f.src='about:blank'}catch(e){}host.innerHTML=''}};
}

function initHero(root,slides){
  if(!root||slides.length<1)return;
  let i=0,timer=null;const DUR=8000;
  const content=$('.hcontent',root),sl=$$('.hslide',root),th=$$('.hth',root),dots=$$('.hdots i',root);
  function show(n){
    const nx=(n+slides.length)%slides.length;
    if(nx===i&&content.dataset.set)return sched();
    i=nx;content.dataset.set='1';
    sl.forEach((s,k)=>s.classList.toggle('on',k===i));
    th.forEach((t,k)=>t.classList.toggle('on',k===i));

    content.innerHTML=heroContent(slides[i]);

  }
  function sched(){clearTimeout(timer);if(slides.length>1)timer=setTimeout(()=>{if(document.hidden)return sched();show(i+1)},DUR)}
  th.forEach((t,k)=>t.addEventListener('click',()=>show(k)));
  let sx=null;

  root.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60&&!e.target.closest('a,button'))show(i+(dx<0?1:-1))});

/* ---------------- WATCH (TMDB) ---------------- */
function mbBest(cands,title,year,media){
  const nt=normTitle(title);let best=null,bs=0;
  for(const c of cands){
    const t=normTitle(c.title);let s=0;
    if(t===nt)s=10;else if(t&&nt&&(t.startsWith(nt)||nt.startsWith(t)))s=6;else if(t&&nt&&(t.includes(nt)||nt.includes(t)))s=4;else continue;
    if(year&&c.year&&String(c.year)===String(year))s+=3;
    else if(year&&c.year&&Math.abs(+c.year-+year)>1)s-=3;
    if(c.media===media)s+=2;else s-=2;
    if(s>bs){bs=s;best=c}
  }
  return bs>=5?best:null;
}
function nextSeasonEp(W){
  const eps=W.eps||[],sn=(W.detail&&W.detail.seasons||[]).filter(s=>s.season>0).map(s=>s.season).sort((a,b)=>a-b);
  const cur=eps.findIndex(e=>e.episode==W.ep);
  if(cur>=0&&cur<eps.length-1)return{se:W.se,ep:eps[cur+1].episode};
  if(!eps.length&&W.ep>0&&W.ep<200&&!sn.length)return{se:W.se,ep:W.ep+1};
  const si=sn.indexOf(W.se);
  if(si>=0&&si<sn.length-1)return{se:sn[si+1],ep:1};
  return null;
}
function prevSeasonEp(W){
  const eps=W.eps||[];const cur=eps.findIndex(e=>e.episode==W.ep);
  if(cur>0)return{se:W.se,ep:eps[cur-1].episode};
  if(!eps.length&&W.ep>1)return{se:W.se,ep:W.ep-1};
  return null;
}

  /* ----- 4K tab ----- */
  async function hubTab(){

      if(cur==W.se){W.eps=eps;const me=eps.find(e=>e.episode==W.ep);if(me){W.epName=me.name;renderBar();if(App.player){}}}

      const on=$('#bl .ep.on');if(on)on.scrollIntoView({block:'nearest'});
    }catch(er){const bl=$('#bl');if(bl&&tok===RT)bl.innerHTML=`<div class="note">${esc(er.message)}</div>`}
  }

  /* ----- boot the page ----- */
  const detailP=api(`/api/detail/${media}/${id}`,{ttl:600000}).catch(()=>null);
  const playP=api(`/api/play?tmdb_id=${enc(id)}&media=${media}&fast=1${tv?`&se=${se}&ep=${ep}`:''}`,{timeout:35000,retries:1}).catch(e=>({__err:e}));
  detailP.then(d=>{
    if(tok!==RT)return;
    if(d){W.detail=d;W.title=d.name||d.title||'';W.year=d.year||'';W.poster=d.poster||'';W.backdrop=d.backdrop||d.poster||'';document.title=(W.title?W.title+' — ':'')+'MovieAll'}
    renderBar();

  const pd=await playP;

  if(tok!==RT)return;
  if(dd&&!W.title){W.detail=dd;W.title=dd.name||dd.title||'';W.year=dd.year||'';W.poster=dd.poster||'';W.backdrop=dd.backdrop||dd.poster||''}

  if(W.sources.length){renderServers();playServer(0)}
  else{
    W.tab='mb';$$('#wtabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='mb'));
    toast('No servers responded — trying MovieBox');
    await detailP;if(tok!==RT)return;
    mbTab();
  }
}

async function animeResolve(ep){

function findSubject(d){
  const q=[d];let n=0;
  while(q.length&&n++<400){
    const x=q.shift();if(!x||typeof x!=='object')continue;
    if(!Array.isArray(x)&&SUBJ_ID(x))return normMb(x);
    if(!Array.isArray(x)&&x.subject&&typeof x.subject==='object'&&SUBJ_ID(x.subject))return normMb(x.subject);
    (Array.isArray(x)?x:Object.values(x)).forEach(v=>{if(v&&typeof v==='object')q.push(v)});
  }
  return null;
}
function mbSeasons(d){
  let found=null;
  (function walk(n,depth){
    if(found||!n||typeof n!=='object'||depth>7)return;
    if(Array.isArray(n)){
      if(n.length&&n.every(x=>x&&typeof x==='object'&&(x.se!=null||x.season!=null||x.season_number!=null||x.seasonNumber!=null))){found=n;return}
      n.forEach(x=>walk(x,depth+1));return;
    }
    Object.keys(n).forEach(k=>walk(n[k],depth+1));
  })(d,0);
  return(found||[]).map(s=>{
    const se=+(s.se!=null?s.se:(s.season!=null?s.season:(s.season_number!=null?s.season_number:s.seasonNumber)));
    let eps=s.maxEp!=null?s.maxEp:(s.max_ep!=null?s.max_ep:(s.episode_count!=null?s.episode_count:(s.episodeCount!=null?s.episodeCount:(s.episodes!=null?s.episodes:0))));
    if(Array.isArray(eps))eps=eps.length;
    eps=+eps;return{se,eps:isFinite(eps)?eps:0};
  }).filter(s=>s.se>0);
}

  const arr=Array.isArray(d)?d:(d&&(d.items||d.results||d.data||d.movies||d.hits))||[];
  return arr.map(it=>({id:it.id||it.path||it.url||it.link||'',title:it.title||it.name||'Untitled',
    poster:it.poster||it.image||it.cover||it.thumbnail||it.img||'',sub:[it.year,it.quality,it.type].filter(Boolean).join(' • ')})).filter(x=>x.id);
}
const cHub=n=>cardHTML({href:`#/hub/t?id=${enc(n.id)}&n=${enc(n.title)}`,title:n.title,sub:n.sub,poster:n.poster,kind:'4K'});
const vlcIntent=(u,pkg)=>`intent:${u.replace(/^https?:\/\//,'')}#Intent;scheme=${/^https/.test(u)?'https':'http'};action=android.intent.action.VIEW;type=video/*;package=${pkg};end`;
function linkRow(l){
  const u=abs(l.url);
  const fmt=guessFmt(u,l.ext||l.format);
  const canPlay=/mp4|webm|hls|dash/.test(fmt)||fmt==='auto';
  return`<div class="lrow"><div class="ico">${ic('dl')}</div><div class="lt"><b>${esc(l.label||'File')}</b><small>${esc([l.ext,l.size&&fmtBytes(l.size),l.note].filter(Boolean).join(' • ')||u.slice(0,80))}</small></div>
    <div class="la">${canPlay?`<button class="btn sm" data-play="${esc(u)}" data-title="${esc(l.label||'Video')}" data-fmt="${fmt==='auto'?'':fmt}">${ic('play')}Play</button>`:''}
    <a class="btn sm ${canPlay?'line':''}" href="${esc(u)}" target="_blank" rel="noopener" download>${ic('dl')}Download</a>
    <button class="btn sm line" data-copy="${esc(u)}">${ic('copy')}Copy</button>
    ${isAndroid?`<a class="btn sm line" href="${esc(vlcIntent(u,'org.videolan.vlc'))}">VLC</a>`:''}</div></div>`;
}
/* collect { label,url,... } style link objects from any payload */
function collectLinks(d){
  const out=[],seen=new Set();
  (function walk(n,depth,ctx){
    if(!n||depth>7)return;
    if(Array.isArray(n)){n.forEach(x=>walk(x,depth+1,ctx));return}
    if(typeof n!=='object')return;
    let u='';
    for(const k of['url','direct_url','download_url','link','href','src','play_url','stream_url'])if(looksUrl(n[k])||(typeof n[k]==='string'&&/^https?:\/\//i.test(n[k]))){u=n[k];break}
    if(u&&!seen.has(u)){
      seen.add(u);
      const q=n.quality||n.resolution||n.height||n.format_note||'';
      const label=n.label||n.name||n.title||n.host||n.server||n.format||(q?q+(/^\d+$/.test(String(q))?'p':''):'')||'Download';
      out.push({label:String(label)+((n.label||n.name||n.title)&&q&&!String(label).includes(q)?' · '+q+(/^\d+$/.test(String(q))?'p':''):''),url:u,ext:n.ext||n.format||n.type||'',size:n.filesize||n.size||n.file_size||0,
        note:[n.vcodec&&n.vcodec!=='none'&&n.acodec&&n.acodec!=='none'?'video+audio':'',n.muxed?'video+audio':''].filter(Boolean)[0]||''});
      return;
    }
    Object.keys(n).forEach(k=>{const v=n[k];if(v&&typeof v==='object')walk(v,depth+1,ctx)});
  })(d,0);
  return out;
}

function renderReleases(d){
  const arr=Array.isArray(d)?d:(d&&(d.releases||d.streams||d.sources||d.items||d.results||d.data))||[];
  if(!Array.isArray(arr)||!arr.length){const l=collectLinks(d);return l.length?`<div class="lrows">${l.map(linkRow).join('')}</div>`:''}
  return arr.map((r,i)=>{
    const name=r.name||r.title||r.release||r.label||('Release '+(i+1));
    const bits=[r.quality,r.size,r.language,r.codec].filter(Boolean).map(x=>`<span class="pill" style="height:28px;font-size:.78rem">${esc(x)}</span>`).join('');
    const mirrors=r.mirrors||r.links||r.hosts||r.servers||[];
    let inner='';
    (Array.isArray(mirrors)?mirrors:[]).forEach(m=>{
      const direct=m.direct_links||m.directLinks||m.direct||[];
      const dl=collectLinks(direct);
      if(dl.length)inner+=dl.map(x=>linkRow(Object.assign({},x,{label:(m.name||m.label||m.host||'Mirror')+' · '+x.label}))).join('');
      else{
        const u=m.url||m.link||m.href;
        if(u)inner+=`<div class="lrow"><div class="ico">${ic('server')}</div><div class="lt"><b>${esc(m.name||m.label||m.host||'Mirror')}</b><small>Needs resolving</small></div><div class="la"><button class="btn sm" data-resolve="${esc(u)}">${ic('refresh')}Get direct links</button><a class="btn sm line" href="${esc(abs(u))}" target="_blank" rel="noopener">${ic('ext')}Open</a></div></div><div data-rbox></div>`;
      }
    });
    if(!inner){const l=collectLinks(r);inner=l.map(linkRow).join('')}
    return`<div class="grp">${esc(name)}</div>${bits?`<div class="pills" style="margin-bottom:10px">${bits}</div>`:''}<div class="lrows">${inner||'<div class="note">No mirrors listed.</div>'}</div>`;
  }).join('');
}

  const setT=(el,st,msg,ms)=>{const d=$('.dot',el);d.className='dot '+st;$('small',el).textContent=msg||'';$('code',el).textContent=ms!=null?ms+' ms':''};
  const RAW={};
  $('#tl').addEventListener('click',e=>{const b=e.target.closest('[data-raw]');if(!b)return;const body=openModal();body.innerHTML='<pre style="position:absolute;inset:0;overflow:auto;padding:18px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfe8ff;white-space:pre-wrap;word-break:break-all"></pre>';let s='';try{s=JSON.stringify(RAW[b.dataset.raw],null,1)}catch(x){s=String(RAW[b.dataset.raw])}$('pre',body).textContent=s.slice(0,40000)});
  let running=false;
  async function runAll(){
    if(running)return;running=true;
    const btn=$('#runall');btn.disabled=true;
    let pass=0,fail=0,soft=0;
    for(let i=0;i<T.length;i++){
      if(tok!==RT)return;
      const t=T[i],el=$('#t'+i);if(!el)return;
      const path=typeof t.p==='function'?t.p():t.p;
      if(!path){setT(el,'run','skipped — needed data from an earlier test');soft++;continue}
      setT(el,'run','running…');const t0=performance.now();
      try{
        const d=await api(path,{timeout:60000,retries:0});
        RAW[i]=d;{const rb=$('[data-raw]',el);if(rb)rb.hidden=false}
        const msg=await t.ok(d);
        setT(el,'ok',msg,Math.round(performance.now()-t0));pass++;
      }catch(e){
        setT(el,t.soft?'run':'bad',(e.message||String(e)),Math.round(performance.now()-t0));
        if(t.soft){soft++;el.querySelector('.dot').className='dot';}else fail++;
      }
    }
    for(let i=0;i<libs.length;i++){
      const el=$('#l'+i);if(!el)return;setT(el,'run','loading…');const t0=performance.now();
      try{const m=await libs[i].run();setT(el,'ok',m,Math.round(performance.now()-t0));pass++}
      catch(e){setT(el,'bad',e.message,Math.round(performance.now()-t0));fail++}
    }
    running=false;btn.disabled=false;
    const s=$('#sum');if(s)s.innerHTML=fail?`<b>${fail} test${fail>1?'s':''} failed</b>, ${pass} passed${soft?`, ${soft} optional/skipped`:''}. If everything fails with “Cannot reach the API”, the server is blocking this website (CORS) — host this file on the same Vercel project, or set the API base above.`:`<b>All ${pass} required checks passed</b>${soft?` (${soft} optional checks skipped or unavailable)`:''}. You are good to go.`;
  }
  $('#runall').onclick=runAll;
  $('#bf').addEventListener('submit',e=>{
    e.preventDefault();const v=e.target.q.value.trim();
    if(v&&!/^https?:\/\//i.test(v)){toast('Enter a full URL starting with https://');return}
    if(v)store.set('base',v);else store.del('base');
    BASE=computeBase();_cache.clear();toast('API base saved');$('#bs').textContent=BASE||location.origin;
  });
}

/* ---------------- BOOT ---------------- */
(function boot(){
  wireGlobalUI();wireSearch();wireSheet();wirePages();
  addEventListener('hashchange',route);
  addEventListener('resize',()=>setNav((($('#links a.on')||{}).dataset||{}).k||''));
  addEventListener('unhandledrejection',e=>console.warn('Unhandled:',e.reason));
  route();
})();

</script>
</body>
</html>

/* ---------- iframe embed (servers) ---------- */
function mountEmbed(host,url,opt={}){
  host.innerHTML='';
  const ld=document.createElement('div');ld.className='ld';ld.innerHTML='<div class="spin"></div><span>Connecting to server…</span>';
  const f=document.createElement('iframe');
  f.setAttribute('allow','autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write');
  f.setAttribute('allowfullscreen','');f.setAttribute('referrerpolicy','origin');f.title=opt.title||'Player';
  let dead=false,hint=null,ht=null;
  const src=String(url).replace(/^http:\/\//i,'https://');
  const showHint=(msg)=>{
    if(dead||hint)return;
    hint=document.createElement('div');hint.className='hint';
    hint.innerHTML=`<span>${msg}</span>${opt.onSlow?'<button class="btn sm" type="button" data-n>Next server</button>':''}<a class="btn sm glass" href="${esc(src)}" target="_blank" rel="noopener">Open ↗</a><button class="ibtn sm" type="button" data-x aria-label="Dismiss">${ic('close')}</button>`;
    const n=hint.querySelector('[data-n]');if(n)n.onclick=()=>opt.onSlow();
    hint.querySelector('[data-x]').onclick=()=>{hint.remove();hint=null};
    host.appendChild(hint);
    ht=setTimeout(()=>{if(hint){hint.remove();hint=null}},14000);
  };
  f.onload=()=>{ld.classList.add('gone');setTimeout(()=>ld.remove(),400);setTimeout(()=>showHint('Black screen or a sad-face page? That server blocked embedding.'),900)};
  host.appendChild(f);host.appendChild(ld);
  f.src=src;
  const t=setTimeout(()=>{if(!dead&&ld.isConnected)showHint('Taking long? Try another server.')},12000);
  return{destroy(){dead=true;clearTimeout(t);clearTimeout(ht);try{f.src='about:blank'}catch(e){}host.innerHTML=''}};
}

/* ===================================================================
   MovieAll Music — engine: audio, queue, library, lyrics, media session
   =================================================================== */
const htmlDecode=s=>{if(s==null)return'';const t=document.createElement('textarea');t.innerHTML=String(s);return t.value};
const bigThumb=u=>String(u||'').replace(/(\d{2,4})x\1(?=[^\d\/]*$)/,'500x500').replace(/\/(mqdefault|default|hqdefault)\.jpg/,'/hqdefault.jpg');
function mNorm(it){
  if(!it||typeof it!=='object')return null;
  let id=String(it.id||it.video_id||it.videoId||(it.saavn_id?'saavn:'+it.saavn_id:'')||'');
  if(!id)return null;
  const title=htmlDecode(it.title||it.name||'').trim();
  if(!title)return null;
  const arts=Array.isArray(it.artists)?it.artists.map(a=>a&&(a.name||a)).filter(Boolean).join(', '):'';
  const artist=htmlDecode(it.artist||it.subtitle||it.author||it.channel||arts||'').trim();
  return{id,title,artist,album:htmlDecode(it.album||'').trim(),thumb:it.thumb||it.image||it.thumbnail||it.cover||'',duration:Number(it.duration)||0,
    provider:it.provider||(/^saavn:/.test(id)?'saavn':'youtube')};
}
const mList=d=>{
  const arr=Array.isArray(d)?d:(d&&(d.items||d.results||d.songs||d.tracks||d.videos||d.data))||[];
  const seen=new Set(),out=[];
  (Array.isArray(arr)?arr:[]).forEach(x=>{const n=mNorm(x);if(n&&!seen.has(n.id)){seen.add(n.id);out.push(n)}});
  return out;
};
function mSections(d){
  const out=[];
  const src=(d&&(d.sections||d.rows||d.shelves))||null;
  if(Array.isArray(src)){src.forEach(s=>{const items=mList(s.items||s.tracks||s.songs||s.data||[]);if(items.length)out.push({title:htmlDecode(s.title||s.name||'Mix'),items})});if(out.length)return out}
  (function walk(n,ttl,depth){
    if(!n||typeof n!=='object'||depth>5)return;
    if(Array.isArray(n)){const it=mList(n);if(it.length>=3)out.push({title:ttl||'Mix',items:it});else n.forEach(x=>walk(x,(x&&(x.title||x.name))||ttl,depth+1));return}
    Object.keys(n).forEach(k=>{if(n[k]&&typeof n[k]==='object')walk(n[k],(typeof n.title==='string'&&n.title)||k,depth+1)});
  })(d,'',0);
  return out;
}
const cleanTitle=t=>String(t||'').replace(/\s*[\(\[][^)\]]*(official|video|audio|lyric|lyrics|from\b|remaster|\bhd\b|\bhq\b|4k|feat|ft\.|prod\.|soundtrack|motion picture|full song)[^)\]]*[\)\]]/gi,'').replace(/\s*[-–|]\s*(official|lyric|from\b|remaster).*$/i,'').replace(/\s{2,}/g,' ').trim();
const firstArtist=a=>String(a||'').split(/\s*(?:,|&|\bfeat\.?|\bft\.?|\bx\b|\band\b|\/)\s*/i)[0].trim();
const durStr=s=>s>0?fmtTime(s):'';

/* ---------- LRC parsing ---------- */
function parseLRC(txt){
  const out=[];let offset=0;
  String(txt||'').split(/\r?\n/).forEach(raw=>{
    const off=raw.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i);
    if(off){offset=parseInt(off[1],10)/1000;return}
    const tags=[...raw.matchAll(/\[(\d{1,3}):(\d{1,2}(?:[.:]\d{1,3})?)\]/g)];
    if(!tags.length)return;
    const text=raw.replace(/\[[^\]]*\]/g,'').replace(/<\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?>/g,'').replace(/\s+/g,' ').trim();
    tags.forEach(m=>out.push({t:parseInt(m[1],10)*60+parseFloat(m[2].replace(':','.'))-offset,text}));
  });
  out.sort((a,b)=>a.t-b.t);
  return out;
}
function buildLyrics(L,dur){
  if(!L||typeof L!=='object')return null;
  let lines=null;
  if(Array.isArray(L.lines)&&L.lines.length){
    lines=L.lines.map(x=>({t:Number(x.t!=null?x.t:(x.time!=null?x.time:(x.start!=null?x.start:x.startTime))),text:String(x.text!=null?x.text:(x.line!=null?x.line:(x.words||''))).trim()})).filter(x=>isFinite(x.t));
  }
  if((!lines||!lines.length)&&(L.synced||L.syncedLyrics||L.lrc))lines=parseLRC(L.synced||L.syncedLyrics||L.lrc);
  if(lines&&lines.length>=2){
    const mx=Math.max(...lines.map(l=>l.t));
    if(dur&&mx>dur*4)lines.forEach(l=>{l.t=l.t/1000});
    lines.sort((a,b)=>a.t-b.t);
    const last=lines[lines.length-1].t,warn=!!(dur&&last>dur+20);
    return{synced:true,lines,warn};
  }
  const plain=String(L.lyrics||L.plain||L.plainLyrics||'').trim();
  if(plain){
    if(/\[\d{1,3}:\d{2}/.test(plain)){const l=parseLRC(plain);if(l.length>=2)return{synced:true,lines:l,warn:false}}
    return{synced:false,plain};
  }
  return null;
}

/* ---------- library (likes / playlists / history) ---------- */
const slim=t=>({id:t.id,title:t.title,artist:t.artist,album:t.album||'',thumb:t.thumb||'',duration:t.duration||0,provider:t.provider||''});
const Lib={
  likes:()=>store.get('mlikes',[]),
  isLiked:id=>Lib.likes().some(x=>x.id===id),
  toggleLike(t){let a=Lib.likes();const on=!a.some(x=>x.id===t.id);a=on?[slim(t),...a]:a.filter(x=>x.id!==t.id);store.set('mlikes',a);return on},
  hist:()=>store.get('mhist',[]),
  addHist(t){const a=[slim(t),...Lib.hist().filter(x=>x.id!==t.id)].slice(0,120);store.set('mhist',a)},
  playlists:()=>store.get('mpl',[]),
  savePl(a){store.set('mpl',a)},
  newPl(name){const a=Lib.playlists();const p={id:'pl'+Date.now().toString(36),name:name||'New playlist',tracks:[],t:Date.now()};a.unshift(p);Lib.savePl(a);return p},
  addToPl(pid,t){const a=Lib.playlists();const p=a.find(x=>x.id===pid);if(!p)return false;if(p.tracks.some(x=>x.id===t.id))return'dup';p.tracks.push(slim(t));Lib.savePl(a);return true},
  rmFromPl(pid,tid){const a=Lib.playlists();const p=a.find(x=>x.id===pid);if(p){p.tracks=p.tracks.filter(x=>x.id!==tid);Lib.savePl(a)}},
  delPl(pid){Lib.savePl(Lib.playlists().filter(x=>x.id!==pid))},
  renPl(pid,n){const a=Lib.playlists();const p=a.find(x=>x.id===pid);if(p){p.name=n;Lib.savePl(a)}}
};

/* ---------- engine ---------- */
const Music=(()=>{
  const A=new Audio();A.preload='auto';
  try{A.volume=clamp(store.get('mvol',1),0,1)}catch(e){}
  const S={queue:[],orig:[],qi:-1,cur:null,shuffle:!!store.get('mshuf',false),repeat:store.get('mrep','off'),autoplay:store.get('mauto',true),speed:1,
    busy:false,cands:[],ci:0,fails:0,lyrics:null,lyrState:'idle',sleepAt:0,sleepEnd:false,yt:'',resumeAt:0,restored:false,info:null};
  const subs=[];
  const emit=(t,x)=>subs.forEach(f=>{try{f(t,x)}catch(e){console.error(e)}});
  let tok=0,lastSave=0,warmed='';
  const M={A,S,on:f=>subs.push(f),emit};
  M.isPlaying=()=>!A.paused&&!A.ended&&!S.yt;
  M.pause=()=>{try{A.pause()}catch(e){}};
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  M.play=function(list,index,opt){
    list=(list||[]).filter(Boolean);if(!list.length)return;
    index=clamp(index||0,0,list.length-1);
    S.orig=list.slice();S.queue=list.slice();S.qi=index;
    if(S.shuffle&&!(opt&&opt.noShuffle)){const c=S.queue[index];S.queue=[c,...shuf(S.queue.filter((_,i)=>i!==index))];S.qi=0}
    emit('queue');M.load(S.queue[S.qi]);
  };
  M.playOne=t=>M.play([t],0);
  M.playIndex=i=>{if(i>=0&&i<S.queue.length){S.qi=i;M.load(S.queue[i]);emit('queue')}};
  M.addNext=t=>{if(!S.queue.length){M.playOne(t);return}S.queue.splice(S.qi+1,0,t);S.orig.push(t);emit('queue');toast('Playing next')};
  M.addEnd=t=>{if(!S.queue.length){M.playOne(t);return}S.queue.push(t);S.orig.push(t);emit('queue');toast('Added to queue')};
  M.removeAt=i=>{if(i===S.qi)return;S.queue.splice(i,1);if(i<S.qi)S.qi--;emit('queue')};
  M.clearUpNext=()=>{S.queue=S.queue.slice(0,S.qi+1);emit('queue')};
  M.setShuffle=on=>{
    S.shuffle=on;store.set('mshuf',on);
    if(S.queue.length){
      const c=S.queue[S.qi];
      if(on){S.queue=[c,...shuf(S.queue.filter((_,i)=>i!==S.qi))];S.qi=0}
      else{const o=S.orig.length?S.orig:S.queue;const ix=o.findIndex(x=>x.id===(c&&c.id));S.queue=o.slice();S.qi=ix<0?0:ix}
      emit('queue');
    }
    emit('mode');
  };
  M.setRepeat=r=>{S.repeat=r;store.set('mrep',r);emit('mode')};
  M.setAutoplay=on=>{S.autoplay=on;store.set('mauto',on);emit('mode')};
  M.setSpeed=s=>{S.speed=s;A.playbackRate=s;emit('mode')};
  M.setVol=v=>{A.volume=clamp(v,0,1);A.muted=false;store.set('mvol',A.volume);emit('vol')};
  M.seek=t=>{if(isFinite(A.duration)){A.currentTime=clamp(t,0,A.duration);emit('time')}};
  M.toggle=()=>{
    if(!S.cur)return;
    if(S.yt)return;
    if(S.restored||!A.src){M.load(S.cur);return}
    if(A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}else A.pause();
  };
  M.next=auto=>{
    if(!S.queue.length)return;
    if(auto&&S.repeat==='one'){A.currentTime=0;A.play().catch(()=>{});return}
    let i=S.qi+1;
    if(i>=S.queue.length){
      if(S.repeat==='all'){i=0}
      else if(S.autoplay&&S.cur){
        M.related(S.cur).then(list=>{
          const have=new Set(S.queue.map(x=>x.id));const add=list.filter(x=>!have.has(x.id));
          if(add.length){S.queue.push(...add);S.orig.push(...add);emit('queue');toast('Autoplay: similar songs');M.playIndex(S.qi+1)}
          else{S.qi=S.queue.length-1;emit('state')}
        });
        return;
      }else{emit('state');return}
    }
    M.playIndex(i);
  };
  M.prev=()=>{
    if(!S.queue.length)return;
    if(A.currentTime>3||S.qi<=0){A.currentTime=0;return}
    M.playIndex(S.qi-1);
  };
  M.related=async t=>{
    try{const d=await api('/music/related?q='+enc((t.title+' '+firstArtist(t.artist)).trim())+'&limit=14',{ttl:300000,timeout:20000,retries:0});return mList(d).filter(x=>x.id!==t.id)}
    catch(e){return[]}
  };
  M.playById=async id=>{
    try{
      const d=await api('/music/play/'+enc(id),{timeout:30000});
      const t=mNorm({id,title:d.title||id,artist:d.artist,thumb:d.thumb,duration:d.duration,album:d.album})||{id,title:id,artist:'',thumb:'',album:'',duration:0};
      M.playOne(t);
    }catch(e){toast('Could not open that track')}
  };
  M.load=async function(t,opt){
    const my=++tok;
    S.cur=t;S.busy=true;S.yt='';S.cands=[];S.ci=0;S.info=null;S.lyrics=null;S.lyrState='loading';S.restored=false;
    emit('track');emit('lyrics');emit('state');
    let d=null;
    try{d=await api('/music/play/'+enc(t.id),{timeout:35000,retries:1})}catch(e){}
    if(my!==tok)return;
    if(d){
      const n=mNorm({id:t.id,title:d.title||t.title,artist:d.artist||t.artist,thumb:d.thumb||t.thumb,duration:d.duration||t.duration,album:d.album||t.album});
      if(n){Object.assign(t,{title:t.title||n.title,artist:t.artist||n.artist,thumb:t.thumb||n.thumb,album:t.album||n.album,duration:t.duration||n.duration})}
      S.info=d;
    }
    const c=[];
    if(d){[d.play_url,d.audio_url,d.url,d.download_url].forEach(u=>{if(u&&typeof u==='string')c.push(abs(u))});
      (d.sources||[]).forEach(s=>{if(s&&(s.type==='audio'||!s.type)){[s.play_url,s.url].forEach(u=>{if(u&&typeof u==='string')c.push(abs(u))})}})}
    S.cands=[...new Set(c)];
    const vid=(d&&d.video_id)||(/^[\w-]{11}$/.test(t.id)?t.id:'');
    S.ytId=vid;
    Lib.addHist(t);
    setSession();
    emit('track');
    if(!S.cands.length){
      if(vid){S.yt=vid;S.busy=false;emit('yt');emit('state');fetchLyrics(t,my);return}
      S.busy=false;emit('state');toast('“'+t.title+'” has no playable stream — skipping');
      if(++S.fails<4)setTimeout(()=>{if(my===tok)M.next(true)},900);
      return;
    }
    A.src=S.cands[0];A.playbackRate=S.speed;
    if(S.resumeAt){const r=S.resumeAt;S.resumeAt=0;A.addEventListener('loadedmetadata',()=>{try{A.currentTime=r}catch(e){}},{once:true})}
    if(!opt||opt.autostart!==false){const p=A.play();if(p&&p.catch)p.catch(err=>{if(err&&err.name==='NotAllowedError')toast('Tap play to start')})}
    fetchLyrics(t,my);
  };
  /* audio events */
  A.addEventListener('playing',()=>{S.busy=false;S.fails=0;emit('state');updatePos()});
  A.addEventListener('pause',()=>{emit('state');updatePos()});
  A.addEventListener('waiting',()=>{S.busy=true;emit('state')});
  A.addEventListener('canplay',()=>{S.busy=false;emit('state')});
  A.addEventListener('loadedmetadata',()=>{if(S.cur&&!S.cur.duration&&isFinite(A.duration))S.cur.duration=Math.round(A.duration);emit('dur');updatePos()});
  A.addEventListener('durationchange',()=>emit('dur'));
  A.addEventListener('seeked',()=>{emit('time');updatePos()});
  A.addEventListener('timeupdate',()=>{
    emit('time');
    const n=Date.now();
    if(n-lastSave>4000){lastSave=n;saveState()}
    if(S.sleepAt&&n>=S.sleepAt)sleepFire();
    const rem=A.duration-A.currentTime;
    if(isFinite(rem)&&rem<25&&rem>0){
      const nx=S.queue[S.qi+1];
      if(nx&&warmed!==nx.id){warmed=nx.id;api('/music/play/'+enc(nx.id),{ttl:600000,retries:0,timeout:20000}).catch(()=>{})}
    }
  });
  A.addEventListener('ended',()=>{
    if(S.sleepEnd){S.sleepEnd=false;emit('sleep');toast('Sleep timer: stopped');return}
    M.next(true);
  });
  A.addEventListener('error',()=>{
    if(!A.getAttribute('src'))return;
    if(S.ci<S.cands.length-1){S.ci++;A.src=S.cands[S.ci];A.play().catch(()=>{});return}
    if(S.ytId&&!S.yt){S.yt=S.ytId;S.busy=false;emit('yt');emit('state');toast('Using YouTube player for this song');return}
    S.busy=false;emit('state');toast('Could not play “'+(S.cur&&S.cur.title)+'”');
    if(++S.fails<4)setTimeout(()=>M.next(true),900);
  });
  /* sleep timer */
  M.setSleep=m=>{
    S.sleepEnd=false;S.sleepAt=0;
    if(m==='end'){S.sleepEnd=true;toast('Will stop after this song')}
    else if(m>0){S.sleepAt=Date.now()+m*60000;toast('Sleep timer: '+m+' min')}
    else toast('Sleep timer off');
    emit('sleep');
  };
  function sleepFire(){
    S.sleepAt=0;emit('sleep');
    const v0=A.volume;let v=v0;
    const iv=setInterval(()=>{v-=v0/12;if(v<=.02){clearInterval(iv);A.pause();A.volume=v0;toast('Sleep timer: goodnight 🌙')}else A.volume=Math.max(0,v)},250);
  }
  /* persistence */
  function saveState(){
    if(!S.cur)return;
    const from=Math.max(0,S.qi-5);
    store.set('mlast',{queue:S.queue.slice(from,S.qi+40).map(slim),qi:S.qi-from,pos:Math.floor(A.currentTime||0)});
  }
  M.save=saveState;
  M.restore=()=>{
    const l=store.get('mlast',null);
    if(l&&Array.isArray(l.queue)&&l.queue.length){
      S.queue=l.queue;S.orig=l.queue.slice();S.qi=clamp(l.qi||0,0,l.queue.length-1);S.cur=S.queue[S.qi];S.resumeAt=l.pos||0;S.restored=true;
      emit('track');
    }
  };
  addEventListener('pagehide',saveState);
  /* lyrics */
  function whenDur(my){
    return new Promise(res=>{
      const ok=()=>isFinite(A.duration)&&A.duration>0;
      if(ok())return res(A.duration);
      const t0=Date.now();
      const iv=setInterval(()=>{if(my!==tok||ok()||Date.now()-t0>3500){clearInterval(iv);res(ok()?A.duration:0)}},120);
    });
  }
  async function fetchLyrics(t,my){
    const dur=Math.round(await whenDur(my)||t.duration||(S.info&&S.info.duration)||0);
    if(my!==tok)return;
    const title=cleanTitle(t.title),artist=firstArtist(t.artist);
    const q=(withAll)=>`/music/lyrics?title=${enc(title)}&artist=${enc(artist)}${withAll&&t.album?`&album=${enc(t.album)}`:''}${withAll&&dur?`&duration=${dur}`:''}`;
    let res=null;
    try{
      let L=await api(q(true),{ttl:3600000,timeout:25000,retries:1});
      res=buildLyrics(L,dur);
      if(!res){L=await api(q(false),{ttl:3600000,timeout:25000,retries:0});res=buildLyrics(L,dur)}
    }catch(e){if(my===tok){S.lyrState='err';S.lyrics=null;emit('lyrics')}return}
    if(my!==tok)return;
    S.lyrics=res;S.lyrState=res?'ok':'none';emit('lyrics');
  }
  M.refetchLyrics=()=>{if(S.cur){S.lyrState='loading';S.lyrics=null;emit('lyrics');fetchLyrics(S.cur,tok)}};
  M.lyrOffset=()=>{const o=store.get('lrcoff',{});return S.cur&&o[S.cur.id]||0};
  M.setLyrOffset=v=>{if(!S.cur)return;const o=store.get('lrcoff',{});if(Math.abs(v)<.05)delete o[S.cur.id];else o[S.cur.id]=Math.round(v*10)/10;store.set('lrcoff',o);emit('lyrics')};
  /* media session */
  function setSession(){
    if(!('mediaSession' in navigator)||!S.cur)return;
    try{
      const t=S.cur;
      navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album||'MovieAll Music',artwork:t.thumb?[{src:bigThumb(t.thumb),sizes:'512x512'}]:[]});
      const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
      h('play',()=>A.play().catch(()=>{}));h('pause',()=>A.pause());h('previoustrack',()=>M.prev());h('nexttrack',()=>M.next());
      h('seekbackward',()=>M.seek(A.currentTime-10));h('seekforward',()=>M.seek(A.currentTime+10));
      h('seekto',e=>{if(e&&e.seekTime!=null)M.seek(e.seekTime)});
    }catch(e){}
  }
  function updatePos(){
    if(!('mediaSession' in navigator)||!isFinite(A.duration)||!A.duration)return;
    try{navigator.mediaSession.playbackState=A.paused?'paused':'playing';navigator.mediaSession.setPositionState({duration:A.duration,position:Math.min(A.currentTime,A.duration),playbackRate:A.playbackRate||1})}catch(e){}
  }
  return M;
})();

/* ---------- action sheet + text prompt ---------- */
function closeActionSheet(){const s=$('.asheet');if(s)s.remove()}
function actionSheet(title,sub,items){
  closeActionSheet();
  const s=document.createElement('div');s.className='sheet asheet';
  s.innerHTML=`<div class="sp"><div class="grab"></div><div class="ash-h"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>${items.map((it,i)=>`<button class="ash-i${it.danger?' danger':''}" data-i="${i}">${ic(it.icon||'more')}<span>${esc(it.label)}</span></button>`).join('')}</div>`;
  s.addEventListener('click',e=>{
    if(e.target===s){closeActionSheet();return}
    const b=e.target.closest('[data-i]');if(!b)return;
    const it=items[+b.dataset.i];closeActionSheet();try{it.fn()}catch(x){console.error(x)}
  });
  document.body.appendChild(s);
}
function askText(title,value,okLabel,cb){
  const m=document.createElement('div');m.className='modal ptxt';
  m.innerHTML=`<form class="pbox"><h3>${esc(title)}</h3><input name="v" value="${esc(value||'')}" maxlength="60" autocomplete="off" aria-label="${esc(title)}"><div class="acts"><button type="button" class="btn line sm" data-x>Cancel</button><button class="btn sm" type="submit">${esc(okLabel||'Save')}</button></div></form>`;
  const close=()=>m.remove();
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))close()});
  m.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const v=e.target.v.value.trim();if(v){close();cb(v)}});
  document.body.appendChild(m);
  const i=m.querySelector('input');i.focus();i.select();
}

async function downloadTrack(t){
  toast('Preparing download…');
  try{
    const d=await api('/music/play/'+enc(t.id),{timeout:30000});

/* ---------- lyrics view ---------- */
class LyricsView{
  constructor(box,syncBtn){
    this.box=box;this.sync=syncBtn;this.lines=[];this.idx=-2;this.userUntil=0;this.synced=false;this.off=0;this.els=[];
    const hold=()=>{this.userUntil=Date.now()+3800;this.sync.hidden=false};
    box.addEventListener('wheel',hold,{passive:true});box.addEventListener('touchmove',hold,{passive:true});
    syncBtn.addEventListener('click',()=>{this.userUntil=0;this.sync.hidden=true;this.scrollTo(this.idx,true)});
    box.addEventListener('click',e=>{
      const p=e.target.closest('.ll');if(!p||!this.synced)return;
      const l=this.lines[+p.dataset.i];if(l&&isFinite(l.t)){Music.seek(Math.max(0,l.t-this.off));this.userUntil=0;this.sync.hidden=true;if(Music.A.paused)Music.toggle()}
    });
  }
  message(html){this.lines=[];this.els=[];this.idx=-2;this.synced=false;this.box.innerHTML=`<div class="lmsg">${html}</div>`;this.box.scrollTop=0}
  set(L,off){
    this.off=off||0;
    if(!L){this.message('No lyrics found for this song');return}
    if(!L.synced){
      this.lines=[];this.els=[];this.synced=false;this.idx=-2;
      this.box.innerHTML=`<div class="lplain">${esc(L.plain).replace(/\n/g,'<br>')}</div>`;this.box.scrollTop=0;return;
    }
    this.synced=true;this.lines=L.lines;this.idx=-2;
    this.box.innerHTML='<div class="lpad"></div>'+L.lines.map((l,i)=>`<p class="ll" data-i="${i}"><span class="lw">${l.text?esc(l.text):'<i class="lnote">♪</i>'}</span></p>`).join('')+'<div class="lpad"></div>';
    this.els=$$('.ll',this.box);this.box.scrollTop=0;
    this.tick(Music.A.currentTime||0,true);
  }
  findIdx(t){
    const L=this.lines;let lo=0,hi=L.length-1,r=-1;
    while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=t){r=m;lo=m+1}else hi=m-1}
    return r;
  }
  tick(now,force){
    if(!this.synced||!this.lines.length)return;
    const t=now+this.off+.12;
    const i=this.findIdx(t);
    if(i!==this.idx||force){
      const prev=this.idx;this.idx=i;
      this.els.forEach((el,k)=>{
        const d=k-i;
        el.className='ll'+(k===i?' on':(k<i?' past':'')+(d>0&&d<=2?' next':''));
        if(k!==i)el.style.removeProperty('--p');
      });
      if(Date.now()>this.userUntil)this.scrollTo(i,prev===-2||Math.abs(i-prev)>4||force);
    }
    if(i>=0&&this.els[i]){
      const a=this.lines[i].t,b=this.lines[i+1]?this.lines[i+1].t:a+6;
      const p=clamp((t-a)/Math.max(.4,Math.min(b-a,9)),0,1);
      this.els[i].style.setProperty('--p',(p*100).toFixed(1)+'%');
    }
  }
  scrollTo(i,instant){
    const el=this.els[Math.max(0,i)];if(!el||!this.box.clientHeight)return;
    const top=el.offsetTop-this.box.clientHeight*.36+el.offsetHeight/2;
    try{this.box.scrollTo({top,behavior:instant?'auto':'smooth'})}catch(e){this.box.scrollTop=top}
  }
}

function wireMusicUI(){
  const np=MU_UI.np,mini=MU_UI.mini;
  mini.addEventListener('click',e=>{
    const b=e.target.closest('[data-m]');if(!b)return;
    const a=b.dataset.m,S=Music.S;
    if(a==='open')openNP();
    else if(a==='toggle')Music.toggle();
    else if(a==='next')Music.next();
    else if(a==='prev')Music.prev();
    else if(a==='like'&&S.cur){const on=Lib.toggleLike(S.cur);toast(on?'Added to liked songs':'Removed from liked songs');syncLikes()}
    else if(a==='queue'){openNP('queue')}
  });
  np.addEventListener('click',e=>{
    const tb=e.target.closest('.np-tabs [data-tab]');if(tb){setNPTab(tb.dataset.tab);return}
    const l=e.target.closest('[data-l]');
    if(l){
      const k=l.dataset.l;
      if(k==='retry'){Music.refetchLyrics();return}
      const o=Music.lyrOffset();
      Music.setLyrOffset(k==='0'?0:o+(k==='+'?.1:-.1));
      return;
    }
    const q=e.target.closest('[data-q]');
    if(q){
      const k=q.dataset.q;
      if(k==='clear'){Music.clearUpNext();return}
      if(k==='auto'){Music.setAutoplay(q.checked);return}
      if(k==='rm'){Music.removeAt(+q.closest('.qrow').dataset.i);return}
    }
    const qr=e.target.closest('.qrow');if(qr&&!e.target.closest('button')){Music.playIndex(+qr.dataset.i);return}
    const n=e.target.closest('[data-n]');if(!n)return;
    const a=n.dataset.n,S=Music.S,t=S.cur;
    if(a==='close')closeNP();
    else if(a==='toggle')Music.toggle();
    else if(a==='next')Music.next();
    else if(a==='prev')Music.prev();
    else if(a==='shuffle')Music.setShuffle(!S.shuffle);
    else if(a==='repeat')Music.setRepeat(S.repeat==='off'?'all':S.repeat==='all'?'one':'off');
    else if(a==='like'&&t){const on=Lib.toggleLike(t);toast(on?'Added to liked songs':'Removed from liked songs');syncLikes()}
    else if(a==='plist'&&t)playlistPicker(t);
    else if(a==='dl'&&t)downloadTrack(t);
    else if(a==='share'&&t){const u=location.href.split('#')[0]+'#/music/play/'+enc(t.id);if(navigator.share)navigator.share({title:t.title,text:t.artist,url:u}).catch(()=>{});else navigator.clipboard&&navigator.clipboard.writeText(u).then(()=>toast('Link copied'))}
    else if(a==='sleep')actionSheet('Sleep timer','',[15,30,45,60].map(m=>({icon:'moon',label:m+' minutes',fn:()=>Music.setSleep(m)})).concat([{icon:'moon',label:'End of this song',fn:()=>Music.setSleep('end')},{icon:'close',label:'Turn off',fn:()=>Music.setSleep(0)}]));
    else if(a==='speed')actionSheet('Playback speed','',[.75,.9,1,1.15,1.25,1.5].map(s=>({icon:'gauge',label:s+'×'+(s===S.speed?'  ✓':''),fn:()=>Music.setSpeed(s)})));
    else if(a==='more'&&t)trackSheet(t);
  });
  $('#np-vol',np).addEventListener('input',e=>Music.setVol(+e.target.value));
  /* seek slider */
  const sk=$('#np-seek',np);
  const pos=e=>{const r=sk.getBoundingClientRect();return clamp((e.clientX-r.left)/Math.max(1,r.width),0,1)};
  const prev=p=>{const d=Music.A.duration;if(!isFinite(d))return;$('.prg',sk).style.width=(p*100)+'%';$('.knob',sk).style.left=(p*100)+'%';$('#np-cur',np).textContent=fmtTime(p*d)};
  sk.addEventListener('pointerdown',e=>{if(!isFinite(Music.A.duration))return;try{sk.setPointerCapture(e.pointerId)}catch(x){}MU_UI.drag=true;sk.classList.add('drag');prev(pos(e))});
  sk.addEventListener('pointermove',e=>{if(MU_UI.drag)prev(pos(e))});
  sk.addEventListener('pointerup',e=>{if(!MU_UI.drag)return;MU_UI.drag=false;sk.classList.remove('drag');Music.seek(pos(e)*Music.A.duration)});
  sk.addEventListener('pointercancel',()=>{MU_UI.drag=false;sk.classList.remove('drag')});
  /* swipe down to close on touch (header/art area) */
  let sy=null;
  np.addEventListener('touchstart',e=>{const t=e.target;if(t.closest('.lbox,.np-queue,.np-seek,input'))return;sy=e.touches[0].clientY},{passive:true});
  np.addEventListener('touchend',e=>{if(sy==null)return;const dy=e.changedTouches[0].clientY-sy;sy=null;if(dy>110)closeNP()},{passive:true});
  /* keyboard */
  document.addEventListener('keydown',e=>{
    if(App.player||document.querySelector('.modal'))return;
    const tag=(e.target.tagName||'').toLowerCase();
    if(['input','textarea','select'].includes(tag))return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const onMusic=(location.hash||'').startsWith('#/music')||MU_UI.open;
    if(!onMusic||!Music.S.cur)return;
    if(e.key==='Escape'&&MU_UI.open){closeNP();return}
    if(/^(button|a)$/.test(tag)&&(e.key===' '||e.key==='Enter'))return;
    let h=true;
    if(e.key===' ')Music.toggle();
    else if(e.key==='ArrowRight'&&e.shiftKey)Music.next();
    else if(e.key==='ArrowLeft'&&e.shiftKey)Music.prev();
    else if(e.key==='ArrowRight')Music.seek(Music.A.currentTime+5);
    else if(e.key==='ArrowLeft')Music.seek(Music.A.currentTime-5);
    else if(e.key==='n'||e.key==='N')Music.next();
    else if(e.key==='p'||e.key==='P')Music.prev();
    else h=false;
    if(h)e.preventDefault();
  });
  /* keep sleep countdown fresh */

function songRow(t,i,o){

function wireMusicPages(){
  document.addEventListener('click',e=>{
    const mc=e.target.closest('.mcard[data-ml]');
    if(mc){const l=MLISTS[mc.dataset.ml];if(l)Music.play(l.tracks.slice(0,60),+mc.dataset.i,{});return}
    const sl=e.target.closest('.slist');
    if(sl){
      const row=e.target.closest('.srow');if(!row)return;
      const l=MLISTS[sl.dataset.l];if(!l)return;
      const i=+row.dataset.i,t=l.tracks[i];
      const ra=e.target.closest('[data-ra]');
      if(ra){
        e.stopPropagation();
        if(ra.dataset.ra==='like'){const on=Lib.toggleLike(t);toast(on?'Added to liked songs':'Removed from liked songs');syncLikes()}
        else trackSheet(t,l.o);
        return;
      }
      if(Music.S.cur&&Music.S.cur.id===t.id&&!Music.S.restored){Music.toggle();return}
      Music.play(l.tracks,i);
    }
  });
}

/* ---------------- SEARCH ---------------- */
async function musicSearchAll(q){
  const [a,y]=await Promise.allSettled([api('/music/search?q='+enc(q),{ttl:300000,timeout:35000}),api('/music/yt/search?q='+enc(q),{ttl:300000,timeout:35000})]);
  const ok=a.status==='fulfilled'||y.status==='fulfilled';
  if(!ok)throw a.reason||y.reason;
  return dedupeTracks([...(a.status==='fulfilled'?mList(a.value):[]),...(y.status==='fulfilled'?mList(y.value):[])]);
}

function initHero(root,slides){
  if(!root||slides.length<1)return;
  let i=0,timer=null;const DUR=8000;
  const content=$('.hcontent',root),sl=$$('.hslide',root),th=$$('.hth',root),dots=$$('.hdots i',root);
  function show(n){
    const nx=(n+slides.length)%slides.length;
    if(nx===i&&content.dataset.set)return sched();
    i=nx;content.dataset.set='1';
    sl.forEach((s,k)=>s.classList.toggle('on',k===i));
    th.forEach((t,k)=>t.classList.toggle('on',k===i));
    dots.forEach((t,k)=>t.classList.toggle('on',k===i));
    content.innerHTML=heroContent(slides[i]);
    sched();
  }
  function sched(){clearTimeout(timer);if(slides.length>1)timer=setTimeout(()=>{if(document.hidden)return sched();show(i+1)},DUR)}
  th.forEach((t,k)=>t.addEventListener('click',()=>show(k)));
  let sx=null;
  root.addEventListener('pointerdown',e=>{sx=e.clientX});
  root.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60&&!e.target.closest('a,button'))show(i+(dx<0?1:-1))});
  sched();
  App.leave.push(()=>clearTimeout(timer));
}

/* ---------------- WATCH (TMDB) ---------------- */
function mbBest(cands,title,year,media){
  const nt=normTitle(title);let best=null,bs=0;
  for(const c of cands){
    const t=normTitle(c.title);let s=0;
    if(t===nt)s=10;else if(t&&nt&&(t.startsWith(nt)||nt.startsWith(t)))s=6;else if(t&&nt&&(t.includes(nt)||nt.includes(t)))s=4;else continue;
    if(year&&c.year&&String(c.year)===String(year))s+=3;
    else if(year&&c.year&&Math.abs(+c.year-+year)>1)s-=3;
    if(c.media===media)s+=2;else s-=2;
    if(s>bs){bs=s;best=c}
  }
  return bs>=5?best:null;
}
function nextSeasonEp(W){
  const eps=W.eps||[],sn=(W.detail&&W.detail.seasons||[]).filter(s=>s.season>0).map(s=>s.season).sort((a,b)=>a-b);
  const cur=eps.findIndex(e=>e.episode==W.ep);
  if(cur>=0&&cur<eps.length-1)return{se:W.se,ep:eps[cur+1].episode};
  if(!eps.length&&W.ep>0&&W.ep<200&&!sn.length)return{se:W.se,ep:W.ep+1};
  const si=sn.indexOf(W.se);
  if(si>=0&&si<sn.length-1)return{se:sn[si+1],ep:1};
  return null;
}
function prevSeasonEp(W){
  const eps=W.eps||[];const cur=eps.findIndex(e=>e.episode==W.ep);
  if(cur>0)return{se:W.se,ep:eps[cur-1].episode};
  if(!eps.length&&W.ep>1)return{se:W.se,ep:W.ep-1};
  return null;
}

class MbPlay{
  constructor(o){
    this.o=o;this.i=-1;this.dead=false;this.player=null;this.embed=null;this.caps=[];
    const e=o.entries;
    o.panel.innerHTML=`<div class="srv" id="mbp">${e.map((x,i)=>`<button class="pill" data-e="${i}">${ic(x.type==='embed'?'server':'play')}${esc(x.label)}</button>`).join('')}${o.extra||''}<button class="pill" data-dbg="1">${ic('info')}Debug</button></div>

    o.panel.onclick=ev=>{
      const b=ev.target.closest('[data-e]');if(b){this.start(+b.dataset.e);return}
      if(ev.target.closest('[data-dbg]')){jsonModal('MovieBox debug',{parsed:this.o.entries,raw:this.o.raw,hevc:hevcOK()});return}
      if(ev.target.closest('[data-alt]')&&this.o.onAlt)this.o.onAlt();
    };
    this.start(0);
  }
  setCaps(c){this.caps=c;if(this.player)this.player.setSubtitles(c)}
  teardown(){
    if(this.player){this.player.destroy();this.player=null}
    if(this.embed){this.embed.destroy();this.embed=null}
    if(App.player&&!App.player.dead&&App.player===this.player)App.player=null;
  }
  start(i){
    if(this.dead)return;
    const e=this.o.entries[i];if(!e)return;
    this.teardown();this.i=i;
    $$('#mbp [data-e]',this.o.panel).forEach(b=>b.classList.toggle('on',+b.dataset.e===i));
    const st=this.o.stage;st.innerHTML='';
    const hasNext=i<this.o.entries.length-1;
    if(e.type==='embed'){
      this.embed=mountEmbed(st,e.url,{title:this.o.player&&this.o.player.title,onSlow:hasNext?()=>{toast('Next stream…');this.start(i+1)}:null});
      App.embed=this.embed;App.player=null;
    }else{
      const po=Object.assign({},this.o.player,{sources:[e],subtitles:this.caps,autoAdvance:hasNext,
        onExhausted:hasNext?()=>{toast('That stream failed — trying the next one…');this.start(i+1)}:null,
        errorExtra:e.kind==='dash'&&!hevcOK()?'This browser cannot decode HEVC (H.265) DASH — use an embed stream above, or open it in VLC / MX Player.':''});
      this.player=new VPlayer(st,po);App.player=this.player;
    }
  }
  destroy(){this.dead=true;this.teardown();if(this.o.panel)this.o.panel.onclick=null}
}

  document.body.classList.add('watching');
  const key=`tmdb:${media}:${id}`;
  const W={media,id,se,ep,tv,detail:null,sources:[],idx:0,tab:'srv',title:'',year:'',poster:'',eps:[],mb:null,hub:null};
  mount(`<div class="wgrid${tv?' has-side':''}"><section class="wmain">
    <div class="stage" id="stage"><div class="ld"><div class="spin"></div><span>Finding the best servers…</span></div></div>
    <div class="wbar" id="wbar"><div class="sk" style="height:42px;width:min(420px,70%)"></div></div>
    <div class="tabs" id="wtabs"><button class="on" data-t="srv">Servers</button><button data-t="mb">MovieBox HD</button><button data-t="hub">4K & downloads</button></div>
    <div id="wpanel" class="panel"></div></section>${tv?'<aside class="wside" id="wside"></aside>':''}</div>`,'watch');
  const stage=$('#stage');
  const destroyStage=()=>{if(App.player){App.player.destroy();App.player=null}if(App.embed){App.embed.destroy();App.embed=null}};
  const stageMsg=(inner)=>{destroyStage();stage.innerHTML=`<div class="ld" style="background:#05040d">${inner}</div>`};
  const hashFor=(s,e)=>`#/watch/${media}/${id}?se=${s}&ep=${e}`;
  const subTitle=()=>tv?`Season ${W.se} · Episode ${W.ep}${W.epName?' — '+W.epName:''}`:[W.year,'Movie'].filter(Boolean).join(' • ');

  function renderBar(){
    const nx=tv?nextSeasonEp(W):null;
    $('#wbar').innerHTML=`<div style="min-width:0"><h1 class="h2">${esc(W.title||'Loading…')}<small>${esc(subTitle())}</small></h1></div>
      <div class="wact">${W.title?listBtn(listItemTmdb({media,id,title:W.title,year:W.year,poster:W.poster}),'btn sm glass','My list'):''}
      <a class="btn sm glass" href="#/title/${media}/${id}">${ic('info')}Details</a>
      ${nx?`<a class="btn sm" href="${hashFor(nx.se,nx.ep)}">Next episode ${ic('next')}</a>`:''}</div>`;
  }
  function saveHist(){
    W.started=true;
    if(!W.title)return;
    const old=Hist.get(key);const same=old&&old.se===W.se&&old.ep===W.ep;
    Hist.put({k:key,href:hashFor(W.se,W.ep),title:W.title,poster:W.poster,sub:tv?`S${W.se} E${W.ep}`:(W.year||''),se:W.se,ep:W.ep,pos:same?old.pos:0,dur:same?old.dur:0});
  }
  function goEp(t){if(t)location.hash=hashFor(t.se,t.ep)}
  function nativeOpts(extra){
    const nx=tv?nextSeasonEp(W):null,pv=tv?prevSeasonEp(W):null;
    const old=Hist.get(key);const resume=old&&old.se===W.se&&old.ep===W.ep?old.pos:0;
    return Object.assign({title:W.title,sub:subTitle(),poster:W.backdrop||W.poster,resume,
      onNext:nx?()=>goEp(nx):null,onPrev:pv?()=>goEp(pv):null,
      onProgress:(p,d)=>Hist.progress(key,p,d),onBack:()=>{location.hash=`#/title/${media}/${id}`}},extra||{});
  }
  function playNative(sources,extra){
    destroyStage();stage.innerHTML='';
    App.player=new VPlayer(stage,Object.assign(nativeOpts(),{sources},extra||{}));
  }
  /* ----- servers tab ----- */
  function playServer(i){
    W.idx=i;const s=W.sources[i];if(!s)return;
    $$('#wpanel [data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
    saveHist();
    if(s.type==='embed'){
      destroyStage();
      App.embed=mountEmbed(stage,abs(s.play_url||s.url),{title:W.title,onSlow:()=>nextServer()});
    }else{
      const urls=[];[s.play_url,s.url].forEach(u=>{if(u){const a=abs(u);if(!urls.some(x=>x.url===a))urls.push({url:a})}});
      playNative([{label:s.label||'Server',fmt:guessFmt(urls[0]&&urls[0].url,s.format),urls,raw:abs(s.url||s.play_url)}],{onExhausted:()=>nextServer()});
    }
  }
  function nextServer(){
    if(!W.sources.length)return;
    if(W.idx<W.sources.length-1){toast('Switching server…');playServer(W.idx+1)}
    else{toast('That was the last server. Trying MovieBox…');switchTab('mb')}
  }
  function renderServers(){
    const p=$('#wpanel');
    if(!W.sources.length){
      p.innerHTML=`<div class="note"><b>No servers responded.</b> ${W.playErr?esc(W.playErr):''} Try the <b>MovieBox HD</b> tab — it searches a separate source.</div>`;return;
    }
    p.innerHTML=`<div class="srv">${W.sources.map((s,i)=>`<button class="pill${i===W.idx?' on':''}" data-i="${i}">${ic(s.type==='embed'?'server':'play')}${esc(s.label||('Server '+(i+1)))}</button>`).join('')}</div>
      <div class="srv" style="margin-top:12px"><button class="pill" data-nx="1">${ic('next')}Next server</button><a class="pill" data-open="1" href="#" target="_blank" rel="noopener">${ic('ext')}Open this server in a new tab</a></div>
      <div class="note" style="margin-top:14px">If a server shows a black screen, a sad-face page or an ad wall, switch to the next one — some servers block embedding. <b>MovieBox HD</b> gives a clean player with quality, audio and subtitle options.</div>`;
    p.onclick=e=>{
      const b=e.target.closest('[data-i]');if(b){playServer(+b.dataset.i);return}
      if(e.target.closest('[data-nx]')){nextServer();return}
      const o=e.target.closest('[data-open]');if(o){const s=W.sources[W.idx];o.href=abs((s&&(s.play_url||s.url))||'#')}
    };
  }
  /* ----- MovieBox tab ----- */
  async function mbTab(pick){
    const p=$('#wpanel');
    p.innerHTML=`<div class="state"><div class="spin"></div><p>Searching MovieBox for “${esc(W.title)}”…</p></div>`;
    try{
      if(!W.mb||!W.mb.cands){const d=await api('/mb/search?q='+enc(W.title),{ttl:600000,timeout:30000});if(tok!==RT)return;W.mb={cands:mbFlat(d)}}
      if(W.tab!=='mb')return;
      const cands=W.mb.cands;
      const item=pick||W.mb.item||mbBest(cands,W.title,W.year,media);
      if(!cands.length){p.innerHTML=`<div class="note"><b>Not found on MovieBox.</b> Nothing matched “${esc(W.title)}”. Try another server, or <a href="#/mb?q=${enc(W.title)}" style="color:var(--accent)">search MovieBox manually</a>.</div>`;stageMsg(`${ic('search')}<span>Not on MovieBox — pick another server</span>`);return}
      if(!item){
        p.innerHTML=`<div class="note"><b>Pick the right match.</b> We couldn’t auto-match with certainty.</div><div class="grid" style="margin-top:16px">${cands.slice(0,12).map((c,i)=>`<button class="card" data-mp="${i}" style="text-align:left"><div class="poster${c.poster?'':' noimg'}" data-i="${esc(initials(c.title))}">${imgTag(c.poster,c.title)}<div class="pov"><span class="pbtn">${ic('play')}</span></div></div><div class="ctitle">${esc(c.title)}</div><div class="csub">${esc([c.year,c.media==='tv'?'Series':'Movie'].filter(Boolean).join(' • '))}</div></button>`).join('')}</div>`;
        p.onclick=e=>{const b=e.target.closest('[data-mp]');if(b){W.mb.item=cands[+b.dataset.mp];mbTab(W.mb.item)}};
        stageMsg(`${ic('box')}<span>Select a MovieBox match below</span>`);return;
      }
      W.mb.item=item;
      p.innerHTML=`<div class="state"><div class="spin"></div><p>Getting streams for “${esc(item.title)}”…</p></div>`;
      const sd=await mbFetchStreams(item.id,tv?W.se:0,tv?W.ep:0);
      if(tok!==RT||W.tab!=='mb')return;
      const parsed=mbParseStream(sd);
      if(!parsed.entries.length){const er=new Error('MovieBox returned no playable stream for this '+(tv?'episode':'title')+' yet.');er.raw=sd;throw er}
      saveHist();
      destroyStage();stage.innerHTML='';
      if(W.mbp)W.mbp.destroy();
      W.mbp=new MbPlay({stage,panel:p,entries:parsed.entries,raw:sd,hevc:parsed.hevc,player:nativeOpts(),
        extra:`<button class="pill" data-alt="1">${ic('search')}Wrong title?</button>`,
        onAlt:()=>{W.mb.item=null;W.mb.cands=W.mb.cands;mbTab(null)}});
      api(`/mb/captions/${enc(item.id)}?resource_id=${enc(parsed.captionId||'')}&se=${tv?W.se:0}&ep=${tv?W.ep:0}`,{ttl:600000,retries:0,timeout:20000}).then(parseCaptions).catch(()=>[])
        .then(caps=>{if(tok===RT&&W.mbp&&caps.length){W.mbp.setCaps(caps);toast(caps.length+' subtitle'+(caps.length>1?'s':'')+' available')}});
    }catch(e){
      if(tok!==RT||W.tab!=='mb')return;
      p.innerHTML=`<div class="note"><b>MovieBox could not play this.</b> ${esc(e.message)}</div><div class="srv" style="margin-top:12px"><button class="pill" data-retry="1">${ic('refresh')}Retry</button><button class="pill" data-back="1">Use servers instead</button>${e.raw?`<button class="pill" data-dbg="1">${ic('info')}Debug</button>`:''}</div>`;
      p.onclick=ev=>{if(ev.target.closest('[data-retry]'))mbTab(W.mb&&W.mb.item);if(ev.target.closest('[data-back]'))switchTab('srv');if(ev.target.closest('[data-dbg]'))jsonModal('MovieBox raw response',e.raw)};
      stageMsg(`${ic('alert')}<span>MovieBox is unavailable for this title</span>`);
    }
  }
  /* ----- 4K tab ----- */
  async function hubTab(){
    const p=$('#wpanel');
    p.onclick=null;
    p.innerHTML=`<div class="note">Looking for 4K releases and direct download links… this can take up to a minute.</div>
      <div id="h-fk" style="margin-top:14px"><div class="state"><div class="spin"></div><p>Searching 4KHDHub…</p></div></div><div id="h-play"></div>`;
    wireResolve(p);
    const fetchTok=tok;let found=0,pending=2;
    const done=()=>{if(--pending===0&&!found&&$('#h-fk')&&fetchTok===RT)$('#h-fk').innerHTML=`<div class="note"><b>No 4K releases found</b> for “${esc(W.title)}”. <a href="#/hub?q=${enc(W.title)}" style="color:var(--accent)">Search the 4K Hub manually</a> or try <a href="#/dl" style="color:var(--accent)">the Downloader</a>.</div>`};
    /* A: 4KHDHub search -> releases with direct links */
    (async()=>{
      const box=$('#h-fk');
      try{
        const sd=await api('/fk/search?q='+enc(W.title),{ttl:600000,timeout:45000});
        if(fetchTok!==RT||W.tab!=='hub')return;
        const cands=hubList(sd);
        const best=hubBest(cands,W.title,W.year);
        if(!best){
          box.innerHTML=cands.length?`<div class="note"><b>Pick the matching release page.</b></div><div class="lrows" style="margin-top:10px">${cands.slice(0,8).map(c=>`<button class="lrow" data-hp="${esc(c.id)}" style="text-align:left"><div class="ico">${ic('dl')}</div><div class="lt"><b>${esc(c.title)}</b><small>${esc(c.sub||'')}</small></div></button>`).join('')}</div>`:'';
          if(cands.length){found++;box.onclick=e=>{const b=e.target.closest('[data-hp]');if(b)loadFk(b.dataset.hp,cands.find(x=>x.id===b.dataset.hp))}}
          return;
        }
        await loadFk(best.id,best);
      }catch(e){if(fetchTok===RT&&$('#h-fk')&&W.tab==='hub')$('#h-fk').innerHTML=`<div class="note">4K search failed: ${esc(e.message)}</div>`}
      finally{done()}
    })();
    async function loadFk(id,meta){
      const box=$('#h-fk');if(!box)return;
      box.innerHTML=`<div class="state"><div class="spin"></div><p>Resolving mirrors for “${esc(meta&&meta.title||W.title)}”…</p></div>`;
      try{
        const d=await api(`/fk/stream?id=${enc(id)}&resolve=true${tv?`&se=${W.se}&ep=${W.ep}`:''}`,{timeout:120000,retries:0});
        if(fetchTok!==RT||W.tab!=='hub')return;
        const h=renderReleases(d);
        if(h){found++;box.innerHTML=`<div class="grp" style="margin-top:0">${esc(meta&&meta.title||'4K releases')}</div>${h}`}
        else box.innerHTML=`<div class="note">This page has no downloadable mirrors right now.</div>`;
      }catch(e){if(fetchTok===RT&&$('#h-fk'))$('#h-fk').innerHTML=`<div class="note">Could not resolve mirrors: ${esc(e.message)} <button class="pill" data-rr="1">Retry</button></div>`;const r=$('#h-fk [data-rr]');if(r)r.onclick=()=>loadFk(id,meta)}
    }
    /* B: /api/play?fast=0 (hub sources + downloads) */
    api(`/api/play?tmdb_id=${enc(id)}&media=${media}&fast=0${tv?`&se=${W.se}&ep=${W.ep}`:''}`,{timeout:90000,retries:0}).then(d=>{
      if(fetchTok!==RT||W.tab!=='hub')return;
      const hs=(d.sources||[]).filter(s=>s.provider==='4khdhub'),dl=d.downloads||[];
      const box=$('#h-play');if(!box)return;
      let out='';
      if(hs.length){found++;out+=`<div class="grp">Play</div><div class="srv">${hs.map((s,i)=>`<button class="pill" data-hs="${i}">${ic('play')}${esc(s.label||'4K')}</button>`).join('')}</div>`}
      if(dl.length){found++;out+=`<div class="grp">Download</div><div class="lrows">${dl.map(s=>linkRow({label:s.label||'File',url:s.url||'',ext:s.format})).join('')}</div>`}
      box.innerHTML=out;
      box.onclick=e=>{
        const b=e.target.closest('[data-hs]');if(!b)return;
        const s=hs[+b.dataset.hs];const urls=[];[s.play_url,s.url].forEach(u=>{if(u){const a=abs(u);if(!urls.some(x=>x.url===a))urls.push({url:a})}});
        if(s.type==='embed'){destroyStage();App.embed=mountEmbed(stage,urls[0].url,{title:W.title})}
        else playNative([{label:s.label||'4K',fmt:guessFmt(urls[0].url,s.format),urls,raw:abs(s.url||s.play_url)}]);
        window.scrollTo({top:0,behavior:'smooth'});
      };
    }).catch(()=>{}).finally(done);
  }
  function switchTab(t){
    if(t!=='mb'&&W.mbp){W.mbp.destroy();W.mbp=null}
    W.tab=t;$$('#wtabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
    const p=$('#wpanel');p.onclick=null;p.classList.remove('panel');void p.offsetWidth;p.classList.add('panel');
    if(t==='srv'){renderServers();if(W.sources.length&&(!App.player&&!App.embed||W.leftSrv))playServer(W.idx);W.leftSrv=false}
    else if(t==='mb'){W.leftSrv=true;mbTab()}
    else{W.leftSrv=true;hubTab()}
  }
  $('#wtabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b&&b.dataset.t!==W.tab)switchTab(b.dataset.t)});

  /* ----- episodes side ----- */
  async function loadSide(seasonNo){
    const side=$('#wside');if(!side)return;
    const seasons=(W.detail&&W.detail.seasons||[]).filter(s=>s&&s.season!=null);
    const cur=seasonNo!=null?seasonNo:W.se;
    side.innerHTML=`<div class="box"><div class="bh"><b>Episodes</b>${seasons.length>1?`<select id="sesel" aria-label="Season">${seasons.map(s=>`<option value="${s.season}"${s.season==cur?' selected':''}>${esc(s.name||('Season '+s.season))}</option>`).join('')}</select>`:`<span class="sub">Season ${cur}</span>`}</div><div class="bl" id="bl">${Array.from({length:6},()=>'<div class="sk" style="height:64px"></div>').join('')}</div></div>`;
    const sel=$('#sesel');if(sel)sel.onchange=()=>loadSide(+sel.value);
    try{
      const sd=await api(`/api/tv/${id}/season/${cur}`,{ttl:600000});
      if(tok!==RT)return;
      const eps=(sd.episodes||[]).slice().sort((a,b)=>(a.episode||0)-(b.episode||0));
      if(cur==W.se){W.eps=eps;const me=eps.find(e=>e.episode==W.ep);if(me){W.epName=me.name;renderBar();if(App.player){}}}
      const bl=$('#bl');if(!bl)return;
      bl.innerHTML=eps.length?eps.map(e=>`<a class="ep${cur==W.se&&e.episode==W.ep?' on':''}" href="${hashFor(cur,e.episode)}"><div class="th">${(e.still||e.image||e.thumb)?imgTag(e.still||e.image||e.thumb,''):'E'+e.episode}</div><div style="min-width:0"><b>${e.episode}. ${esc(e.name||('Episode '+e.episode))}</b><small>${esc(e.runtime?e.runtime+' min':(e.air_date||''))}</small></div></a>`).join(''):'<div class="note">No episodes listed.</div>';
      const on=$('#bl .ep.on');if(on)on.scrollIntoView({block:'nearest'});
    }catch(er){const bl=$('#bl');if(bl&&tok===RT)bl.innerHTML=`<div class="note">${esc(er.message)}</div>`}
  }

  /* ----- boot the page ----- */
  const detailP=api(`/api/detail/${media}/${id}`,{ttl:600000}).catch(()=>null);
  const playP=api(`/api/play?tmdb_id=${enc(id)}&media=${media}&fast=1${tv?`&se=${se}&ep=${ep}`:''}`,{timeout:35000,retries:1}).catch(e=>({__err:e}));
  detailP.then(d=>{
    if(tok!==RT)return;
    if(d){W.detail=d;W.title=d.name||d.title||'';W.year=d.year||'';W.poster=d.poster||'';W.backdrop=d.backdrop||d.poster||'';document.title=(W.title?W.title+' — ':'')+'MovieAll'}
    renderBar();
    if(W.started)saveHist();
    if(tv)loadSide();
  });
  const pd=await playP;
  if(tok!==RT)return;
  const dd=await Promise.race([detailP,sleep(2500).then(()=>undefined)]);
  if(tok!==RT)return;
  if(dd&&!W.title){W.detail=dd;W.title=dd.name||dd.title||'';W.year=dd.year||'';W.poster=dd.poster||'';W.backdrop=dd.backdrop||dd.poster||''}
  renderBar();
  if(pd&&pd.__err)W.playErr=pd.__err.message;
  W.sources=(pd&&pd.sources)||[];
  if(!W.title&&pd&&(pd.title||pd.name)){W.title=pd.title||pd.name;renderBar()}
  if(W.sources.length){renderServers();playServer(0)}
  else{
    W.tab='mb';$$('#wtabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='mb'));
    toast('No servers responded — trying MovieBox');
    await detailP;if(tok!==RT)return;
    mbTab();
  }
}

const searchField=(id,ph,val,btn='Search')=>`<form class="field" id="${id}" autocomplete="off"><input name="q" value="${esc(val||'')}" placeholder="${esc(ph)}" enterkeyhint="search" aria-label="${esc(ph)}"><button class="btn sm" type="submit">${btn}</button></form>`;
function wireField(id,fn){const f=$('#'+id);if(f)f.addEventListener('submit',e=>{e.preventDefault();const v=f.q.value.trim();if(v)fn(v)})}
const featureHTML=(o)=>`<section class="afeat"><div class="bgi" style="background-image:url('${esc(abs(o.poster||''))}')"></div><div class="in">
  <div class="ap${o.poster?'':' noimg'}" data-i="${esc(initials(o.title))}">${imgTag(o.poster,o.title)}</div>
  <div class="tx">${o.meta?`<div class="dmeta">${o.meta}</div>`:''}<h1 class="h1">${esc(o.title)}</h1>${o.text?`<p class="dover">${esc(o.text.slice(0,300))}${o.text.length>300?'…':''}</p>`:''}<div class="dbtns">${o.btns||''}</div></div></div></section>`;

/* ---------------- ANIME ---------------- */
const animeSlug=it=>it.slug||it.id||'';
async function pageAnimeHome(tok){
  setNav('anime');
  mount(`<div class="sk" style="height:340px;border-radius:28px"></div>${skRow()}${skRow()}`);
  let d;
  try{d=await api('/anime/home',{ttl:300000,timeout:35000})}
  catch(e){if(tok!==RT)return;mount(stateHTML('alert','Anime could not be loaded',e.message,retryBtn));return}
  if(tok!==RT)return;
  const feat=(d.top_airing||[]).find(x=>x&&animeSlug(x))||(d.most_popular||[]).find(x=>x&&animeSlug(x));
  let html='';
  if(feat)html+=featureHTML({title:feat.title||feat.name||'',poster:feat.poster||feat.thumb,text:feat.overview||feat.description||'',
    meta:`<span class="tag">Hindi dub</span><span>Top airing</span>`,
    btns:`<a class="btn play" href="#/anime/watch/${enc(animeSlug(feat))}?ep=0">${ic('play')}Play</a><a class="btn glass" href="#/anime/title/${enc(animeSlug(feat))}">${ic('info')}Details</a>`});
  html+=`<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0 4px">${searchField('af','Search anime…','')}<a class="btn line" href="#/anime/catalog">${ic('layers')}Full catalog</a></div>`;
  const known=[['top_airing','Top airing'],['most_popular','Most popular'],['latest_episodes','Latest episodes'],['latest_movies','Anime movies'],['completed','Completed']];
  const used=new Set();
  known.forEach(([k,t])=>{if(Array.isArray(d[k])&&d[k].length){used.add(k);html+=rowHTML(t,d[k].filter(x=>x&&animeSlug(x)).map(cAnime))}});
  Object.keys(d).forEach(k=>{if(used.has(k)||!Array.isArray(d[k])||!d[k].length||typeof d[k][0]!=='object')return;
    const items=d[k].filter(x=>x&&animeSlug(x)&&(x.title||x.name));
    if(items.length){if(/genre/i.test(k)){/* genres: render as pills */}else html+=rowHTML(prettyKey(k),items.map(cAnime))}});
  if(Array.isArray(d.genres)&&d.genres.length)html+=`<section class="sec"><div class="sec-h" style="padding:0"><h2 class="h2">Genres</h2></div><div class="pills">${d.genres.map(g=>{const n=typeof g==='string'?g:(g.name||g.title||'');return n?`<a class="pill" href="#/search/${enc(n)}?tab=anime">${esc(n)}</a>`:''}).join('')}</div></section>`;
  if(!feat&&html.indexOf('class="sec"')<0)html+=stateHTML('anime','No anime yet','The anime catalog returned nothing.',retryBtn);
  mount(html);
  wireField('af',q=>{location.hash='#/search/'+enc(q)+'?tab=anime'});
}
async function pageAnimeCatalog(tok){
  setNav('anime');
  mount(`<div class="phead"><div><h1 class="h1">Anime catalog</h1><p>Every series and movie, A to Z.</p></div><a class="btn line" href="#/anime">${ic('back')}Anime home</a></div>${skGrid(12)}`);
  let d;
  try{d=await api('/anime/catalog?type=all',{ttl:600000,timeout:60000})}
  catch(e){if(tok!==RT)return;mount(stateHTML('alert','Catalog could not be loaded',e.message,retryBtn));return}

async function animeResolve(ep){
  let url=ep.stream_url||ep.streamUrl||'';
  const pick=s=>(s&&(s.stream_url||s.url||s.m3u8||s.hls||s.master||''))||'';
  if(!url&&(ep.video_hash||ep.videoHash))url=pick(await api('/anime/stream?hash='+enc(ep.video_hash||ep.videoHash),{timeout:45000}));
  if(!url&&(ep.url||ep.page_url))url=pick(await api('/anime/stream?url='+enc(ep.url||ep.page_url),{timeout:45000}));
  return abs(url);
}

function findSubject(d){
  const q=[d];let n=0;
  while(q.length&&n++<400){
    const x=q.shift();if(!x||typeof x!=='object')continue;
    if(!Array.isArray(x)&&SUBJ_ID(x))return normMb(x);
    if(!Array.isArray(x)&&x.subject&&typeof x.subject==='object'&&SUBJ_ID(x.subject))return normMb(x.subject);
    (Array.isArray(x)?x:Object.values(x)).forEach(v=>{if(v&&typeof v==='object')q.push(v)});
  }
  return null;
}
function mbSeasons(d){
  let found=null;
  (function walk(n,depth){
    if(found||!n||typeof n!=='object'||depth>7)return;
    if(Array.isArray(n)){
      if(n.length&&n.every(x=>x&&typeof x==='object'&&(x.se!=null||x.season!=null||x.season_number!=null||x.seasonNumber!=null))){found=n;return}
      n.forEach(x=>walk(x,depth+1));return;
    }
    Object.keys(n).forEach(k=>walk(n[k],depth+1));
  })(d,0);
  return(found||[]).map(s=>{
    const se=+(s.se!=null?s.se:(s.season!=null?s.season:(s.season_number!=null?s.season_number:s.seasonNumber)));
    let eps=s.maxEp!=null?s.maxEp:(s.max_ep!=null?s.max_ep:(s.episode_count!=null?s.episode_count:(s.episodeCount!=null?s.episodeCount:(s.episodes!=null?s.episodes:0))));
    if(Array.isArray(eps))eps=eps.length;
    eps=+eps;return{se,eps:isFinite(eps)?eps:0};
  }).filter(s=>s.se>0);
}

  return arr.map(it=>({id:it.id||it.path||it.url||it.link||'',title:it.title||it.name||'Untitled',
    poster:it.poster||it.image||it.cover||it.thumbnail||it.img||'',sub:[it.year,it.quality,it.type].filter(Boolean).join(' • ')})).filter(x=>x.id);
}
function hubBest(cands,title,year){
  const nt=normTitle(title);let best=null,bs=0;
  for(const c of cands){
    const ct=normTitle(c.title),all=normTitle(c.title+' '+c.id);let sc=0;
    if(ct===nt||ct.startsWith(nt+' '))sc=9;else if(ct.includes(nt))sc=6;else if(all.includes(nt))sc=5;else continue;
    if(year&&(String(c.title).includes(year)||String(c.id).includes(year)))sc+=3;
    if(sc>bs){bs=sc;best=c}
  }
  return bs>=6?best:null;
}
function wireResolve(root){
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-resolve]');if(!b)return;
    const holder=b.closest('.lrow').nextElementSibling;

    try{

      const l=collectLinks(d);
      if(holder&&holder.matches('[data-rbox]'))holder.innerHTML=l.length?`<div class="lrows" style="margin-top:8px">${l.map(linkRow).join('')}</div>`:'<div class="note" style="margin-top:8px">No direct links found.</div>';
      b.remove();
    }catch(er){b.disabled=false;b.innerHTML=ic('refresh')+'Retry';toast(er.message)}
  });
}
const cHub=n=>cardHTML({href:`#/hub/t?id=${enc(n.id)}&n=${enc(n.title)}`,title:n.title,sub:n.sub,poster:n.poster,kind:'4K'});
const vlcIntent=(u,pkg)=>`intent:${u.replace(/^https?:\/\//,'')}#Intent;scheme=${/^https/.test(u)?'https':'http'};action=android.intent.action.VIEW;type=video/*;package=${pkg};end`;
function linkRow(l){
  const u=abs(l.url);
  const fmt=guessFmt(u,l.ext||l.format);
  const canPlay=/mp4|webm|hls|dash/.test(fmt)||fmt==='auto';
  return`<div class="lrow"><div class="ico">${ic('dl')}</div><div class="lt"><b>${esc(l.label||'File')}</b><small>${esc([l.ext,l.size&&fmtBytes(l.size),l.note].filter(Boolean).join(' • ')||u.slice(0,80))}</small></div>

/* collect { label,url,... } style link objects from any payload */
function collectLinks(d){
  const out=[],seen=new Set();
  (function walk(n,depth,ctx){
    if(!n||depth>7)return;
    if(Array.isArray(n)){n.forEach(x=>walk(x,depth+1,ctx));return}
    if(typeof n!=='object')return;
    let u='';
    for(const k of['url','direct_url','download_url','link','href','src','play_url','stream_url'])if(looksUrl(n[k])||(typeof n[k]==='string'&&/^https?:\/\//i.test(n[k]))){u=n[k];break}
    if(u&&!seen.has(u)){
      seen.add(u);
      const q=n.quality||n.resolution||n.height||n.format_note||'';
      const label=n.label||n.name||n.title||n.host||n.server||n.format||(q?q+(/^\d+$/.test(String(q))?'p':''):'')||'Download';
      out.push({label:String(label)+((n.label||n.name||n.title)&&q&&!String(label).includes(q)?' · '+q+(/^\d+$/.test(String(q))?'p':''):''),url:u,ext:n.ext||n.format||n.type||'',size:n.filesize||n.size||n.file_size||0,
        note:[n.vcodec&&n.vcodec!=='none'&&n.acodec&&n.acodec!=='none'?'video+audio':'',n.muxed?'video+audio':''].filter(Boolean)[0]||''});
      return;
    }
    Object.keys(n).forEach(k=>{const v=n[k];if(v&&typeof v==='object')walk(v,depth+1,ctx)});
  })(d,0);
  return out;
}

function renderReleases(d){

      const direct=m.direct_links||m.directLinks||m.direct||[];

      }
    });
    if(!inner){const l=collectLinks(r);inner=l.map(linkRow).join('')}

}

  const ctx={};
  const T=[
    {n:'API health',p:'/health',ok:d=>d&&d.ok?`v${d.version} · ${(d.providers||[]).length} providers`:Promise.reject(new Error('health not ok'))},
    {n:'Catalog · home rows',p:'/api/home',ok:d=>{const k=Object.keys(d||{}).filter(x=>Array.isArray(d[x])&&d[x].length);if(!k.length)throw new Error('no rows');return k.length+' rows'}},
    {n:'Catalog · movies page',p:'/api/movies?page=1',ok:d=>{const l=tmdbList(d);if(!l.length)throw new Error('no items');return l.length+' titles'}},
    {n:'Catalog · series page',p:'/api/series?page=1',ok:d=>{const l=tmdbList(d);if(!l.length)throw new Error('no items');return l.length+' titles'}},
    {n:'Catalog · search',p:'/api/search?q=avatar',ok:d=>{const l=tmdbList(d);if(!l.length)throw new Error('no results');return l.length+' results'}},
    {n:'Catalog · movie detail',p:'/api/detail/movie/19995',ok:d=>{if(!d||!(d.name||d.title))throw new Error('no name');return d.name||d.title}},
    {n:'Catalog · season episodes',p:'/api/tv/1399/season/1',ok:d=>{const e=(d&&d.episodes)||[];if(!e.length)throw new Error('no episodes');return e.length+' episodes'}},
    {n:'Play · embed servers',p:'/api/play?tmdb_id=19995&media=movie&fast=1',ok:d=>{const s=(d&&d.sources)||[];if(!s.length)throw new Error('no sources');return s.length+' servers ('+s.filter(x=>x.type==='embed').length+' embeds)'}},
    {n:'MovieBox · home',p:'/mb/home',ok:d=>{const s=mbSections(d);if(!s.length)throw new Error('no sections parsed');return s.length+' sections · '+s.reduce((a,b)=>a+b.items.length,0)+' titles'}},
    {n:'MovieBox · search',p:'/mb/search?q=avatar',ok:d=>{const l=mbFlat(d);if(!l.length)throw new Error('no items parsed');ctx.mb=l.find(x=>x.media==='movie')||l[0];return l.length+' results'}},
    {n:'MovieBox · detail',p:()=>ctx.mb&&'/mb/detail/'+enc(ctx.mb.id),ok:d=>{const s=findSubject(d);if(!s)throw new Error('no subject parsed');return s.title}},
    {n:'MovieBox · stream (mp4 / dash+cookie / embeds)',p:()=>ctx.mb&&'/mb/stream/'+enc(ctx.mb.id)+'?se=0&ep=0',ok:d=>{const r=mbParseStream(d);if(!r.entries.length)throw new Error('no streams parsed — open JSON and send it');ctx.mbs=r;return r.entries.map(x=>x.type==='embed'?'embed':x.kind).join(', ')+(r.hevc?' · HEVC ok':' · no HEVC')}},
    {n:'MovieBox · captions',p:()=>ctx.mb&&'/mb/captions/'+enc(ctx.mb.id)+'?resource_id='+enc((ctx.mbs&&ctx.mbs.captionId)||'')+'&se=0&ep=0',ok:d=>parseCaptions(d).length+' subtitle tracks',soft:true},
    {n:'MovieBox · unified /play',p:()=>ctx.mb&&'/play?subject_id='+enc(ctx.mb.id)+'&se=0&ep=0',ok:d=>{const p=mbParseStream({r1:d});if(!p.entries.length)throw new Error('no entries parsed');return p.entries.length+' entries'},soft:true},
    {n:'MovieBox · play-info (dash + cookie)',p:()=>ctx.mb&&'/moviebox/play-info?subjectId='+enc(ctx.mb.id)+'&season=0&episode=0',ok:d=>{const du=deepFind(d,'dash_url');if(!du)throw new Error('no dash_url');return String(du).slice(0,70)},soft:true},
    {n:'Direct MP4 · library',p:'/np/videos',ok:d=>npList(d).length+' videos',soft:true},
    {n:'Music · home rows',p:'/music/home',ok:d=>{const s=mSections(d);if(!s.length)throw new Error('no rows parsed');ctx.mus=s[0].items[0];return s.length+' rows'}},
    {n:'Music · search',p:'/music/search?q=arijit',ok:d=>{const l=mList(d);if(!l.length)throw new Error('no songs parsed');ctx.mus=l[0];return l.length+' songs'}},
    {n:'Music · trending',p:'/music/yt/trending?region=IN',ok:d=>mList(d).length+' videos',soft:true},
    {n:'Music · play (audio url)',p:()=>ctx.mus&&'/music/play/'+enc(ctx.mus.id),ok:d=>{const u=d.play_url||d.audio_url||d.url;if(!u)throw new Error('no audio url'+(d.video_id?' (YouTube fallback only)':''));ctx.mp=d;return String(u).slice(0,70)}},
    {n:'Music · synced lyrics',p:()=>ctx.mus&&'/music/lyrics?title='+enc(cleanTitle(ctx.mus.title))+'&artist='+enc(firstArtist(ctx.mus.artist)),ok:d=>{const l=buildLyrics(d,0);if(!l)throw new Error('no lyrics');return l.synced?l.lines.length+' synced lines':'plain text only'},soft:true},
    {n:'Anime · home',p:'/anime/home',ok:d=>{const k=Object.keys(d||{}).filter(x=>Array.isArray(d[x])&&d[x].length);if(!k.length)throw new Error('no rows');ctx.slug=((d.top_airing||d.most_popular||[])[0]||{}).slug;return k.length+' rows'}},
    {n:'Anime · catalog',p:'/anime/catalog?type=all',ok:d=>{const l=d.items||[];if(!l.length)throw new Error('empty');return l.length+' titles'}},
    {n:'Anime · search',p:'/anime/search?q=naruto',ok:d=>((d&&d.items)||[]).length+' results'},
    {n:'Anime · detail',p:()=>ctx.slug&&'/anime/detail/'+enc(ctx.slug),ok:d=>{const e=d.episodes||[];if(!e.length)throw new Error('no episodes');ctx.ep=e[0];return e.length+' episodes'}},
    {n:'Anime · stream resolve',p:()=>ctx.ep&&!ctx.ep.stream_url&&(ctx.ep.video_hash||ctx.ep.videoHash)&&'/anime/stream?hash='+enc(ctx.ep.video_hash||ctx.ep.videoHash),ok:d=>{if(!(d&&(d.stream_url||d.url)))throw new Error('no stream_url');return String(d.stream_url||d.url).slice(0,70)},skipMsg:'episode already carries its own stream URL'},
    {n:'4K Hub · search',p:'/fk/search?q=avatar',ok:d=>{const l=hubList(d);if(!l.length)throw new Error('no items');return l.length+' results'},soft:true},
    {n:'Downloader · site list',p:'/dl/sites',ok:d=>'reachable',soft:true}
  ];
  const libs=[
    {n:'Player library · hls.js',run:async()=>{await LIB.hls();return'v'+(window.Hls&&Hls.version||'ok')+(Hls.isSupported()?' · supported':' · not supported')}},
    {n:'Player library · dash.js',run:async()=>{await LIB.dash();return'loaded'}}
  ];
  const v=document.createElement('video');
  const caps=[['MP4 (H.264/AAC)',v.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"')],['WebM (VP9)',v.canPlayType('video/webm; codecs="vp9"')],['HLS native',v.canPlayType('application/vnd.apple.mpegurl')],['MediaSource (hls.js / dash.js)',window.MediaSource?'yes':'']];
  mount(`<div class="phead"><div><h1 class="h1">System status</h1><p>Live checks of every API this site uses, run from your browser right now.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="runall">${ic('pulse')}Run all tests</button></div></div>
    <div class="note" style="margin-bottom:18px"><b>API base:</b> <code id="bs">${esc(BASE||location.origin)}</code>
      <form class="field" id="bf" style="margin-top:10px;height:46px"><input name="q" placeholder="Custom API base URL (leave empty for default)" value="${esc(store.get('base',''))}"><button class="btn sm" type="submit">Save</button></form></div>
    <div class="grp" style="margin-top:0">This browser</div><div class="pills">${caps.map(([n,r])=>`<span class="pill${r?' on':''}">${esc(n)}: ${r?(r==='yes'?'yes':r):'no'}</span>`).join('')}</div>
    <div class="grp">API tests</div><div class="lrows" id="tl">${T.map((t,i)=>`<div class="tst" id="t${i}"><i class="dot"></i><div><b style="font-weight:600">${esc(t.n)}</b><small></small></div><code></code><button class="pill" hidden data-raw="${i}" style="height:28px;font-size:.75rem">JSON</button></div>`).join('')}
    ${libs.map((t,i)=>`<div class="tst" id="l${i}"><i class="dot"></i><div><b style="font-weight:600">${esc(t.n)}</b><small></small></div><code></code></div>`).join('')}</div>
    <div class="note" style="margin-top:18px" id="sum">Press “Run all tests”.</div>`);
  const setT=(el,st,msg,ms)=>{const d=$('.dot',el);d.className='dot '+st;$('small',el).textContent=msg||'';$('code',el).textContent=ms!=null?ms+' ms':''};
  const RAW={};
  $('#tl').addEventListener('click',e=>{const b=e.target.closest('[data-raw]');if(!b)return;const body=openModal();body.innerHTML='<pre style="position:absolute;inset:0;overflow:auto;padding:18px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfe8ff;white-space:pre-wrap;word-break:break-all"></pre>';let s='';try{s=JSON.stringify(RAW[b.dataset.raw],null,1)}catch(x){s=String(RAW[b.dataset.raw])}$('pre',body).textContent=s.slice(0,40000)});
  let running=false;
  async function runAll(){
    if(running)return;running=true;
    const btn=$('#runall');btn.disabled=true;
    let pass=0,fail=0,soft=0;
    for(let i=0;i<T.length;i++){
      if(tok!==RT)return;
      const t=T[i],el=$('#t'+i);if(!el)return;
      const path=typeof t.p==='function'?t.p():t.p;
      if(!path){setT(el,'run','skipped — needed data from an earlier test');soft++;continue}
      setT(el,'run','running…');const t0=performance.now();
      try{
        const d=await api(path,{timeout:60000,retries:0});
        RAW[i]=d;{const rb=$('[data-raw]',el);if(rb)rb.hidden=false}
        const msg=await t.ok(d);
        setT(el,'ok',msg,Math.round(performance.now()-t0));pass++;
      }catch(e){
        setT(el,t.soft?'run':'bad',(e.message||String(e)),Math.round(performance.now()-t0));
        if(t.soft){soft++;el.querySelector('.dot').className='dot';}else fail++;
      }
    }
    for(let i=0;i<libs.length;i++){
      const el=$('#l'+i);if(!el)return;setT(el,'run','loading…');const t0=performance.now();
      try{const m=await libs[i].run();setT(el,'ok',m,Math.round(performance.now()-t0));pass++}
      catch(e){setT(el,'bad',e.message,Math.round(performance.now()-t0));fail++}
    }
    running=false;btn.disabled=false;
    const s=$('#sum');if(s)s.innerHTML=fail?`<b>${fail} test${fail>1?'s':''} failed</b>, ${pass} passed${soft?`, ${soft} optional/skipped`:''}. If everything fails with “Cannot reach the API”, the server is blocking this website (CORS) — host this file on the same Vercel project, or set the API base above.`:`<b>All ${pass} required checks passed</b>${soft?` (${soft} optional checks skipped or unavailable)`:''}. You are good to go.`;
  }
  $('#runall').onclick=runAll;
  $('#bf').addEventListener('submit',e=>{
    e.preventDefault();const v=e.target.q.value.trim();
    if(v&&!/^https?:\/\//i.test(v)){toast('Enter a full URL starting with https://');return}
    if(v)store.set('base',v);else store.del('base');
    BASE=computeBase();_cache.clear();toast('API base saved');$('#bs').textContent=BASE||location.origin;
  });
}

/* ---------------- BOOT ---------------- */
(function boot(){
  wireGlobalUI();wireSearch();wireSheet();wirePages();wireMusicPages();buildMusicUI();
  addEventListener('hashchange',route);
  addEventListener('resize',()=>setNav((($('#links a.on')||{}).dataset||{}).k||''));
  addEventListener('unhandledrejection',e=>console.warn('Unhandled:',e.reason));
  route();
})();

</script>
</body>
</html>

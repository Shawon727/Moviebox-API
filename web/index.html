<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MovieAll — Movies, Series, Anime & Music</title>
<style>
:root{--bg:#0b0b12;--bg2:#12121c;--card:#181826;--card2:#1f1f30;--tx:#f2f2f7;--tx2:#9a9ab0;--acc:#a78bfa;--acc2:#7c5cff;--r:18px}
body[data-acc="movies"]{--acc:#f5b342;--acc2:#e08c1a}
body[data-acc="series"]{--acc:#5aa7ff;--acc2:#2f7de0}
body[data-acc="anime"]{--acc:#a78bfa;--acc2:#7c5cff}
body[data-acc="music"]{--acc:#ff4d8d;--acc2:#c22e6c}
body[data-acc="mb"]{--acc:#34e0c0;--acc2:#12a98d}
body[data-acc="hub"]{--acc:#4dd7ff;--acc2:#1a9fd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding-bottom:120px}
a{color:inherit;text-decoration:none}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(11,11,18,.86);backdrop-filter:blur(14px);border-bottom:1px solid #ffffff12}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo .ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:18px}
.sp{flex:1}
.ibtn{width:42px;height:42px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;font-size:18px}
main{padding:14px;max-width:1100px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:rgba(11,11,18,.92);backdrop-filter:blur(16px);border-top:1px solid #ffffff12;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:grid;justify-items:center;gap:2px;color:var(--tx2);font-size:11px;padding:6px 0}
nav button.on{color:var(--acc)}
nav .ni{font-size:20px}
h1{font-size:22px;margin:6px 0 12px}
h2.sec{font-size:17px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.card{min-width:132px;width:132px;scroll-snap-align:start}
.card .p{width:132px;height:190px;object-fit:cover;border-radius:14px;background:var(--card2)}
.card .t{font-size:12.5px;font-weight:600;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:11px;color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.grid .card{width:auto;min-width:0}
.grid .card .p{width:100%}
.badge{position:absolute;top:6px;left:6px;background:#0009;padding:2px 7px;border-radius:8px;font-size:10.5px;font-weight:700}
.pwrap{position:relative}
.pwrap .p{width:100%}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#0b0b12;font-weight:700;padding:12px 18px;border-radius:999px}
.btn.ghost{background:#ffffff14;color:var(--tx)}
.btn.sm{padding:8px 14px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--card2);border:1px solid #ffffff14;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chip.on{background:var(--acc);color:#0b0b12;border-color:transparent}
.panel{background:var(--card);border:1px solid #ffffff12;border-radius:var(--r);padding:14px;margin:12px 0}
.muted{color:var(--tx2);font-size:13px}
.tiny{font-size:11.5px;color:var(--tx2)}
input[type=text],select{width:100%;background:var(--card2);border:1px solid #ffffff1a;color:var(--tx);border-radius:12px;padding:12px;font:inherit}
.ep{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid transparent;border-radius:14px;padding:8px;margin:8px 0}
.ep.on{border-color:var(--acc)}
.ep img{width:110px;height:64px;object-fit:cover;border-radius:10px;background:#000}
.ep .t{font-weight:600;font-size:13.5px}
.ep .s{font-size:11.5px;color:var(--tx2)}
.vp{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.vp video,.vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vp .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px;background:linear-gradient(transparent,#000c);z-index:5}
.vp .ctl button{font-size:18px}
.vp .time{font-size:12px;color:#fffc;min-width:86px;text-align:center}
.vp input[type=range]{flex:1;accent-color:var(--acc)}
.vp .top{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;gap:8px;align-items:center;background:linear-gradient(#000c,transparent);z-index:5}
.vp .top .ti{font-weight:700;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vp .err{position:absolute;inset:0;display:grid;place-content:center;gap:10px;padding:18px;text-align:center;background:#000d;z-index:6}
.vp .spin{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.vp .spin i{width:52px;height:52px;border:4px solid #fff3;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.menu{position:absolute;right:8px;bottom:52px;background:#101018f2;border:1px solid #ffffff1a;border-radius:14px;padding:8px;z-index:8;max-height:60%;overflow:auto;min-width:190px;backdrop-filter:blur(10px)}
.menu h4{margin:6px 8px;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.menu button{display:flex;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:13.5px}
.menu button.on{color:var(--acc);font-weight:700}
.menu button:hover{background:#fff1}
.mrow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px}
.mrow:hover{background:#fff1}
.mrow img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--card2)}
.mrow .t{font-weight:600;font-size:14px}
.mrow .s{font-size:12px;color:var(--tx2)}
#mini{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:45;display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--acc2),var(--acc));border-radius:16px;padding:8px 10px;color:#0b0b12;box-shadow:0 8px 30px #0008}
#mini img{width:40px;height:40px;border-radius:9px;object-fit:cover}
#mini .t{font-weight:700;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#sheet.on{display:flex}
#sheet .bg{position:absolute;inset:0;filter:blur(60px) saturate(1.4);opacity:.5;background-size:cover;background-position:center}
#sheet .in{position:relative;flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
#sheet .cover{width:min(78vw,340px);aspect-ratio:1;margin:10px auto;border-radius:22px;object-fit:cover;box-shadow:0 20px 60px #000a}
#sheet .ttl{font-size:19px;font-weight:800;text-align:center}
#sheet .art{font-size:13px;color:var(--tx2);text-align:center}
#sheet .seek{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
#sheet .seek input{flex:1;accent-color:var(--acc)}
#sheet .main{display:flex;align-items:center;justify-content:space-around;margin:8px 0}
#sheet .main button{font-size:26px}
#sheet .main .play{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:28px;color:#0b0b12}
#sheet .tabs{display:flex;gap:8px;justify-content:center;margin:6px 0}
#sheet .pane{flex:1;overflow:auto;background:#0006;border-radius:16px;padding:12px;margin-top:8px}
.lyr{display:grid;gap:14px;padding:30px 6px}
.lyr div{color:var(--tx2);font-size:17px;font-weight:600;transition:.25s;cursor:pointer}
.lyr div.on{color:var(--tx);font-size:20px;text-shadow:0 0 24px var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:#1c1c2af2;border:1px solid #ffffff20;padding:11px 18px;border-radius:999px;z-index:99;font-size:13.5px;max-width:86vw}
.sheet2{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bg2);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.28s;max-height:78vh;overflow:auto;border-top:1px solid #ffffff1a}
.sheet2.on{transform:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid #ffffff0d;font-size:13.5px}
.stat{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #ffffff0d;font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#666}
.dot.ok{background:#3ddc84}
.dot.bad{background:#ff5470}
</style>
</head>
<body data-acc="anime">
<header>
  <div class="logo"><span class="ic">▶</span><span>MovieAll</span></div>
  <div class="sp"></div>
  <button class="ibtn" onclick="go('search')">🔍</button>
  <button class="ibtn" onclick="moreSheet()">☰</button>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="mini" style="display:none" onclick="openSheet(event)">
  <img id="mi-img" src="" alt="">
  <div class="t" id="mi-t">—</div>
  <button onclick="event.stopPropagation();M.toggle()" id="mi-p">▶</button>
  <button onclick="event.stopPropagation();M.next()">⏭</button>
</div>
<div id="sheet">
  <div class="bg" id="sh-bg"></div>
  <div class="in">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="ibtn" onclick="closeSheet()">▼</button>
      <div class="sp"></div><b>Now Playing</b><div class="sp"></div>
      <button class="ibtn" id="sh-fav" onclick="M.fav()">♡</button>
    </div>
    <img class="cover" id="sh-img" src="" alt="">
    <div class="ttl" id="sh-t">—</div>
    <div class="art" id="sh-a">—</div>
    <div class="seek">
      <span class="tiny" id="sh-c">0:00</span>
      <input type="range" id="sh-seek" min="0" max="1000" value="0">
      <span class="tiny" id="sh-d">0:00</span>
    </div>
    <div class="main">
      <button onclick="M.shuffle=!M.shuffle;toast('Shuffle '+(M.shuffle?'on':'off'));syncSheet()">🔀</button>
      <button onclick="M.prev()">⏮</button>
      <button class="play" id="sh-play" onclick="M.toggle()">▶</button>
      <button onclick="M.next()">⏭</button>
      <button id="sh-rep" onclick="M.rep=(M.rep+1)%3;syncSheet();toast(['Repeat off','Repeat all','Repeat one'][M.rep])">🔁</button>
    </div>
    <div style="display:flex;justify-content:center;gap:14px">
      <button class="chip sm" onclick="M.rate()">⚡ <span id="sh-rate">1x</span></button>
      <button class="chip sm" onclick="M.timer()">⏳ Timer</button>
      <button class="chip sm" onclick="M.dl()">⬇ Save</button>
    </div>
    <div class="tabs">
      <button class="chip on" id="tab-q" onclick="sheetTab('q')">Queue</button>
      <button class="chip" id="tab-l" onclick="sheetTab('l')">Lyrics</button>
      <button class="chip" id="tab-i" onclick="sheetTab('i')">Info</button>
    </div>
    <div class="pane" id="sh-pane"></div>
  </div>
</div>
<div class="sheet2" id="more">
  <div style="display:flex;align-items:center"><b>More</b><div class="sp"></div><button class="ibtn" onclick="hideMore()">✕</button></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:10px">
    <button class="panel" style="margin:0" onclick="go('mb')"><b>🎬 MovieBox</b><div class="muted">HD streams + subtitles</div></button>
    <button class="panel" style="margin:0" onclick="go('hub')"><b>💠 4K Hub</b><div class="muted">4K releases & downloads</div></button>
    <button class="panel" style="margin:0" onclick="go('dl')"><b>⬇ Downloader</b><div class="muted">1000+ sites</div></button>
    <button class="panel" style="margin:0" onclick="go('list')"><b>★ My list</b><div class="muted">Saved & history</div></button>
    <button class="panel" style="margin:0" onclick="go('status')"><b>🩺 Status</b><div class="muted">Live API tests</div></button>
    <a class="panel" style="margin:0" href="docs" target="_blank"><b>📘 Docs</b><div class="muted">API reference</div></a>
  </div>
</div>
<script>
/* ================= core ================= */
const API = (location.protocol === 'file:') ? 'https://movieallshawon.vercel.app' : '';
const $ = s => document.querySelector(s);
const V = document.getElementById('view');
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmt2(t) { t = Math.max(0, t | 0); return (t / 60 | 0) + ':' + String(t % 60).padStart(2, '0'); }
let toastT;
function toast(m) {
  let e = $('.toast'); if (e) e.remove();
  e = document.createElement('div'); e.className = 'toast'; e.textContent = m;
  document.body.appendChild(e);
  clearTimeout(toastT);
  toastT = setTimeout(() => e.remove(), 2600);
}
async function J(u, opt) {
  const r = await fetch(u.startsWith('http') ? u : API + u, opt);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}
function go(h) { location.hash = '#/' + h; }
function route() {
  const h = location.hash.slice(2) || '';
  const [p, q] = h.split('?');
  return { parts: p.split('/').filter(Boolean), q: new URLSearchParams(q || '') };
}

/* libs lazy */
let _hls, _dash;
function needHls() {
  return _hls || (_hls = new Promise((res, rej) => {
    if (window.Hls) return res(Hls);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
    s.onload = () => res(Hls); s.onerror = rej;
    document.head.appendChild(s);
  }));
}
function needDash() {
  return _dash || (_dash = new Promise((res, rej) => {
    if (window.dashjs) return res(dashjs);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js';
    s.onload = () => res(dashjs); s.onerror = rej;
    document.head.appendChild(s);
  }));
}

/* proxy helpers */
const segWrap = (u, h) => API + '/mb/proxy/segment?u=' + enc(u) + '&cookie=' + enc(h?.Cookie || '') + '&referer=' + enc(h?.Referer || '');
const mpdWrap = (u, h) => API + '/mb/proxy/mpd?u=' + enc(u) + '&cookie=' + enc(h?.Cookie || '') + '&referer=' + enc(h?.Referer || '');

/* ================= video player ================= */
function VP(host, opt = {}) {
  host.innerHTML = `<div class="vp">
    <video playsinline controls="false"></video>
    <iframe style="display:none" allowfullscreen allow="autoplay;fullscreen;picture-in-picture"></iframe>
    <div class="spin" style="display:none"><i></i></div>
    <div class="top">
      <button class="ibtn" style="width:34px;height:34px" onclick="history.back()">‹</button>
      <div class="ti"></div>
      ${opt.onNext ? '<button class="chip sm" id="vp-next">Next ⏭</button>' : ''}
    </div>
    <div class="err" style="display:none"></div>
    <div class="ctl">
      <button id="vp-play">▶</button>
      <input type="range" id="vp-seek" min="0" max="1000" value="0">
      <span class="time">0:00/0:00</span>
      <button id="vp-set">⚙</button>
      <button id="vp-pip">⊡</button>
      <button id="vp-fs">⛶</button>
    </div>
    <div class="menu" style="display:none"></div>
  </div><div class="chips" id="vp-src"></div>`;

  const vp = host.firstElementChild;
  const video = vp.querySelector('video');
  const iframe = vp.querySelector('iframe');
  const spin = vp.querySelector('.spin');
  const err = vp.querySelector('.err');
  const menu = vp.querySelector('.menu');
  const srcBar = host.querySelector('#vp-src');
  vp.querySelector('.ti').textContent = opt.title || '';

  const P = { i: -1, hls: null, dash: null, subs: [], seeking: false };
  if (opt.onNext) vp.querySelector('#vp-next').onclick = opt.onNext;

  function srcs() { return opt.sources || []; }
  function renderSrcs() {
    srcBar.innerHTML = '';
    srcs().forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === P.i ? ' on' : '');
      b.textContent = s.label || ('Server ' + (i + 1));
      b.onclick = () => P.load(i);
      srcBar.appendChild(b);
    });
  }

  P.load = function (i) {
    P.i = i;
    err.style.display = 'none';
    menu.style.display = 'none';
    renderSrcs();
    if (P.hls) { P.hls.destroy(); P.hls = null; }
    if (P.dash) { P.dash.reset(); P.dash = null; }
    const s = srcs()[i];
    if (!s) return showErr('No source');
    iframe.style.display = 'none';
    video.style.display = '';
    spin.style.display = 'grid';
    if (s.kind === 'embed') {
      video.style.display = 'none';
      iframe.style.display = '';
      iframe.src = s.url;
      spin.style.display = 'none';
      return;
    }
    video.removeAttribute('src');
    if (s.kind === 'hls') {
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = s.url;
        video.play().catch(() => { });
      } else {
        needHls().then(H => {
          if (P.i !== i) return;
          const h = P.hls = new H({ enableWorker: true, lowLatencyMode: false, backBufferLength: 60 });
          h.on(H.Events.MANIFEST_PARSED, () => { spin.style.display = 'none'; video.play().catch(() => { }); });
          h.on(H.Events.ERROR, (e, d) => { if (d.fatal) { h.destroy(); P.hls = null; tryNext('HLS: ' + (d.details || '')); } });
          h.loadSource(s.url);
          h.attachMedia(video);
        }).catch(() => tryNext('hls.js load failed'));
      }
    } else if (s.kind === 'dash') {
      needDash().then(D => {
        if (P.i !== i) return;
        const d = P.dash = D.MediaPlayer().create();
        d.getDebug().setLogLevel(2);
        d.initialize(video, null, true);
        d.on('error', () => tryNext('DASH error'));
        d.on('manifestLoaded', () => { spin.style.display = 'none'; });
        if (s.manifestText) {
          const b = URL.createObjectURL(new Blob([s.manifestText], { type: 'application/dash+xml' }));
          d.attachSource(b);
        } else {
          d.attachSource(s.url);
        }
      }).catch(() => tryNext('dash.js load failed'));
    } else {
      video.src = s.url;
      video.play().catch(() => { });
    }
  };

  function tryNext(msg) {
    spin.style.display = 'none';
    const n = P.i + 1;
    if (n < srcs().length) {
      toast((srcs()[P.i]?.label || '') + ' failed → ' + (srcs()[n]?.label || ''));
      P.load(n);
    } else {
      showErr(msg || 'Playback failed');
    }
  }
  function showErr(msg) {
    spin.style.display = 'none';
    const s = srcs()[P.i] || {};
    err.style.display = 'grid';
    err.innerHTML = `<b>⚠ Couldn't play</b><div class="muted">${esc(msg || '')}</div>
      <div class="chips" style="justify-content:center">
        <button class="btn sm" onclick="this.closest('.err').style.display='none';window.__vp.retry()">↻ Retry</button>
        ${s.raw ? `<button class="btn sm ghost" id="vp-vlc">Open in VLC</button><button class="btn sm ghost" id="vp-copy">Copy URL+Cookie</button>` : ''}
        ${P.i + 1 < srcs().length ? '<button class="btn sm ghost" id="vp-tryn">Next server</button>' : ''}
      </div>`;
    const v = err.querySelector('#vp-vlc'); if (v) v.onclick = () => { location.href = 'intent://' + s.raw.replace(/^https?:\/\//, '') + '#Intent;scheme=https;action=android.intent.action.VIEW;type=video/*;end'; };
    const c = err.querySelector('#vp-copy'); if (c) c.onclick = async () => { await navigator.clipboard.writeText(s.raw + '\nCookie: ' + (s.headers?.Cookie || '') + '\nReferer: ' + (s.headers?.Referer || '')); toast('Copied'); };
    const n = err.querySelector('#vp-tryn'); if (n) n.onclick = () => P.load(P.i + 1);
  }
  window.__vp = { retry: () => P.load(P.i) };

  const play = vp.querySelector('#vp-play');
  const seek = vp.querySelector('#vp-seek');
  const time = vp.querySelector('.time');
  play.onclick = () => video.paused ? video.play() : video.pause();
  video.addEventListener('play', () => play.textContent = '⏸');
  video.addEventListener('pause', () => play.textContent = '▶');
  video.addEventListener('waiting', () => spin.style.display = 'grid');
  video.addEventListener('playing', () => spin.style.display = 'none');
  video.addEventListener('error', () => {
    if (P.i < srcs().length - 1) tryNext('media error'); else showErr('media error');
  });
  video.addEventListener('timeupdate', () => {
    if (!P.seeking && video.duration) seek.value = video.currentTime / video.duration * 1000;
    time.textContent = fmt2(video.currentTime) + '/' + fmt2(video.duration || 0);
  });
  seek.addEventListener('input', () => { P.seeking = true; });
  seek.addEventListener('change', () => { video.currentTime = seek.value / 1000 * video.duration; P.seeking = false; });
  vp.querySelector('#vp-fs').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : vp.requestFullscreen());
  vp.querySelector('#vp-pip').onclick = () => video.requestPictureInPicture?.().catch(() => toast('PiP n/a'));
  vp.querySelector('#vp-set').onclick = e => { e.stopPropagation(); buildMenu(); };

  function buildMenu() {
    const groups = [];
    if (P.hls) {
      const lv = P.hls.levels;
      groups.push(['Quality', [{ n: 'Auto', f: () => P.hls.currentLevel = -1 }].concat(lv.map((l, i) => ({ n: (l.height || '?') + 'p', f: () => P.hls.currentLevel = i })))].map(x => x));
      const at = P.hls.audioTracks || [];
      if (at.length > 1) groups.push(['Audio', at.map((a, i) => ({ n: a.name || a.lang || ('Track ' + i), f: () => P.hls.audioTrack = i }))]);
    }
    if (P.dash) {
      try {
        const vb = P.dash.getBitrateInfoListFor('video') || [];
        if (vb.length) groups.push(['Quality', [{ n: 'Auto', f: () => { P.dash.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: true } } } }); } }].concat(vb.map((b, i) => ({ n: (b.bitrate / 1000 | 0) + 'kbps' + (b.height ? ' ' + b.height + 'p' : ''), f: () => { P.dash.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: false } } } }); P.dash.setQualityFor('video', i); } })))]);
        const at = P.dash.getTracksFor('audio') || [];
        if (at.length > 1) groups.push(['Audio', at.map((t, i) => ({ n: t.lang || t.id || ('Track ' + i), f: () => P.dash.setCurrentTrack(t) }))]);
      } catch (e) { }
    }
    groups.push(['Speed', [0.5, 0.75, 1, 1.25, 1.5, 2].map(r => ({ n: r + 'x', f: () => video.playbackRate = r }))]);
    if (P.subs.length) groups.push(['Subtitles', [{ n: 'Off', f: () => [...video.textTracks].forEach(t => t.mode = 'disabled') }].concat(P.subs.map(s => ({ n: s.lang || 'Sub', f: () => addSub(s) })))]);
    menu.innerHTML = '';
    groups.forEach(([name, items]) => {
      const h = document.createElement('h4'); h.textContent = name; menu.appendChild(h);
      items.forEach(it => {
        const b = document.createElement('button');
        b.textContent = it.n;
        b.onclick = () => { it.f(); menu.style.display = 'none'; };
        menu.appendChild(b);
      });
    });
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  }
  function addSub(s) {
    const t = video.addTextTrack('subtitles', s.lang, s.lang);
    t.mode = 'showing';
    fetch(s.url).then(r => r.text()).then(txt => {
      parseVTT(txt).forEach(c => t.addCue(new VTTCue(c.s, c.e, c.t)));
    }).catch(() => toast('Subtitle load failed'));
  }
  P.setSubs = l => { P.subs = l || []; };
  P.video = video;
  P.tryNext = tryNext;
  P.showErr = showErr;
  return P;
}
function parseVTT(txt) {
  const out = [];
  const blocks = txt.replace(/\r/g, '').split(/\n\n+/);
  for (const b of blocks) {
    const m = b.match(/([\d:.]+) --> ([\d:.]+)/);
    if (!m) continue;
    const t = b.split('\n').slice(2).join('\n').replace(/<[^>]+>/g, '');
    out.push({ s: ts(m[1]), e: ts(m[2]), t });
  }
  return out;
}
function ts(s) {
  const p = s.split(':'); let v = 0;
  p.forEach(x => v = v * 60 + parseFloat(x.replace(',', '.')));
  return v;
}

/* ================= cards / rows ================= */
function card(it, href) {
  const poster = it.poster || it.poster_url || it.thumb || it.image || '';
  return `<div class="card pwrap" onclick="location.hash='${href}'">
    <img class="p" loading="lazy" src="${esc(poster)}" alt="" onerror="this.style.opacity=.25">
    ${it.rating || it.score ? `<span class="badge">★ ${it.rating || it.score}</span>` : ''}
    <div class="t">${esc(it.title || it.name || 'Untitled')}</div>
    <div class="s">${esc(it.year || it.type || '')}</div>
  </div>`;
}
function row(title, items, map) {
  if (!items?.length) return '';
  return `<h2 class="sec">${esc(title)}</h2><div class="row">${items.map(it => card(it, map(it))).join('')}</div>`;
}
function hrefFor(it) {
  const p = (it.provider || '').toLowerCase();
  const id = it.id || it.subject_id || it.slug || it.item_id;
  if (p.includes('moviebox') || it.subject_id) return '#/mb/title/' + enc(id);
  if (p.includes('anime') || it.slug) return '#/anime/title/' + enc(it.slug || id);
  if (p.includes('4k') || p.includes('hub')) return '#/hub/title/' + enc(id);
  if (it.video_id || p.includes('youtube')) return '#/music';
  return '#/title/' + (it.type === 'tv' || it.media === 'tv' ? 'tv' : 'movie') + '/' + enc(it.tmdb_id || id);
}

async function mpdText(s) {
  try {
    const r = await fetch(mpdWrap(s.url || s.play_url, s.headers));
    const ct = r.headers.get('content-type') || '';
    const body = ct.includes('json') ? await r.json() : await r.text();
    return typeof body === 'string' ? body : (body.mpd || body.manifest || body.text || body.xml || body.data || null);
  } catch { return null; }
}
async function mbPlayer(zone, sid, se, ep, title) {
  zone.innerHTML = '<div class="muted">Fetching MovieBox stream…</div>';
  const d = await J(`/mb/stream/${sid}?se=${se}&ep=${ep}`);
  const sources = [];
  (d.mp4 || []).forEach(u => sources.push({ kind: 'direct', url: typeof u === 'string' ? segWrap(u) : segWrap(u.url, u.headers), label: 'MP4 ' + (u.resolution || '') }));
  for (const s of (d.sources || [])) {
    sources.push({ kind: 'dash', url: mpdWrap(s.url || s.play_url, s.headers), raw: s.url || s.play_url, headers: s.headers, label: (s.resolution || 'DASH') + ' · ' + (s.codec || ''), _src: s });
  }
  (d.browser || []).forEach(b => sources.push({ kind: 'embed', url: b.url || b.src, label: b.name || 'Browser' }));
  if (!sources.length) { zone.innerHTML = '<div class="panel">No MovieBox source.</div>'; return; }
  const vp = VP(zone, { title, sources });
  const first = sources.find(s => s.kind === 'dash');
  if (first) {
    const txt = await mpdText(first._src).catch(() => null);
    if (txt && txt.includes('<MPD')) first.manifestText = txt;
  }
  vp.load(0);
  if (d.sources?.[0]?.id) {
    J(`/mb/captions/${sid}?resource_id=${enc(d.sources[0].id)}&se=${se}&ep=${ep}`).then(c => {
      const list = (c.captions || c.items || (Array.isArray(c) ? c : [])).filter(x => x && (x.url || x.link));
      vp.setSubs(list.map(x => ({ lang: x.language || x.lang || 'sub', url: segWrap(x.url || x.link, d.sources[0].headers) })));
    }).catch(() => { });
  }
}

async function hubZone(zone, title, media, se, ep, tmdb, fixedId) {
  zone.innerHTML = '<div class="muted">Resolving 4K links…</div>';
  let id = fixedId;
  if (!id) {
    const s = await J('/fk/search?q=' + enc(title));
    const items = s.items || [];
    const best = items.find(x => (x.name || '').toLowerCase().includes(title.toLowerCase().slice(0, 12))) || items[0];
    if (!best) {
      zone.innerHTML = `<div class="muted">No 4K match. <button class="chip sm" onclick="hubHome();document.getElementById('hq').value='${esc(title)}';hubSearch('${esc(title)}')">Search manually</button></div>`;
      return;
    }
    id = best.id;
  }
  const d = await J(`/fk/stream?id=${enc(id)}&se=${se || 0}&ep=${ep || 0}&resolve=true`);
  const rel = d.releases || d.items || d.mirrors || (Array.isArray(d) ? d : []);
  let html = '<h2 class="sec">4K releases · mirrors · direct links</h2>';
  const playSrc = [];
  for (const m of rel) {
    const name = m.name || m.title || m.quality || 'Release';
    const links = [...(m.direct_links || m.directLinks || [])].map(l => typeof l === 'string' ? { url: l } : l);
    const mirrors = (m.mirrors || m.links || []).map(l => typeof l === 'string' ? { url: l } : l);
    html += `<div class="panel"><b>${esc(name)}</b> <span class="tiny">${esc(m.size || '')}</span><div class="chips">`;
    for (const l of links) {
      html += `<a class="chip" href="${esc(l.url)}" target="_blank">⬇ ${esc(l.host || l.name || 'Direct')}</a>`;
      if (/\.(mp4|mkv|webm|m4v)/i.test(l.url || '')) playSrc.push({ kind: 'direct', url: l.url, label: '4K ' + (l.host || 'direct') });
    }
    for (const m2 of mirrors) {
      const u = m2.url || m2.link || '';
      if (/hubcloud|hubdrive/i.test(u)) html += `<button class="chip" onclick="resolveOne(this,'${esc(u)}')">🔓 ${esc(m2.host || m2.name || 'Resolve')}</button>`;
      else html += `<a class="chip" href="${esc(u)}" target="_blank">🔗 ${esc(m2.host || m2.name || 'Mirror')}</a>`;
    }
    html += '</div></div>';
  }
  if (!rel.length) html += '<div class="muted">No mirrors returned.</div>';
  html += '<div id="hplay"></div>';
  zone.innerHTML = html;
  if (playSrc.length) {
    zone.insertAdjacentHTML('beforeend', '<div class="chips"><button class="btn sm" onclick="window.__hp()">▶ Play direct</button></div>');
    window.__hp = () => {
      const vp = VP(zone.querySelector('#hplay'), { title, sources: playSrc });
      vp.load(0);
    };
  }
  window.resolveOne = async (btn, u) => {
    btn.textContent = '⏳ …';
    try {
      const r = await J('/tools/resolve?url=' + enc(u));
      const ls = r.direct_links || r.links || r.urls || [];
      btn.outerHTML = ls.map(l => `<a class="chip" href="${esc(l.url || l)}" target="_blank">⬇ ${esc(l.host || 'Direct')}</a>`).join('') || '<span class="tiny">no links</span>';
    } catch (e) { btn.textContent = '✗ failed'; }
  };
}

    $('#ael').innerHTML = eps().map((e, i) => `<div class="ep" data-i="${i}" onclick="window.__aep(${i})"><img src="${esc(e.thumb || '')}" alt=""><div><div class="t">${esc(e.title)}</div><div class="s">S${e.season} E${e.episode}</div></div></div>`).join('');
  }
  $('#asel').onchange = drawEps; drawEps();
  window.__aep = async i => {
    document.querySelectorAll('.ep').forEach(x => x.classList.remove('on'));
    document.querySelector(`.ep[data-i="${i}"]`)?.classList.add('on');
    const e = eps()[i];
    const zone = $('#apz');
    zone.innerHTML = '<div class="muted">Resolving stream…</div>';
    const sources = [];
    if (e.video_hash) {
      const s = await J('/anime/stream?hash=' + enc(e.video_hash)).catch(() => null);
      if (s?.stream_url) sources.push({ kind: 'hls', url: API + '/anime/hls?u=' + enc(s.stream_url), label: 'HindiAnime HLS' });
      (s?.mirrors || []).forEach(m => sources.push({ kind: 'hls', url: API + '/anime/hls?u=' + enc(m.url || m), label: m.name || 'Mirror' }));
    }
    if (e.url) sources.push({ kind: 'hls', url: API + '/anime/stream?url=' + enc(e.url), label: 'Page fallback' });
    if (!sources.length) { zone.innerHTML = '<div class="muted">No stream for this episode.</div>'; return; }
    const vp = VP(zone, { title: d.title + ' — ' + e.title, sources, onNext: i + 1 < eps().length ? () => window.__aep(i + 1) : null });
    vp.load(0);
  };
  if (eps().length) window.__aep(0);
}

const M = { queue: [], qi: -1, shuffle: false, rep: 0, audio: new Audio(), cur: null, lyr: null, lyrOff: 0, tab: 'q', timer: null };
M.audio.preload = 'metadata';
function mSave() { LS.set('ma_q', { q: M.queue, i: M.qi, sh: M.shuffle, rp: M.rep }); }
function mLoad() { const s = LS.get('ma_q', null); if (s) { M.queue = s.q || []; M.qi = s.i ?? -1; M.shuffle = !!s.sh; M.rep = s.rp || 0; } }
mLoad();
function mItemUrl(it) {
  if (it.encrypted_media_url) return API + '/music/stream/' + enc(it.encrypted_media_url);
  if (it.stream_url) return it.stream_url;
  return null;

async function musicHome() {

  V.innerHTML = '<h1>Music</h1><div class="chips"><input type="text" placeholder="Search songs, artists…" onkeydown="if(event.key===\'Enter\')musSearch(this.value)"></div><div id="mz"><div class="muted">Loading…</div></div>';

    const d = await J('/music/home');

function mRowItem(it) {

window.__mp = it => M.playItem(it);
async function musSearch(q) {

M.playItem = function (it, addOnly) {
  const item = { ...it };
  item.uid = item.id || item.video_id || item.title;
  if (addOnly) { M.queue.push(item); mSave(); toast('Added to queue'); if ($('#sheet').classList.contains('on')) sheetTab(M.tab); return; }
  const idx = M.queue.findIndex(x => x.uid === item.uid);
  if (idx >= 0) M.qi = idx; else { M.queue.push(item); M.qi = M.queue.length - 1; }
  mSave(); M.start(); openSheetForce();
};
M.start = async function () {
  const it = M.queue[M.qi];
  if (!it) return;
  M.cur = it; M.lyr = null;
  const a = M.audio;
  let url = null;
  if (it.provider === 'youtube' || it.video_id) {
    try {
      const p = await J('/music/yt/play/' + enc(it.video_id || it.id));
      const f = [...(p.formats || p.urls || p.streams || [])].filter(x => x.url && /audio|mp4|webm|m4a/i.test((x.type || '') + (x.mimeType || '') + (x.url || ''))).sort((x, y) => (y.bitrate || 0) - (x.bitrate || 0));
      url = f[0]?.url || p.url || p.stream_url || null;
      it.duration = it.duration || p.lengthSeconds || p.duration;
    } catch (e) { toast('YouTube stream failed'); }
  } else {
    const id = it.id && it.id.startsWith('saavn:') ? it.id : (it.saavn_id ? 'saavn:' + it.saavn_id : null);
    if (id) {
      try {
        const p = await J('/music/play/' + enc(id));
        url = p.url || p.stream_url || (p.token ? API + '/music/stream/' + enc(p.token) : null) || (p.urls?.[0]?.url) || null;
        it.duration = it.duration || p.duration;
        it.thumb = it.thumb || p.image || p.thumb;
      } catch (e) { }
    }
    if (!url) url = mItemUrl(it);
  }
  if (!url) { toast('No stream URL'); return M.next(true); }
  a.src = url; a.playbackRate = curRate;
  a.play().catch(() => toast('Tap play to start'));
  LS.set('ma_hist', [it.title + ' — ' + (it.artist || '')].concat(LS.get('ma_hist', [])).slice(0, 40));
  syncSheet(); syncMini(); fetchLyrics(it);
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: it.title, artist: it.artist || '', artwork: [{ src: it.thumb || '', sizes: '500x500' }] });
  }
  mSave();
  if ($('#sheet').classList.contains('on')) sheetTab(M.tab);
};
M.toggle = () => M.audio.paused ? M.audio.play() : M.audio.pause();
M.next = function (auto) {
  if (M.shuffle && M.queue.length > 1) {
    let n; do { n = Math.random() * M.queue.length | 0; } while (n === M.qi); M.qi = n;
  } else if (M.qi + 1 < M.queue.length) M.qi++;
  else if (M.rep === 1) M.qi = 0;
  else if (!auto) M.qi = (M.qi + 1) % M.queue.length;
  else return;
  M.start();
};
M.prev = () => {
  if (M.audio.currentTime > 4) { M.audio.currentTime = 0; return; }
  M.qi = (M.qi - 1 + M.queue.length) % M.queue.length; M.start();
};
M.audio.addEventListener('ended', () => {
  if (M.rep === 2) { M.audio.currentTime = 0; M.audio.play(); } else M.next(true);
});
M.audio.addEventListener('timeupdate', () => { syncSeek(); lyricTick(); });
M.audio.addEventListener('play', () => { $('#mi-p').textContent = '⏸'; $('#sh-play').textContent = '⏸'; });
M.audio.addEventListener('pause', () => { $('#mi-p').textContent = '▶'; $('#sh-play').textContent = '▶'; });
let curRate = 1;
M.rate = () => {
  const r = [1, 1.25, 1.5, 0.75, 0.5];
  curRate = r[(r.indexOf(curRate) + 1) % r.length];
  M.audio.playbackRate = curRate;
  $('#sh-rate').textContent = curRate + 'x';
};
M.timer = () => {
  const m = prompt('Sleep timer (minutes):', '15');
  if (m) { clearTimeout(M.timer); M.timer = setTimeout(() => M.audio.pause(), m * 60000); toast('Timer set: ' + m + 'm'); }
};
M.dl = () => {
  const it = M.cur; if (!it) return;
  const u = mItemUrl(it) || M.audio.src;
  window.open(u, '_blank');
};
M.fav = () => {
  const f = LS.get('ma_fav', []);
  const it = M.cur; if (!it) return;
  const i = f.findIndex(x => x.uid === it.uid);
  if (i >= 0) f.splice(i, 1); else f.push(it);
  LS.set('ma_fav', f);
  syncSheet();
  toast(i >= 0 ? 'Removed from favorites' : '♥ Saved');
};
function syncMini() {
  const it = M.cur; if (!it) return;
  $('#mini').style.display = 'flex';
  $('#mi-img').src = it.thumb || '';
  $('#mi-t').textContent = it.title + ' · ' + (it.artist || '');

function syncSheet() {
  const it = M.cur; if (!it) return;
  $('#sh-img').src = it.thumb || '';

  $('#sh-t').textContent = it.title;

  $('#sh-fav').textContent = f.find(x => x.uid === it.uid) ? '♥' : '♡';
  $('#sh-rep').textContent = ['🔁', '', '🔂'][M.rep];
  $('#sh-rep').style.opacity = M.rep ? 1 : .5;
}
function syncSeek() {
  const a = M.audio; if (!a.duration) return;
  $('#sh-seek').value = a.currentTime / a.duration * 1000;
  $('#sh-c').textContent = fmt2(a.currentTime);
}
$('#sh-seek').addEventListener('input', e => {
  const a = M.audio; if (a.duration) a.currentTime = e.target.value / 1000 * a.duration;
});
if ('mediaSession' in navigator) {
  ['play', 'pause', 'previoustrack', 'nexttrack'].forEach(k => {
    try { navigator.mediaSession.setActionHandler(k, () => { k === 'play' ? M.audio.play() : k === 'pause' ? M.audio.pause() : k === 'previoustrack' ? M.prev() : M.next(); }); } catch (e) { }
  });
}

/* lyrics — client-side LRC parse (fixes server lines bug) */
function parseLRC(txt) {
  const out = [];
  const re = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  for (const raw of String(txt).split('\n')) {
    const tags = [...raw.matchAll(re)];
    const text = raw.replace(re, '').trim();
    if (tags.length) {
      for (const t of tags) {
        const sec = +t[1] * 60 + +t[2] + (t[3] ? +('0.' + t[3].slice(0, 3)) : 0);
        out.push({ t: sec, text });
      }
    } else if (text && out.length) out[out.length - 1].text += ' ' + text;
  }
  return out.filter(l => l.text).sort((a, b) => a.t - b.t);
}
async function fetchLyrics(it) {
  M.lyr = null;
  M.lyrOff = LS.get('lyr_off_' + it.uid, 0);
  try {
    const d = await J(`/music/lyrics?title=${enc(it.title)}&artist=${enc(it.artist || '')}&duration=${Math.round(it.duration || M.audio.duration || 0)}`);
    M.lyr = d && d.synced ? parseLRC(d.synced) : (d?.lyrics ? d.lyrics.split('\n').map(s => ({ t: null, text: s })) : null);
    if ($('#sheet').classList.contains('on') && M.tab === 'l') sheetTab('l');
  } catch (e) { M.lyr = null; }
}
function lyricTick() {
  if (!M.lyr || !M.lyr[0] || M.lyr[0].t === null) return;
  const t = M.audio.currentTime + M.lyrOff;
  let idx = -1;
  for (let i = 0; i < M.lyr.length; i++) { if (M.lyr[i].t <= t) idx = i; else break; }
  const box = $('#lyrbox'); if (!box) return;
  const kids = box.children;
  if (box.dataset.idx == idx) return;
  box.dataset.idx = idx;
  for (let i = 0; i < kids.length; i++) kids[i].classList.toggle('on', i === idx);
  if (idx >= 0 && kids[idx]) box.scrollTo({ top: kids[idx].offsetTop - box.clientHeight / 2 + kids[idx].clientHeight / 2, behavior: 'smooth' });
}
function sheetTab(t) {
  M.tab = t;
  ['q', 'l', 'i'].forEach(x => $('#tab-' + x).classList.toggle('on', x === t));
  const p = $('#sh-pane');
  if (t === 'q') {
    p.innerHTML = `<div class="chips">
      <button class="chip sm ghost" onclick="M.queue=[];mSave();sheetTab('q')">Clear</button>
      <button class="chip sm ghost" onclick="M.queue=LS.get('ma_fav',[]);mSave();M.qi=0;M.start()">Load ♥</button>
    </div>` + M.queue.map((x, i) => {
      const json = JSON.stringify(x).replace(/'/g, '&#39;');
      return `<div class="mrow" onclick="M.qi=${i};M.start()">
        <img src="${esc(x.thumb || '')}">
        <div style="flex:1"><div class="t">${i === M.qi ? '▶ ' : ''}${esc(x.title)}</div><div class="s">${esc(x.artist || '')}</div></div>
        <button class="ibtn" style="width:30px;height:30px" onclick="event.stopPropagation();M.queue.splice(${i},1);mSave();sheetTab('q')">✕</button>
      </div>`;
    }).join('');
  }
  if (t === 'l') {
    if (!M.lyr) p.innerHTML = '<div class="muted" style="text-align:center;padding:30px">No lyrics found</div>';
    else if (M.lyr[0]?.t === null) p.innerHTML = '<pre style="white-space:pre-wrap">' + M.lyr.map(l => esc(l.text)).join('\n') + '</pre>';
    else p.innerHTML = `<div class="chips" style="justify-content:center">
      <button class="chip sm" onclick="lyrOff(-0.5)">−0.5s</button>
      <span class="chip sm" id="lyroff">${M.lyrOff}s</span>
      <button class="chip sm" onclick="lyrOff(0.5)">+0.5s</button>
    </div><div class="lyr" id="lyrbox">${M.lyr.map(l => `<div onclick="M.audio.currentTime=${l.t}-M.lyrOff">${esc(l.text)}</div>`).join('')}</div>`;
  }
  if (t === 'i') {
    const it = M.cur || {};
    p.innerHTML = `<div class="kv"><span>Title</span><b>${esc(it.title)}</b></div>
      <div class="kv"><span>Artist</span><b>${esc(it.artist || '—')}</b></div>
      <div class="kv"><span>Provider</span><b>${esc(it.provider || it.source || '—')}</b></div>
      <div class="kv"><span>Duration</span><b>${fmt2(it.duration || 0)}</b></div>
      <div class="kv"><span>Source URL</span><a class="tiny" href="${esc(mItemUrl(it) || M.audio.src)}" target="_blank">open</a></div>`;
  }
}
function lyrOff(d) {
  M.lyrOff = +(M.lyrOff + d).toFixed(2);
  if (M.cur) LS.set('lyr_off_' + M.cur.uid, M.lyrOff);
  $('#lyroff').textContent = M.lyrOff + 's';
  lyricTick();
  const b = $('#lyrbox'); if (b) b.dataset.idx = -9;
}
function openSheetForce() { $('#sheet').classList.add('on'); syncSheet(); sheetTab(M.tab); }
function openSheet(e) { if (e && e.target.tagName === 'BUTTON') return; openSheetForce(); }
function closeSheet() { $('#sheet').classList.remove('on'); }

/* boot */
addEventListener('hashchange', render);
render();
if (M.queue[M.qi]) syncMini();

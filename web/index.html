<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a18">
<meta name="description" content="MovieAll — stream movies, series and anime with a fast, clean player.">
<title>MovieAll — Movies, Series & Anime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ffb62e'/%3E%3Cpath d='M26 18v28l22-14z' fill='%231c1300'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a18;--bg2:#12102a;--surf:#1a1737;--surf2:#262149;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#f4f0e8;--mute:#a7a4c0;--dim:#78758f;
  --accent:#ffb62e;--accent-ink:#1c1300;--accent-soft:rgba(255,182,46,.14);
  --hot:#ff4f6d;--ok:#3ddc97;--warn:#ffb62e;
  --nav:68px;--tab:64px;--r:16px;--ease:cubic-bezier(.2,.8,.2,1);
  --pad:clamp(16px,4vw,56px);
  --f-display:'Bricolage Grotesque','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
body[data-mode=anime]{--accent:#b892ff;--accent-ink:#150a2b;--accent-soft:rgba(184,146,255,.16)}
body[data-mode=mb]{--accent:#36e0c0;--accent-ink:#031a15;--accent-soft:rgba(54,224,192,.14)}
body[data-mode=hub]{--accent:#ff8a5c;--accent-ink:#240b02;--accent-soft:rgba(255,138,92,.15)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surf2);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--surf2) transparent}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* progress bar */
#bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--accent);z-index:100;box-shadow:0 0 12px var(--accent);transition:width .3s var(--ease),opacity .4s;opacity:0;pointer-events:none}
#bar.on{opacity:1}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:60;display:flex;align-items:center;gap:clamp(14px,3vw,36px);padding:0 var(--pad);border-bottom:1px solid transparent;background:linear-gradient(rgba(12,10,24,.9),rgba(12,10,24,0));transition:background .3s,border-color .3s,backdrop-filter .3s}
.nav.solid{background:rgba(12,10,24,.8);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-color:var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.03em;flex:none}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .4s var(--ease)}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.logo-mark .ic{width:16px;height:16px;fill:currentColor;stroke:none;margin-left:2px}
.links{position:relative;display:flex;gap:4px;margin-right:auto}
.links a{position:relative;padding:8px 14px;border-radius:999px;color:var(--mute);font-weight:500;font-size:.95rem;transition:color .2s}
.links a:hover,.links a.on{color:var(--text)}
.links .ind{position:absolute;bottom:2px;left:0;height:3px;width:20px;border-radius:3px;background:var(--accent);transform:translateX(0);transition:transform .45s var(--ease),width .45s var(--ease),opacity .3s;opacity:0}
.nav-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.links+.nav-r{margin-left:0}
.search-btn{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--mute);transition:background .2s,border-color .2s,color .2s}
.search-btn:hover{background:rgba(255,255,255,.14);color:var(--text);border-color:var(--line2)}
.search-btn kbd{font:600 .72rem var(--f-body);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--mute)}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);transition:background .2s,transform .2s var(--ease),border-color .2s;flex:none}
.ibtn:hover{background:rgba(255,255,255,.16);border-color:var(--line2)}
.ibtn:active{transform:scale(.92)}
.ibtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* mobile tabbar */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(14,12,30,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:60;justify-content:space-around}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:.68rem;font-weight:600;position:relative;transition:color .2s}
.tabbar .on{color:var(--accent)}
.tabbar .on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}

/* layout */
main{min-height:100vh}
.page{padding:calc(var(--nav) + 26px) var(--pad) 80px;max-width:1720px;margin:0 auto;animation:pgin .5s var(--ease) both}
.page.bleed{padding-left:0;padding-right:0;padding-top:0;max-width:none}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.03em;line-height:1.05}
.h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,2vw,1.5rem);letter-spacing:-.02em}
.sub{color:var(--mute)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.phead p{color:var(--mute);margin-top:6px;max-width:60ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:.98rem;background:var(--accent);color:var(--accent-ink);transition:transform .25s var(--ease),box-shadow .25s,background .2s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px var(--accent)}
.btn:active{transform:scale(.97)}
.btn .ic{width:20px;height:20px}
.btn.play .ic{fill:currentColor;stroke:none}
.btn.glass{background:rgba(255,255,255,.14);color:var(--text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2)}
.btn.glass:hover{background:rgba(255,255,255,.22);box-shadow:none}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.line:hover{background:rgba(255,255,255,.08);box-shadow:none}
.btn.sm{height:38px;padding:0 16px;font-size:.88rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--mute);font-weight:600;font-size:.88rem;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease)}
.pill:hover{color:var(--text);border-color:var(--line2)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill:active{transform:scale(.96)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:.74rem;font-weight:700;background:rgba(10,8,22,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text)}
.chip .ic{width:12px;height:12px;fill:var(--accent);stroke:none}

/* hero */
.hero{position:relative;height:min(88vh,860px);min-height:540px;overflow:hidden;background:var(--bg2)}
.hslide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.1s var(--ease),visibility 0s 1.1s}
.hslide.on{opacity:1;visibility:visible;transition:opacity 1.1s var(--ease),visibility 0s}
.hslide img{width:100%;height:100%;object-fit:cover;object-position:center 20%;transform:scale(1.02)}
.hslide.on img{animation:kb 16s ease-out forwards}
@keyframes kb{to{transform:scale(1.11) translate3d(-1.2%,-1%,0)}}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(12,10,24,.94) 0%,rgba(12,10,24,.6) 36%,rgba(12,10,24,0) 72%),linear-gradient(0deg,var(--bg) 0%,rgba(12,10,24,0) 42%)}
.hcontent{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:clamp(96px,15vh,160px);max-width:700px}
.hcontent>*{animation:hin .8s var(--ease) both}
.hcontent>*:nth-child(2){animation-delay:.08s}.hcontent>*:nth-child(3){animation-delay:.16s}.hcontent>*:nth-child(4){animation-delay:.24s}
@keyframes hin{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;color:var(--mute);font-weight:500;font-size:.95rem}
.hmeta .tag{padding:3px 10px;border-radius:7px;border:1px solid var(--line2);font-size:.78rem;font-weight:700;color:var(--text)}
.hmeta .rate{color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.hmeta .rate .ic{width:15px;height:15px;fill:currentColor;stroke:none}
.htitle{font-family:var(--f-display);font-weight:800;font-size:clamp(2.5rem,7.2vw,5.6rem);line-height:.94;letter-spacing:-.045em;margin-bottom:16px;text-wrap:balance;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.hdesc{color:#d8d5e6;font-size:clamp(.95rem,1.4vw,1.08rem);max-width:56ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:24px}
.hbtns{display:flex;flex-wrap:wrap;gap:12px}
.hstrip{position:absolute;z-index:3;right:var(--pad);bottom:clamp(30px,6vh,56px);display:flex;gap:12px}
.hth{position:relative;width:clamp(74px,7.4vw,112px);aspect-ratio:2/3;border-radius:12px;overflow:hidden;opacity:.55;transform:translateY(0) scale(.94);transition:opacity .35s,transform .45s var(--ease),box-shadow .35s;border:1px solid var(--line2);background:var(--surf)}
.hth img{width:100%;height:100%;object-fit:cover}
.hth:hover{opacity:.9}
.hth.on{opacity:1;transform:translateY(-10px) scale(1);box-shadow:0 18px 40px -10px rgba(0,0,0,.7)}
.hth i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent)}
.hth.on i{animation:hprog var(--dur,8s) linear forwards}
.hero.paused .hth.on i{animation-play-state:paused}
@keyframes hprog{to{width:100%}}
.hdots{display:none}

/* rows */
.sec{margin:34px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 var(--pad);margin-bottom:12px}
.sec-h a{color:var(--mute);font-size:.88rem;font-weight:600;transition:color .2s}
.sec-h a:hover{color:var(--accent)}
.page:not(.bleed) .sec-h{padding:0}
.rowwrap{position:relative}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px var(--pad) 22px;scroll-padding:0 var(--pad);scrollbar-width:none;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{display:none}
.row>.card{flex:0 0 clamp(128px,14vw,190px);scroll-snap-align:start}
.row.wide>.card{flex-basis:clamp(240px,26vw,340px)}
.rar{position:absolute;top:8px;bottom:22px;width:clamp(44px,4vw,64px);z-index:5;display:grid;place-items:center;color:var(--text);opacity:0;transition:opacity .25s;background:linear-gradient(90deg,rgba(12,10,24,.92),rgba(12,10,24,0))}
.rar.r{right:0;background:linear-gradient(270deg,rgba(12,10,24,.92),rgba(12,10,24,0))}
.rar.l{left:0}
.rar .ic{width:30px;height:30px;transition:transform .25s var(--ease)}
.rar:hover .ic{transform:scale(1.25)}
@media(hover:hover) and (pointer:fine){.rowwrap:hover .rar{opacity:1}}
.rar[hidden]{display:none}

/* cards */
.card{display:block;position:relative;min-width:0}
.card .poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--surf);box-shadow:0 8px 24px -8px rgba(0,0,0,.6);transition:box-shadow .35s,transform .4s var(--ease)}
.wide .card .poster,.card.land .poster{aspect-ratio:16/9}
.poster img{width:100%;height:100%;object-fit:cover;animation:fadein .6s ease both;transition:transform .7s var(--ease)}
.poster.noimg::before{content:attr(data-i);position:absolute;inset:0;display:grid;place-items:center;font:800 2.4rem var(--f-display);color:var(--dim)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.poster .chip.tl{position:absolute;left:8px;top:8px}
.poster .chip.tr{position:absolute;right:8px;top:8px;color:var(--accent-ink);background:var(--accent)}
.poster .pov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:12px;background:linear-gradient(0deg,rgba(8,6,20,.92) 0%,rgba(8,6,20,.2) 55%,transparent 100%);opacity:0;transition:opacity .3s}
.pov .pbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transform:translateY(12px) scale(.8);transition:transform .4s var(--ease)}
.pov .pbtn .ic{width:20px;height:20px;fill:currentColor;stroke:none;margin-left:2px}
.poster .pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.poster .pbar i{display:block;height:100%;background:var(--accent)}
.ctitle{margin-top:10px;font-weight:600;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{color:var(--dim);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(hover:hover) and (pointer:fine){
  .card{transition:transform .4s var(--ease);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
  .card:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px)}
  .card:hover .poster{box-shadow:0 24px 44px -12px rgba(0,0,0,.85),0 0 0 2px var(--accent)}
  .card:hover .poster img{transform:scale(1.08)}
  .card:hover .pov{opacity:1}
  .card:hover .pbtn{transform:none}
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(128px,14vw,190px),1fr));gap:26px 16px}
.grid.land{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sentinel{height:60px;display:grid;place-items:center;color:var(--dim);font-size:.9rem;margin-top:16px}

/* skeleton */
.sk{background:linear-gradient(100deg,var(--surf) 30%,var(--surf2) 50%,var(--surf) 70%);background-size:220% 100%;animation:sh 1.4s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-220% 0}}
.skcard{flex:0 0 clamp(128px,14vw,190px)}
.skcard .sk:first-child{aspect-ratio:2/3;border-radius:14px}
.skcard .sk:nth-child(2){height:14px;margin-top:12px;width:80%}
.skcard .sk:nth-child(3){height:10px;margin-top:8px;width:45%}

/* states */
.state{display:grid;place-items:center;text-align:center;gap:14px;padding:60px 20px;color:var(--mute)}
.state .ic{width:44px;height:44px;color:var(--dim)}
.state h3{font-family:var(--f-display);font-size:1.3rem;color:var(--text)}
.state p{max-width:52ch}
.state.err .ic{color:var(--hot)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* explore tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:0 var(--pad)}
.tile{position:relative;overflow:hidden;border-radius:20px;padding:20px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surf);border:1px solid var(--line);transition:transform .4s var(--ease),border-color .3s}
.tile:hover{transform:translateY(-4px);border-color:var(--t)}
.tile .ic{width:28px;height:28px;color:var(--t)}
.tile b{font-family:var(--f-display);font-size:1.2rem;letter-spacing:-.02em}
.tile small{display:block;color:var(--mute);font-size:.82rem;font-weight:400}
.tile::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--t);opacity:.14;transition:transform .5s var(--ease),opacity .3s}
.tile:hover::after{transform:scale(1.8);opacity:.2}

/* title/detail */
.dhero{position:relative;min-height:min(72vh,620px);display:flex;align-items:flex-end;overflow:hidden}
.dbg{position:absolute;inset:0}
.dbg img{width:100%;height:100%;object-fit:cover;object-position:center 22%;animation:fadein 1s both}
.dhero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,rgba(12,10,24,.55) 55%,rgba(12,10,24,.7) 100%),linear-gradient(90deg,rgba(12,10,24,.85),transparent 65%)}
.dwrap{position:relative;z-index:2;width:100%;padding:calc(var(--nav) + 40px) var(--pad) 36px;display:flex;gap:clamp(20px,4vw,48px);align-items:flex-end}
.dposter{flex:none;width:clamp(150px,20vw,280px);aspect-ratio:2/3;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -20px #000;border:1px solid var(--line2);background:var(--surf)}
.dposter img{width:100%;height:100%;object-fit:cover}
.dinfo{min-width:0;max-width:820px}
.dinfo .h1{margin-bottom:12px;text-wrap:balance}
.dmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--mute);margin-bottom:14px}
.dmeta .rate{color:var(--accent);font-weight:700;display:inline-flex;gap:5px;align-items:center}
.dmeta .rate .ic{width:15px;height:15px;fill:currentColor;stroke:none}
.dmeta .tag{padding:3px 10px;border-radius:7px;border:1px solid var(--line2);font-size:.78rem;font-weight:700;color:var(--text)}
.dover{color:#d5d2e4;max-width:70ch;margin-bottom:22px}
.dbtns{display:flex;flex-wrap:wrap;gap:12px}
.dbody{padding:10px var(--pad) 80px;max-width:1720px;margin:0 auto}
.seasons{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.seasons::-webkit-scrollbar{display:none}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.ep{display:flex;gap:12px;padding:10px;border-radius:16px;background:var(--surf);border:1px solid var(--line);transition:transform .3s var(--ease),border-color .2s,background .2s;text-align:left;align-items:center;min-width:0}
.ep:hover{transform:translateY(-3px);border-color:var(--accent)}
.ep.on{border-color:var(--accent);background:var(--accent-soft)}
.ep .th{position:relative;flex:none;width:118px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--surf2);display:grid;place-items:center;color:var(--dim);font:800 1.3rem var(--f-display)}
.ep .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ep b{display:block;font-size:.92rem;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep small{color:var(--dim);font-size:.78rem}
.epnum{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.epnum .pill{justify-content:center;padding:0}

/* watch */
.watch{padding-top:calc(var(--nav) + 18px)}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media(min-width:1180px){.wgrid.has-side{grid-template-columns:minmax(0,1fr) 380px}}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px var(--line);max-height:78vh;width:100%}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;color:var(--mute);background:#05040d;z-index:3;transition:opacity .4s}
.stage .ld.gone{opacity:0;pointer-events:none}
.stage .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;gap:10px;align-items:center;padding:8px 8px 8px 16px;border-radius:999px;background:rgba(12,10,24,.88);backdrop-filter:blur(12px);border:1px solid var(--line2);font-size:.86rem;animation:hin .5s var(--ease) both}
.wbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin:18px 0 6px}
.wbar .h2{min-width:0}
.wbar small{display:block;color:var(--mute);font-weight:400;font-family:var(--f-body);letter-spacing:0;font-size:.9rem;margin-top:2px}
.wact{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surf);border:1px solid var(--line);margin:14px 0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:38px;padding:0 18px;border-radius:999px;color:var(--mute);font-weight:600;font-size:.9rem;white-space:nowrap;transition:background .25s,color .25s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.panel{animation:pgin .35s var(--ease) both}
.srv{display:flex;flex-wrap:wrap;gap:10px}
.note{padding:14px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line);color:var(--mute);font-size:.9rem;line-height:1.5}
.note b{color:var(--text)}
.wside{min-width:0}
.wside .box{position:sticky;top:calc(var(--nav) + 14px);max-height:calc(100vh - var(--nav) - 34px);display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.wside .bh{padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wside select{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;max-width:60%}
.wside .bl{overflow-y:auto;padding:4px 10px 12px;display:grid;gap:8px}
.wside .ep{background:transparent;border-color:transparent;padding:8px}
.wside .ep:hover{background:var(--surf2);transform:none}
.wside .ep.on{background:var(--accent-soft);border-color:var(--accent)}
.wside .ep .th{width:104px}
@media(max-width:1179px){.wside .box{position:static;max-height:none}.wside .bl{max-height:520px}}

/* mirrors / list rows */
.lrows{display:grid;gap:10px}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--surf);border:1px solid var(--line);transition:border-color .2s,transform .3s var(--ease)}
.lrow:hover{border-color:var(--accent)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-weight:600;font-size:.94rem;overflow-wrap:anywhere}
.lrow .lt small{color:var(--dim);font-size:.8rem}
.lrow .la{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lrow .ico{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.grp{margin:22px 0 10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}

/* search overlay */
.ov{position:fixed;inset:0;z-index:90;background:rgba(8,6,20,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow-y:auto;animation:fadein .25s both}
.sbox{max-width:860px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 60px}
.sinput{display:flex;align-items:center;gap:12px;height:62px;padding:0 10px 0 22px;border-radius:999px;background:var(--surf);border:1px solid var(--line2);box-shadow:0 20px 60px -20px #000;transition:border-color .2s,box-shadow .2s}
.sinput:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 20px 60px -20px #000}
.sinput input{flex:1;font-size:1.15rem;min-width:0}
.sinput input::placeholder{color:var(--dim)}
.squick{display:flex;flex-wrap:wrap;gap:8px;margin:18px 4px}
.sres{margin-top:8px;display:grid;gap:6px}
.sitem{display:flex;gap:14px;align-items:center;padding:8px;border-radius:14px;transition:background .2s}
.sitem:hover,.sitem:focus-visible{background:var(--surf)}
.sitem .sp{flex:none;width:48px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surf2)}
.sitem .sp img{width:100%;height:100%;object-fit:cover}
.sitem b{display:block;font-weight:600}
.sitem small{color:var(--dim)}
.sitem .k{margin-left:auto;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--surf2);color:var(--mute)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:95;background:rgba(6,4,16,.6);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s both}
.sheet .sp{width:min(560px,100%);background:var(--bg2);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sup .4s var(--ease) both}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.sheet a{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;font-weight:600}
.sheet a:hover{background:var(--surf)}
.sheet a .ic{color:var(--accent)}
.sheet a small{display:block;color:var(--dim);font-weight:400}

/* toasts */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:120;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:12px 20px;border-radius:999px;background:rgba(30,26,60,.96);border:1px solid var(--line2);box-shadow:0 20px 50px -10px #000;font-weight:500;font-size:.92rem;animation:tin .45s var(--ease) both;text-align:center}
.toast.out{animation:tout .3s ease both}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}

/* forms */
.field{display:flex;gap:10px;align-items:center;height:54px;padding:0 8px 0 20px;border-radius:999px;background:var(--surf);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s;max-width:760px}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field input{flex:1;min-width:0}
.field input::placeholder{color:var(--dim)}
.alpha{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}

/* status */
.tst{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.dot.bad{background:var(--hot);box-shadow:0 0 12px var(--hot)}
.dot.run{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.tst code{font:500 .82rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere}
.tst small{display:block;color:var(--dim);font-size:.78rem;margin-top:2px;overflow-wrap:anywhere}

/* modal */
.modal{position:fixed;inset:0;z-index:98;background:rgba(6,4,16,.85);backdrop-filter:blur(16px);display:grid;place-items:center;padding:20px;animation:fadein .25s both}
.modal .mb{width:min(960px,100%);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;position:relative}
.modal iframe{width:100%;height:100%;border:0}
.modal .ibtn{position:absolute;right:14px;top:14px;z-index:2}

/* ===== VIDEO PLAYER ===== */
.vp{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;outline:0;touch-action:manipulation;font-family:var(--f-body)}
.vp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vp .poster-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5;filter:blur(2px);transition:opacity .5s}
.vp.started .poster-bg{opacity:0;pointer-events:none}
.vp video::cue{background:rgba(0,0,0,.72);color:#fff;font-family:var(--f-body);font-size:1.15em}
.vp .center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.vp .bigplay{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;pointer-events:auto;box-shadow:0 0 0 0 var(--accent);transition:transform .35s var(--ease),opacity .3s;animation:ring 2.4s infinite}
.vp .bigplay .ic{width:34px;height:34px;fill:currentColor;stroke:none;margin-left:4px}
.vp .bigplay:hover{transform:scale(1.1)}
.vp.playing .bigplay,.vp.busy .bigplay,.vp.failed .bigplay{opacity:0;pointer-events:none;animation:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%,100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
.vp .spinner{position:absolute;width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:var(--accent);animation:rot .8s linear infinite;opacity:0;transition:opacity .2s}
.vp.busy .spinner{opacity:1}
.vp .flash{position:absolute;top:50%;transform:translateY(-50%);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;z-index:4;backdrop-filter:blur(6px)}
.vp .flash.l{left:8%}.vp .flash.r{right:8%}
.vp .flash.show{animation:flash .6s ease}
@keyframes flash{0%{opacity:0;transform:translateY(-50%) scale(.6)}30%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-50%) scale(1.1)}}
.vp .ui{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .35s;pointer-events:none}
.vp.idle.playing .ui{opacity:0}
.vp.idle.playing{cursor:none}
.vp .ui>*{pointer-events:auto}
.vp .top{display:flex;align-items:center;gap:12px;padding:14px 16px 40px;background:linear-gradient(rgba(0,0,0,.75),transparent)}
.vp .top .t{font-weight:700;font-size:1rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display)}
.vp .top .t small{display:block;font-weight:400;color:#cfcbe0;font-size:.78rem;font-family:var(--f-body)}
.vp .bottom{padding:44px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.vp .seek{position:relative;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.vp .seek .trk{position:relative;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.22);transition:height .15s}
.vp .seek:hover .trk,.vp .seek.drag .trk{height:7px}
.vp .seek .buf,.vp .seek .prg{position:absolute;left:0;top:0;bottom:0;border-radius:4px;width:0}
.vp .seek .buf{background:rgba(255,255,255,.35)}
.vp .seek .prg{background:var(--accent)}
.vp .seek .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);left:0;transform:scale(0);transition:transform .15s}
.vp .seek:hover .knob,.vp .seek.drag .knob{transform:scale(1)}
.vp .seek .tip{position:absolute;bottom:22px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.85);font-size:.76rem;font-weight:600;transform:translateX(-50%);opacity:0;pointer-events:none}
.vp .seek:hover .tip{opacity:1}
.vp .ctl{display:flex;align-items:center;gap:2px;margin-top:2px}
.vp .cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:background .2s,transform .2s var(--ease)}
.vp .cb:hover{background:rgba(255,255,255,.16)}
.vp .cb:active{transform:scale(.9)}
.vp .cb .ic{width:22px;height:22px}
.vp .cb.pp .ic,.vp .cb.nx .ic,.vp .cb.pv .ic{fill:currentColor;stroke:none}
.vp .time{font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums;margin:0 10px;color:#e6e3f2;white-space:nowrap}
.vp .sp{flex:1}
.vp .vol{display:flex;align-items:center}
.vp .vol input{width:0;opacity:0;transition:width .3s var(--ease),opacity .3s;accent-color:var(--accent);height:4px}
.vp .vol:hover input,.vp .vol:focus-within input{width:82px;opacity:1;margin-right:8px}
.vp .cb.txt{width:auto;min-width:42px;padding:0 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.vp .menu{position:absolute;right:14px;bottom:82px;z-index:8;min-width:210px;max-width:min(320px,88%);max-height:64%;overflow-y:auto;padding:8px;border-radius:16px;background:rgba(18,15,40,.96);backdrop-filter:blur(20px);border:1px solid var(--line2);box-shadow:0 30px 60px -10px #000;animation:pgin .25s var(--ease) both}
.vp .menu h4{padding:8px 12px 6px;font-size:.74rem;color:var(--dim);font-weight:700}
.vp .menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 12px;border-radius:10px;text-align:left;font-size:.9rem;font-weight:500}
.vp .menu button:hover{background:rgba(255,255,255,.1)}
.vp .menu button.on{color:var(--accent);font-weight:700}
.vp .menu button .ic{width:16px;height:16px;color:var(--accent)}
.vp .err{position:absolute;inset:0;z-index:7;display:grid;place-items:center;align-content:center;gap:12px;text-align:center;padding:20px;background:rgba(5,4,13,.94)}
.vp .err h3{font-family:var(--f-display);font-size:1.25rem}
.vp .err p{color:var(--mute);max-width:52ch;font-size:.9rem}
.vp .err .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.vp .msg{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:6;padding:8px 16px;border-radius:999px;background:rgba(18,15,40,.92);border:1px solid var(--line2);font-size:.84rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%;text-align:center}
.vp .msg.show{opacity:1}
.vp .upnext{position:absolute;right:16px;bottom:96px;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:999px;background:rgba(18,15,40,.94);border:1px solid var(--line2);font-size:.86rem;font-weight:600;animation:hin .4s var(--ease) both}

/* footer */
.foot{padding:40px var(--pad) calc(50px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--dim);font-size:.85rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

/* responsive */
@media(max-width:900px){
  .links{display:none}
  .nav{gap:10px}
  .nav-r{margin-left:auto}
  .search-btn span,.search-btn kbd{display:none}
  .search-btn{width:42px;padding:0;justify-content:center}
  .nav-r .hide-m{display:none}
  .tabbar{display:flex}
  body{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px))}
  .hero{height:78vh;min-height:500px}
  .hstrip{display:none}
  .hdots{display:flex;gap:6px;position:absolute;z-index:3;left:var(--pad);bottom:22px}
  .hdots i{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.35);transition:width .4s var(--ease),background .3s}
  .hdots i.on{width:26px;background:var(--accent)}
  .hcontent{bottom:52px}
  .hdesc{-webkit-line-clamp:2}
  .dwrap{flex-direction:column;align-items:flex-start;padding-top:calc(var(--nav) + 20px)}
  .dposter{width:132px}
  .dhero{min-height:0}
  .stage{border-radius:14px;max-height:none}
  .row{gap:10px}
  .foot{padding-bottom:calc(var(--tab) + 50px)}
  #toasts{bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom,0px))}
  .lrow{flex-wrap:wrap}
  .lrow .la{justify-content:flex-start;width:100%}
  .vp .vol{display:none}
  .vp .cb{width:38px;height:38px}
  .vp .menu{bottom:74px;right:8px}
}
@media(max-width:520px){
  .grid{gap:20px 12px}
  .vp .time{margin:0 4px;font-size:.76rem}
  .vp .top{padding:10px 12px 34px}
  .btn{height:46px;padding:0 20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .hslide.on img{animation:none}
}

/* anime / moviebox feature card */
.afeat{position:relative;border-radius:28px;overflow:hidden;min-height:clamp(300px,42vw,420px);display:flex;align-items:flex-end;background:var(--surf);border:1px solid var(--line);margin-bottom:8px}
.afeat .bgi{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(34px) saturate(1.3);opacity:.55}
.afeat::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,10,24,.88),rgba(12,10,24,.2) 70%),linear-gradient(0deg,rgba(12,10,24,.7),transparent 50%)}
.afeat .in{position:relative;z-index:2;display:flex;gap:clamp(18px,3vw,36px);padding:clamp(18px,3vw,36px);align-items:flex-end;width:100%}
.afeat .ap{flex:none;width:clamp(120px,15vw,200px);aspect-ratio:2/3;border-radius:16px;overflow:hidden;box-shadow:0 24px 50px -16px #000;border:1px solid var(--line2);background:var(--surf2)}
.afeat .ap img{width:100%;height:100%;object-fit:cover}
.afeat .tx{min-width:0;max-width:760px}
@media(max-width:600px){.afeat .in{flex-direction:column;align-items:flex-start}.afeat .ap{width:110px}}

/* gradient padding areas must not swallow taps meant for the video */
.vp .ui>.top,.vp .ui>.bottom{pointer-events:none}
.vp .top>*,.vp .bottom .seek,.vp .bottom .ctl{pointer-events:auto}
.vp .top .t{pointer-events:none}

/* review fixes */
.page:not(.bleed) .rowwrap{margin:0 calc(var(--pad) * -1)}
.afeat .tx .h1{margin-bottom:14px}
.afeat .tx .dmeta{margin-bottom:10px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.vp.failed .bottom{display:none}
@media(max-width:900px){.nav .nav-r{margin-left:auto}}
@media(max-width:520px){
  .hbtns{gap:8px}
  .hbtns .btn{padding:0 16px}
  .tile{padding:16px;min-height:104px}
}

.tst{grid-template-columns:auto 1fr auto auto}

/* player: status, quick buttons, error panel fixes */
.vp .status{position:absolute;top:calc(50% + 48px);left:50%;transform:translateX(-50%);font-size:.8rem;color:#d8d5e6;text-align:center;max-width:86%;opacity:0;transition:opacity .2s;pointer-events:none}
.vp.busy .status{opacity:1}
.vp .cb.txt{gap:6px;font-size:.78rem;white-space:nowrap;max-width:150px}
.vp .cb.txt span{overflow:hidden;text-overflow:ellipsis;max-width:80px}
.vp .cb .ic{flex:none}
.vp .err{overflow-y:auto;padding:18px 14px;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:center;text-align:center}
.vp .err>*{max-width:100%;min-width:0}
.vp .err p{overflow-wrap:anywhere;word-break:break-word}
.vp .err .acts{max-width:100%}
.vp .err .alog{width:100%;max-width:640px;max-height:110px;overflow:auto;text-align:left;font:11px/1.45 ui-monospace,Menlo,monospace;color:#a7a4c0;background:rgba(255,255,255,.05);border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:520px){.vp .cb.txt{font-size:.72rem;padding:0 6px;min-width:34px}.vp .cb.txt span{max-width:54px}}
/* ===== MUSIC ===== */
body[data-mode=music]{--accent:#ff5c8a;--accent-ink:#2a0410;--accent-soft:rgba(255,92,138,.16)}
.mini,.np,.asheet,.ptxt{--accent:#ff5c8a;--accent-ink:#2a0410;--accent-soft:rgba(255,92,138,.16)}
.mini-eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.mini-eq i{width:3px;background:var(--accent);border-radius:2px;height:30%;animation:eq 1s ease-in-out infinite}
.mini-eq i:nth-child(2){animation-delay:.2s}.mini-eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* mini player */
.mini{position:fixed;left:12px;right:12px;bottom:14px;max-width:940px;margin:0 auto;height:68px;border-radius:22px;background:rgba(30,23,58,.9);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line2);box-shadow:0 24px 60px -16px #000;z-index:70;display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;animation:sup .5s var(--ease) both}
.mini[hidden]{display:none!important}
body.watching .mini{display:none!important}
.mini-prog{position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:rgba(255,255,255,.1);overflow:hidden}
.mini-prog i{display:block;height:100%;width:0;background:var(--accent)}
.mini-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;height:100%}
.mini-art{width:48px;height:48px;border-radius:13px;overflow:hidden;background:var(--surf2);flex:none;box-shadow:0 8px 20px -6px #000}
.mini-art img{width:100%;height:100%;object-fit:cover}
.mini-txt{display:grid;min-width:0;gap:1px}
.mini-txt b{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-txt small{color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ctl{display:flex;align-items:center;gap:4px;flex:none}
.mini .ibtn{background:none;border:0;width:42px;height:42px}
.mini .ibtn:hover{background:rgba(255,255,255,.1)}
.mini .mplay{background:var(--text);color:#15101f;width:46px;height:46px}
.mini .mplay .ic{fill:currentColor;stroke:none}
.mini .mb-like.on{color:var(--accent)}
body.has-music .page{padding-bottom:150px}
@media(max-width:900px){
  .mini{bottom:calc(var(--tab) + 8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;height:64px}
  .mini .mb-prev,.mini .mb-q{display:none}
  body.has-music .foot{padding-bottom:calc(var(--tab) + 130px)}
  body.has-music #toasts{bottom:calc(var(--tab) + 92px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:420px){.mini .mb-like{display:none}}

/* Now Playing */
.np{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;background:#0a0814;color:#fff;transform:translateY(100%);transition:transform .5s var(--ease);overflow:hidden}
.np[hidden]{display:none!important}
.np.in{transform:none}
.np-bg{position:absolute;inset:0;overflow:hidden}
.np-bg img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(64px) saturate(1.6) brightness(.62);transition:opacity .6s}
.np-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,20,.35),rgba(8,6,20,.78) 70%,rgba(8,6,20,.92))}
.np>*:not(.np-bg):not(.np-shade){position:relative;z-index:2}
.np-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 6px}
.np-top .ibtn{background:rgba(255,255,255,.1)}
.np-tabs{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px)}
.np-tabs button{height:36px;padding:0 16px;border-radius:999px;font-weight:700;font-size:.86rem;color:#cfcbe0;transition:background .25s,color .25s}
.np-tabs button.on{background:#fff;color:#15101f}
.np-body{flex:1;min-height:0;display:block;padding:8px 20px 0;width:100%}
.np-main{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;min-height:0}
.np-art{position:relative;width:min(78vw,44vh,420px);aspect-ratio:1;border-radius:26px;overflow:hidden;background:var(--surf2);box-shadow:0 44px 90px -24px rgba(0,0,0,.9);transform:scale(.88);transition:transform .7s var(--ease),width .4s var(--ease),aspect-ratio .3s}
.np.playing .np-art{transform:none}
.np-art>img{width:100%;height:100%;object-fit:cover}
.np-art .np-yt{position:absolute;inset:0;background:#000}
.np-art .np-yt iframe{width:100%;height:100%;border:0}
.np.yt .np-art{aspect-ratio:16/9;width:min(92vw,560px);transform:none}
.np-eq{position:absolute;right:12px;bottom:12px;display:none;gap:3px;align-items:flex-end;height:22px;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.np.playing:not(.yt) .np-eq{display:inline-flex}
.np-eq i{width:3px;border-radius:2px;background:#fff;height:30%;animation:eq 1s ease-in-out infinite}
.np-eq i:nth-child(2){animation-delay:.15s}.np-eq i:nth-child(3){animation-delay:.35s}.np-eq i:nth-child(4){animation-delay:.5s}
.np-info{display:flex;align-items:center;gap:14px;width:min(90vw,440px)}
.np-t{flex:1;min-width:0;display:grid;gap:4px}
.np-t b{font:800 clamp(1.4rem,5vw,1.9rem)/1.15 var(--f-display);letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-t a{color:#cfcbe0;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-t a:hover{color:#fff;text-decoration:underline}
.np-like.on,.np .ibtn.on{color:var(--accent)}
.np-like{background:rgba(255,255,255,.1)}
.np-right{height:100%;min-height:0;display:none}
.np[data-tab=lyrics] .np-main,.np[data-tab=queue] .np-main{display:none}
.np[data-tab=lyrics] .np-right,.np[data-tab=queue] .np-right{display:block}
.np[data-tab=queue] .np-lyrics,.np:not([data-tab=queue]) .np-queue{display:none}
.np-lyrics{position:relative;height:100%;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:4px 2px}
.ltag{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.12);color:#e0dcf0}
.ltag:empty{display:none}
.ltag.ok{background:var(--accent);color:var(--accent-ink)}
.loff{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:2px}
.loff button{min-width:34px;height:30px;border-radius:999px;font-weight:700;color:#fff;font-size:.9rem}
.loff button:hover{background:rgba(255,255,255,.15)}
.loff span{font-size:.78rem;font-weight:700;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.loff .lreset{font-size:.72rem;color:#cfcbe0;padding:0 10px}
.lbox{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 9%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 9%,#000 90%,transparent);padding:0 2px}
.lbox::-webkit-scrollbar{display:none}
.lpad{height:34vh}
.ll{margin:0;padding:9px 0;font:800 clamp(1.55rem,5.6vw,2.35rem)/1.2 var(--f-display);letter-spacing:-.02em;color:rgba(255,255,255,.3);cursor:pointer;transition:color .35s,transform .5s var(--ease),filter .4s;transform-origin:left center;filter:blur(.7px);overflow-wrap:anywhere}
.ll .lw{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ll.past{color:rgba(255,255,255,.4)}
.ll.next{color:rgba(255,255,255,.52);filter:none}
.ll:hover{color:rgba(255,255,255,.85);filter:none}
.ll.on{color:#fff;filter:none;transform:scale(1.035)}
.ll.on .lw{background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.5) var(--p,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.lnote{font-style:normal;opacity:.6}
.lplain{padding:8px 4px 60px;font-size:1.2rem;line-height:1.75;color:#e6e3f2;overflow-y:auto}
.lmsg{display:grid;place-items:center;align-content:center;gap:14px;height:100%;min-height:200px;color:#cfcbe0;text-align:center;padding:20px}
.lsync{position:absolute;right:6px;bottom:10px;display:inline-flex;gap:6px;align-items:center;height:38px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem;box-shadow:0 10px 30px -8px var(--accent);z-index:3}
.lsync .ic{width:16px;height:16px}
.np-queue{height:100%;overflow-y:auto;scrollbar-width:none;padding-bottom:10px}
.np-queue::-webkit-scrollbar{display:none}
.qh{display:flex;align-items:center;gap:10px;padding:14px 4px 8px;color:#cfcbe0;font-size:.85rem}
.qh .qauto{margin-left:auto;display:inline-flex;gap:6px;align-items:center;font-size:.8rem}
.qh .qauto input{accent-color:var(--accent)}
.qrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;cursor:pointer;transition:background .2s}
.qrow:hover{background:rgba(255,255,255,.08)}
.qrow.on{background:rgba(255,255,255,.12)}
.qart{width:46px;height:46px;border-radius:10px;overflow:hidden;background:var(--surf2);flex:none}
.qart img{width:100%;height:100%;object-fit:cover}
.qt{flex:1;min-width:0;display:grid}
.qt b{font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt small{color:#aaa6c0;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .ibtn{background:none;border:0}
.np-ctl{width:100%;max-width:720px;margin:0 auto;padding:6px 22px calc(16px + env(safe-area-inset-bottom,0px))}
.np-seek{height:24px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.np-seek .trk{position:relative;width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,.22);transition:height .15s}
.np-seek:hover .trk,.np-seek.drag .trk{height:8px}
.np-seek .prg{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:#fff}
.np-seek .knob{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .15s}
.np-seek:hover .knob,.np-seek.drag .knob{transform:scale(1)}
.np-times{display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:#cfcbe0;font-variant-numeric:tabular-nums;margin-top:2px}
.np-btns{display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px}
.np-play{width:74px;height:74px;border-radius:50%;background:#fff;color:#15101f;display:grid;place-items:center;transition:transform .25s var(--ease)}
.np-play:active{transform:scale(.93)}
.np-play .ic{width:32px;height:32px;fill:currentColor;stroke:none}
.np-spin{width:30px;height:30px;border-radius:50%;border:4px solid rgba(0,0,0,.15);border-top-color:#15101f;animation:rot .8s linear infinite}
.np .ibtn.ghost{background:none;border:0;position:relative;width:46px;height:46px;color:#e6e3f2}
.np .ibtn.ghost:hover{background:rgba(255,255,255,.1)}
.np .ibtn.ghost.big .ic{width:28px;height:28px;fill:currentColor;stroke:none}
.np .ibtn.ghost.on{color:var(--accent)}
.np-sec{display:flex;align-items:center;justify-content:space-between}
.np-sec em{position:absolute;right:2px;top:2px;font-style:normal;font-size:.62rem;font-weight:800;color:var(--accent)}
.npvol{display:none;align-items:center;gap:8px;color:#cfcbe0}
.npvol input{width:96px;accent-color:var(--accent)}
@media(min-width:1000px){
  .np-body{display:grid;grid-template-columns:minmax(360px,.85fr) minmax(0,1.15fr);gap:56px;max-width:1240px;margin:0 auto;padding:12px 32px 0}
  .np[data-tab] .np-main{display:flex}
  .np[data-tab] .np-right{display:block}
  .np-tabs [data-tab=art]{display:none}
  .np-art{width:min(100%,46vh,440px)}
  .npvol{display:inline-flex}
  .np-ctl{max-width:900px}
  .lpad{height:30vh}
}
@media(max-height:640px){.np-art{width:min(60vw,36vh)}.np-main{gap:14px}}

/* music pages */
.mhero .mh-in{padding:clamp(20px,4vw,40px);border-radius:28px;background:radial-gradient(circle at 92% 0%,var(--accent-soft),transparent 55%),var(--surf);border:1px solid var(--line)}
.mhero .h1{margin:6px 0 20px;max-width:16ch;text-wrap:balance}
.mchips{display:flex;gap:10px;overflow-x:auto;padding:18px 0 6px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;padding:10px 20px;border-radius:999px;background:hsl(var(--h) 50% 20%);border:1px solid hsl(var(--h) 60% 42% / .55);font-weight:600;font-size:.9rem;transition:transform .25s var(--ease),background .2s}
.mchip:hover{transform:translateY(-3px);background:hsl(var(--h) 55% 28%)}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.mtile{display:grid;gap:4px;padding:16px;border-radius:18px;background:var(--surf);border:1px solid var(--line);transition:transform .35s var(--ease),border-color .25s}
.mtile:hover{transform:translateY(-4px);border-color:var(--t)}
.mtile .ic{color:var(--t);width:26px;height:26px;margin-bottom:6px}
.mtile b{font-family:var(--f-display);font-size:1.02rem}
.mtile small{color:var(--dim)}
.mrh{margin:26px 0 -6px}
.page:not(.bleed) .mrow .sec-h{padding:0}
.row.mr{gap:16px}
.mcard{flex:0 0 clamp(140px,15vw,190px);text-align:left;display:block;min-width:0;scroll-snap-align:start;transition:transform .4s var(--ease)}
.mcard:hover{transform:translateY(-6px)}
.mart{position:relative;display:block;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--surf);box-shadow:0 12px 28px -10px rgba(0,0,0,.7)}
.mart img{width:100%;height:100%;object-fit:cover;animation:fadein .6s both;transition:transform .7s var(--ease)}
.mcard:hover .mart img{transform:scale(1.08)}
.mart.noimg::before{content:attr(data-i);position:absolute;inset:0;display:grid;place-items:center;font:800 2rem var(--f-display);color:var(--dim)}
.mart .rank{position:absolute;left:8px;bottom:-4px;font:800 3.8rem/1 var(--f-display);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.9);text-shadow:0 6px 24px rgba(0,0,0,.7);letter-spacing:-.05em;pointer-events:none}
.mart .pbtn{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .35s var(--ease);box-shadow:0 10px 24px -6px #000}
.mart .pbtn .ic{width:18px;height:18px;fill:currentColor;stroke:none;margin-left:2px}
.mcard:hover .pbtn{opacity:1;transform:none}
@media(hover:none){.mart .pbtn{opacity:1;transform:none;width:38px;height:38px}}
.mcard b{display:block;margin-top:10px;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard small{display:block;color:var(--dim);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.mood{position:relative;overflow:hidden;height:92px;border-radius:18px;padding:14px;background:hsl(var(--h) 50% 26%);border:1px solid hsl(var(--h) 60% 40% / .5);transition:transform .35s var(--ease)}
.mood:hover{transform:translateY(-4px) rotate(-1deg)}
.mood b{font:700 1.05rem var(--f-display);position:relative;z-index:1}
.mood .ic{position:absolute;right:-6px;bottom:-8px;width:62px;height:62px;opacity:.28;transform:rotate(-18deg)}
.mact{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.slist{display:grid;gap:2px}
.srow{display:grid;grid-template-columns:34px 52px minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:7px 10px;border-radius:14px;cursor:pointer;transition:background .2s}
.srow:hover{background:var(--surf)}
.srow .sn{text-align:center;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums;position:relative;height:20px}
.srow .sn .mini-eq{display:none;position:absolute;inset:3px 0 auto 0;justify-content:center}
.srow.playing .sn b{display:none}.srow.playing .sn .mini-eq{display:inline-flex}
.srow .sn.rk b{font:800 1.15rem var(--f-display);color:var(--text)}
.srow .sart{position:relative;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--surf2)}
.srow .sart img{width:100%;height:100%;object-fit:cover}

.srow .st{min-width:0;display:grid}
.srow .st b{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .st small{color:var(--dim);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.on .st b{color:var(--accent)}
.srow .sd{color:var(--dim);font-size:.82rem;font-variant-numeric:tabular-nums}

.mtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.mtc{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);text-align:left;transition:transform .3s var(--ease),border-color .25s}

.mtc small{color:var(--dim);font-size:.75rem;font-weight:700}

.mtc em{font-style:normal;color:var(--mute);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtc .pbtn{position:absolute;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

.afeat.music .ap.round{border-radius:50%}
.afeat.music .ap.sq{aspect-ratio:1;border-radius:20px}
.plcard{display:grid;gap:4px;text-align:left;padding:12px;border-radius:18px;background:var(--surf);border:1px solid var(--line);transition:transform .3s var(--ease),border-color .2s}

.asheet .sp{max-height:82vh;overflow-y:auto}

/* ---------- lazy script loader (with CDN fallback) ---------- */
const _sl={};
function loadScript(urls,test){
  const key=urls[0];
  if(test&&test())return Promise.resolve();
  if(_sl[key])return _sl[key];
  _sl[key]=(async()=>{
    for(const u of urls){
      try{
        await new Promise((res,rej)=>{
          const s=document.createElement('script');s.src=u;s.async=true;
          const to=setTimeout(()=>{s.remove();rej(new Error('timeout'))},14000);
          s.onload=()=>{clearTimeout(to);res()};
          s.onerror=()=>{clearTimeout(to);s.remove();rej(new Error('load'))};
          document.head.appendChild(s);
        });
        if(!test||test())return;
      }catch(e){}
    }
    delete _sl[key];
    throw new Error('Could not load the player library. Check your internet connection.');
  })();
  return _sl[key];
}

const DEFAULT_BASE='https://movieallshawon.vercel.app';
function computeBase(){
  const o=store.get('base','');
  if(o&&typeof o==='string')return o.replace(/\/+$/,'');
  if(/(^|\.)movieallshawon\.vercel\.app$/.test(location.hostname))return'';

}
let BASE=computeBase();
const abs=u=>{
  if(!u)return'';u=String(u).trim();
  if(/^(https?:|blob:|data:)/i.test(u))return u;
  if(u.startsWith('//'))return'https:'+u;
  if(u.startsWith('/'))return BASE+u;

};
const _cache=new Map();
function friendlyErr(e){
  if(!e)return new Error('Something went wrong');
  if(e.name==='AbortError')return Object.assign(new Error('The server took too long to respond'),{kind:'timeout'});
  if(e instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(e.message||''))
    return Object.assign(new Error('Cannot reach the API. Check your internet connection — or the server may be blocking this site (CORS).'),{kind:'network'});
  return e;
}
async function api(path,opt={}){
  const{timeout=25000,retries=1,ttl=0}=opt;
  const url=/^https?:/i.test(path)?path:BASE+path;
  if(ttl){const c=_cache.get(url);if(c&&Date.now()-c.t<ttl)return c.v}
  let last;
  for(let a=0;a<=retries;a++){
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),timeout);
    try{
      const r=await fetch(url,{signal:ctrl.signal});
      clearTimeout(to);
      if(!r.ok){
        let body='';try{body=(await r.text()).replace(/\s+/g,' ').slice(0,140)}catch(e){}
        const er=new Error('Server error '+r.status+(body?': '+body:''));er.status=r.status;
        if(r.status<500&&r.status!==429){er.final=true}
        throw er;
      }
      let data;
      try{data=await r.json()}catch(e){const er=new Error('The server sent an unreadable response');er.final=true;throw er}
      if(ttl)_cache.set(url,{t:Date.now(),v:data});
      return data;
    }catch(e){
      clearTimeout(to);last=e;
      if(e.final)break;
      if(a<retries)await sleep(700*(a+1));
    }
  }
  throw friendlyErr(last);
}

function normTmdb(it){
  if(!it)return null;

}

const SUBJ_ID=o=>o&&(o.subject_id||o.subjectId||o.subjectid||null);

function normMb(raw){
  const o=SUBJ_ID(raw)?raw:Object.assign({},raw.subject||{},raw);

  const rating=Number(o.imdb_rating||o.imdbRatingValue||o.rating||o.score||0);
  const year=String(o.year||o.release_date||o.releaseDate||'').slice(0,4);
  return{src:'mb',id,media:tv?'tv':'movie',title:o.title||o.name||'Untitled',year:/^\d{4}$/.test(year)?year:'',rating:isFinite(rating)?rating:0,
    poster:typeof cover==='string'?cover:'',overview:o.description||o.overview||o.summary||'',genre:o.genre||'',raw:o};
}
function mbSections(d){
  const secs=[];
  (function walk(n,ttl,depth){
    if(!n||typeof n!=='object'||depth>8)return;
    if(Array.isArray(n)){
      const subs=n.filter(isSubj);

        const fmt=guessFmt(uniq[0].url,n.format||n.type||n.ext||n.mime||n.mimeType)!=='auto'?guessFmt(uniq[0].url,n.format||n.type||n.ext||n.mime||n.mimeType):guessFmt(rawUrl,n.format||n.type||n.ext||'');

  if(a==='watch'&&b&&c)return pageWatch(b,c,parseInt(q.se||'1',10)||1,parseInt(q.ep||'1',10)||1,tok);
  if(a==='search')return pageSearch(b||q.q||'',q.tab||'',tok);
  if(a==='anime'){
    setMode('anime');
    if(b==='title'&&c)return pageAnimeTitle(c,tok);
    if(b==='watch'&&c)return pageAnimeWatch(c,parseInt(q.ep||'0',10)||0,tok);
    if(b==='catalog')return pageAnimeCatalog(tok);
    return pageAnimeHome(tok);
  }
  if(a==='mb'){
    setMode('mb');
    if(b==='title'&&c)return pageMbTitle(c,tok);
    if(b==='watch'&&c)return pageMbWatch(c,parseInt(q.se||'0',10)||0,parseInt(q.ep||'0',10)||0,q.t||'',tok);
    return pageMbHome(q.q||'',tok);
  }
  if(a==='hub'){
    setMode('hub');
    if(b==='t')return pageHubTitle(q.id||'',q.n||'',tok);
    return pageHubHome(q.q||'',tok);
  }
  if(a==='music'){
    setMode('music');
    if(b==='search')return pageMusicSearch(c||q.q||'',tok);
    if(b==='library')return pageMusicLibrary(c||q.tab||'',tok);
    if(b==='playlist'&&c)return pageMusicPlaylist(c,tok);
    if(b==='artist'&&c)return pageMusicArtist(c,tok);
    if(b==='trending')return pageMusicTrending(q.r||'',tok);
    if(b==='play'&&c)return pageMusicPlayLink(c,tok);
    return pageMusicHome(tok);
  }
  if(a==='np'){
    if(b==='watch'&&c)return pageNpWatch(c,q.t||'',tok);
    return pageNpHome(tok);
  }
  if(a==='dl')return pageDownloader(q.u||'',tok);
  if(a==='list')return pageList(tok);
  if(a==='status')return pageStatus(tok);
  setNav('');
  mount(stateHTML('search','Page not found','That page does not exist.','<a class="btn" href="#/">Go home</a>'));
}

/* ---------- search overlay ---------- */
let _sdeb=null,_sseq=0;
function openSearch(pref){
  const o=$('#sov');o.hidden=false;document.body.style.overflow='hidden';
  const i=$('#sq');if(typeof pref==='string')i.value=pref;
  setTimeout(()=>i.focus(),30);
  if(i.value.trim())liveSearch(i.value.trim());else renderQuick();
}
function closeSearch(){const o=$('#sov');if(o&&!o.hidden){o.hidden=true;document.body.style.overflow=''}}
function renderQuick(){
  $('#sres').innerHTML='';
}
async function liveSearch(q){
  const box=$('#sres');const my=++_sseq;
  if(!q){renderQuick();return}
  box.innerHTML='<div class="state"><div class="spin"></div></div>';
  const [t,a,ms]=await Promise.allSettled([api('/api/search?q='+enc(q),{ttl:120000,retries:0,timeout:15000}),api('/anime/search?q='+enc(q),{ttl:120000,retries:0,timeout:15000}),api('/music/search?q='+enc(q),{ttl:120000,retries:0,timeout:15000})]);
  if(my!==_sseq)return;
  const items=[];
  if(t.status==='fulfilled')tmdbList(t.value).slice(0,7).forEach(n=>items.push({href:`#/title/${n.media}/${n.id}`,title:n.title,sub:[n.year,n.media==='tv'?'Series':'Movie'].filter(Boolean).join(' • '),poster:n.poster,k:n.media==='tv'?'Series':'Movie'}));
  if(a.status==='fulfilled')((a.value&&a.value.items)||[]).slice(0,4).forEach(it=>items.push({href:`#/anime/title/${enc(it.slug||'')}`,title:it.title||'Untitled',sub:'Hindi dub',poster:it.poster,k:'Anime'}));
  if(ms.status==='fulfilled'&&typeof mList==='function')mList(ms.value).slice(0,4).forEach(m=>items.push({href:`#/music/play/${enc(m.id)}`,title:m.title,sub:m.artist||'Song',poster:m.thumb,k:'Song'}));
  if(!items.length){
    const failed=t.status==='rejected'&&a.status==='rejected'&&ms.status==='rejected';
    box.innerHTML=`<div class="state">${ic(failed?'alert':'search')}<h3>${failed?'Search is unavailable':'No matches'}</h3><p>${failed?esc(t.reason&&t.reason.message||''):'Try another spelling, or search all sources.'}</p><a class="btn line sm" href="#/search/${enc(q)}">Search all sources</a></div>`;
    return;
  }
  box.innerHTML=items.map(i=>`<a class="sitem" href="${esc(i.href)}"><div class="sp${i.poster?'':' noimg'}">${imgTag(i.poster,i.title)}</div><div><b>${esc(i.title)}</b><small>${esc(i.sub)}</small></div><span class="k">${esc(i.k)}</span></a>`).join('')
    +`<a class="btn line sm" style="margin:12px auto 0" href="#/search/${enc(q)}">See all results for “${esc(q)}”</a>`;
}
function wireSearch(){
  $('#sbtn').addEventListener('click',()=>openSearch());
  $('#sclose').addEventListener('click',closeSearch);
  $('#sov').addEventListener('click',e=>{if(e.target.id==='sov'||e.target.closest('.sitem,.btn'))closeSearch()});
  const i=$('#sq');
  i.addEventListener('input',()=>{clearTimeout(_sdeb);const v=i.value.trim();_sdeb=setTimeout(()=>liveSearch(v),320)});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=i.value.trim();if(v){location.hash='#/search/'+enc(v);closeSearch()}}});
  $('#squick').innerHTML=['Avatar','Spider-Man','Naruto','Jujutsu Kaisen','Stranger Things','Doraemon','One Piece'].map(t=>`<button class="pill" data-q="${esc(t)}">${esc(t)}</button>`).join('');
  $('#squick').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b){i.value=b.dataset.q;liveSearch(b.dataset.q);i.focus()}});
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    if(e.key==='Escape'){closeSearch();closeSheet();if(typeof closeModal==='function')closeModal()}
    if(e.key==='/'&&!['input','textarea','select'].includes(tag)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();openSearch()}
  });
  $$('[data-open-search]').forEach(b=>b.addEventListener('click',()=>openSearch()));
}
function openSheet(){$('#sheet').hidden=false}
function closeSheet(){const s=$('#sheet');if(s)s.hidden=true}
function wireSheet(){
  $('#moreTop').addEventListener('click',openSheet);
  $('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('a'))closeSheet()});
}

/* ===================================================================
   MovieAll — VPlayer: HLS + DASH + MP4, auto fail-over, subtitles,
   audio tracks, gestures, keyboard, resume, media-session
   =================================================================== */
class VPlayer{
  constructor(host,o){
    this.host=host;

  /* ---------- DOM ---------- */
  build(){

      <video playsinline preload="auto"></video>
      <div class="center"><div class="spinner"></div><div class="status"></div><button class="bigplay" data-a="play" aria-label="Play">${ic('play')}</button></div>
      <div class="flash l">−10s</div><div class="flash r">+10s</div>
      <div class="msg"></div>
      <div class="ui">
        <div class="top"><button class="cb" data-a="back" aria-label="Back">${ic('back')}</button><div class="t">${esc(o.title)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</div></div>
        <div class="bottom">
          <div class="seek" role="slider" aria-label="Seek"><div class="trk"><div class="buf"></div><div class="prg"></div><div class="knob"></div></div><div class="tip">0:00</div></div>
          <div class="ctl">
            <button class="cb pp" data-a="play" aria-label="Play/Pause">${ic('play')}</button>
            ${o.onPrev?`<button class="cb pv" data-a="prev" aria-label="Previous">${ic('prev')}</button>`:''}
            ${o.onNext?`<button class="cb nx" data-a="next" aria-label="Next">${ic('next')}</button>`:''}
            <div class="vol"><button class="cb" data-a="mute" aria-label="Mute">${ic('vol')}</button><input type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
            <span class="time">0:00 / 0:00</span><span class="sp"></span>
            <button class="cb txt" data-a="qmenu" aria-label="Quality" hidden></button>
            <button class="cb txt" data-a="amenu" aria-label="Audio track" hidden></button>
            <button class="cb" data-a="smenu" aria-label="Subtitles" hidden>${ic('cc')}</button>
            <button class="cb" data-a="gear" aria-label="Settings">${ic('gear')}</button>
            <button class="cb" data-a="pip" aria-label="Picture in picture">${ic('pip')}</button>
            <button class="cb" data-a="fs" aria-label="Fullscreen">${ic('fs')}</button>
          </div>
        </div>
      </div>
      <div class="menu" hidden></div>
      <div class="err" hidden></div>
    </div>`;
    const q=s=>this.host.querySelector(s);
    this.el=q('.vp');this.v=q('video');this.seekEl=q('.seek');this.prg=q('.prg');this.buf=q('.buf');this.knob=q('.knob');
    this.tip=q('.tip');this.timeEl=q('.time');this.menu=q('.menu');this.errEl=q('.err');this.msgEl=q('.msg');this.volIn=q('.vol input');
    this.statusEl=q('.status');this.qBtn=q('[data-a=qmenu]');this.aBtn=q('[data-a=amenu]');this.sBtn=q('[data-a=smenu]');this.ppBtn=q('.cb.pp');this.muteBtn=q('[data-a=mute]');this.fsBtn=q('[data-a=fs]');
  }
  /* ---------- events ---------- */
  bind(){
    const v=this.v,el=this.el;
    this._on=(t,ev,fn,opt)=>{t.addEventListener(ev,fn,opt);(this._offs=this._offs||[]).push(()=>t.removeEventListener(ev,fn,opt))};
    this._on(el,'pointerdown',e=>{this.ptype=e.pointerType||'mouse'});
    this._on(el,'click',e=>{
      const b=e.target.closest('[data-a]');
      if(b){this.action(b.dataset.a,b,e);return}
      const mi=e.target.closest('.menu button[data-v]');
      if(mi){this.menuPick(mi.dataset.k,mi.dataset.v);return}
      const mn=e.target.closest('.menu [data-go]');
      if(mn){this.menuPage=mn.dataset.go;this.renderMenu();return}
      if(e.target.closest('.menu,.err,.bigplay,.upnext,.seek,.ctl,.top .cb'))return;
      if(this.menuOpen){this.closeMenu();return}

    });
    this._on(el,'pointermove',()=>this.wake(),{passive:true});
    this._on(el,'touchstart',()=>this.wake(),{passive:true});
    this._on(el,'keydown',()=>this.wake());
    /* seek bar */
    const seek=this.seekEl;
    const pos=e=>{const r=seek.getBoundingClientRect();return clamp((e.clientX-r.left)/Math.max(1,r.width),0,1)};
    this._on(seek,'pointerdown',e=>{if(!isFinite(v.duration)||!v.duration)return;try{seek.setPointerCapture(e.pointerId)}catch(x){}this.drag=true;seek.classList.add('drag');this.previewSeek(pos(e))});

    this._on(v,'loadedmetadata',()=>{

    this._on(v,'canplay',()=>{clearTimeout(this.wd);this.setBusy(false)});
    this._on(v,'waiting',()=>this.setBusy(true));
    this._on(v,'playing',()=>{if(window.Music&&Music.isPlaying&&Music.isPlaying())Music.pause();this.started=true;this.stopTick();clearTimeout(this.wd);this.setBusy(false);this.el.classList.add('started','playing');this.setPP(true);this.wake();this.netRetry=0});
    this._on(v,'pause',()=>{this.el.classList.remove('playing');this.setPP(false);this.wake()});
    this._on(v,'ended',()=>{this.el.classList.remove('playing');this.setPP(false);if(this.o.onProgress)this.o.onProgress(v.duration,v.duration);if(this.o.onEnded)this.o.onEnded();else if(this.o.onNext){toast('Playing next…');this.o.onNext()}});
    this._on(v,'timeupdate',()=>{this.updateTime();this.saveProgress()});
    this._on(v,'progress',()=>this.updateBuf());
    this._on(v,'durationchange',()=>this.updateTime());
    this._on(v,'volumechange',()=>{this.muteBtn.innerHTML=ic(v.muted||v.volume===0?'mute':'vol');this.volIn.value=v.muted?0:v.volume});
    this._on(v,'error',()=>{if(this.dead||this.hls||this.dash)return;const c=v.error&&v.error.code;if(!v.getAttribute('src'))return;this.fail('media error '+(c||''))});

    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.metadata=new MediaMetadata({title:this.o.title||'MovieAll',artist:this.o.sub||'MovieAll',artwork:this.o.poster?[{src:abs(this.o.poster),sizes:'512x512'}]:[]});

        navigator.mediaSession.setActionHandler('seekforward',()=>this.skip(10));
        if(this.o.onNext)navigator.mediaSession.setActionHandler('nexttrack',()=>this.o.onNext());

  key(e){

    if(['input','textarea','select'].includes(t)&&e.target!==this.volIn)return;

    const inPlayer=this.el.contains(e.target);
    if(!inPlayer&&(e.key===' '||e.key==='Enter')&&/^(button|a|summary)$/.test((e.target.tagName||'').toLowerCase()))return;

      case'l':case'L':this.skip(10);break;
      case'ArrowUp':v.volume=clamp(v.volume+.05,0,1);v.muted=false;this.say('Volume '+Math.round(v.volume*100)+'%');break;
      case'ArrowDown':v.volume=clamp(v.volume-.05,0,1);this.say('Volume '+Math.round(v.volume*100)+'%');break;
      case'm':case'M':v.muted=!v.muted;break;
      case'f':case'F':this.toggleFs();break;
      case'c':case'C':this.cycleSub();break;
      case'n':case'N':if(this.o.onNext)this.o.onNext();else h=false;break;
      case'p':case'P':if(this.o.onPrev)this.o.onPrev();else h=false;break;

      case'<':this.setSpeed(Math.max(.5,this.speed-.25));break;

    if(h){e.preventDefault();this.wake()}
  }
  action(a,b,e){
    const v=this.v;
    switch(a){
      case'play':this.toggle();break;
      case'mute':v.muted=!v.muted;break;
      case'fs':this.toggleFs();break;
      case'pip':this.pip();break;
      case'gear':this.menuOpen?this.closeMenu():this.openMenu('root');break;
      case'qmenu':this.menuOpen&&this.menuPage==='q'?this.closeMenu():this.openMenu('q');break;
      case'amenu':this.menuOpen&&this.menuPage==='aud'?this.closeMenu():this.openMenu('aud');break;
      case'smenu':this.menuOpen&&this.menuPage==='sub'?this.closeMenu():this.openMenu('sub');break;
      case'report':navigator.clipboard&&navigator.clipboard.writeText(this.report()).then(()=>toast('Report copied'),()=>toast('Copy failed'));break;
      case'back':if(document.fullscreenElement||document.webkitFullscreenElement){this.toggleFs()}else if(this.o.onBack)this.o.onBack();else history.back();break;
      case'next':if(this.o.onNext)this.o.onNext();break;
      case'prev':if(this.o.onPrev)this.o.onPrev();break;
      case'retry':this.hideError();this.load(this.si);break;
      case'nextsrc':this.hideError();if(this.si<this.o.sources.length-1)this.load(this.si+1);else this.load(0);break;
      case'copy':navigator.clipboard&&navigator.clipboard.writeText(b.dataset.v||'').then(()=>toast('Copied'),()=>toast('Copy failed'));break;
      case'exhausted':if(this.o.onExhausted)this.o.onExhausted();break;

  }
  onTap(e){

    }

    this.tapT=setTimeout(()=>{
      this.lastTap=null;
      if(this.ptype==='touch'||this.ptype==='pen'){
        if(!this.v.paused&&!this.idle){this.setIdle(true)}

  }
  /* ---------- state helpers ---------- */
  setBusy(b){this.el.classList.toggle('busy',!!b)}
  setStatus(t){
    this.statusBase=t;this.busySince=Date.now();this.statusEl.textContent=t;
    clearInterval(this.tick);
    this.tick=setInterval(()=>{if(this.dead)return this.stopTick();const s=Math.round((Date.now()-this.busySince)/1000);if(s>=3)this.statusEl.textContent=this.statusBase+' · '+s+'s'},1000);
  }
  stopTick(){clearInterval(this.tick);this.tick=null;if(this.statusEl)this.statusEl.textContent=''}
  report(){

  setPP(p){this.ppBtn.innerHTML=ic(p?'pause':'play')}
  setIdle(i){this.idle=i;this.el.classList.toggle('idle',i)}
  wake(){

  }
  say(t){this.msgEl.textContent=t;this.msgEl.classList.add('show');clearTimeout(this.msgT);this.msgT=setTimeout(()=>this.msgEl.classList.remove('show'),1600)}

  skip(s,flash){
    const v=this.v;if(!isFinite(v.duration))return;
    v.currentTime=clamp(v.currentTime+s,0,v.duration);
    if(flash){const f=this.el.querySelector(s<0?'.flash.l':'.flash.r');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}

  }
  previewSeek(p){const d=this.v.duration;if(!isFinite(d))return;this.prg.style.width=(p*100)+'%';this.knob.style.left=(p*100)+'%';this.timeEl.textContent=fmtTime(p*d)+' / '+fmtTime(d)}
  updateTime(){
    const v=this.v,d=v.duration;
    if(!this.drag){

      this.prg.style.width=(p*100)+'%';this.knob.style.left=(p*100)+'%';
      this.timeEl.textContent=fmtTime(v.currentTime)+' / '+(isFinite(d)?fmtTime(d):'LIVE');
    }

      if(!this.upn){this.upn=document.createElement('button');this.upn.className='upnext';this.upn.dataset.a='next';this.upn.innerHTML='Next episode '+ic('next');this.el.appendChild(this.upn)}

  }
  updateBuf(){
    const v=this.v;if(!isFinite(v.duration)||!v.duration)return;
    let end=0;const t=v.currentTime;
    for(let i=0;i<v.buffered.length;i++){if(v.buffered.start(i)<=t+.5&&v.buffered.end(i)>=end)end=v.buffered.end(i)}
